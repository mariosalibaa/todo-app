<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Villa Tohme Solar · Shift Group</title>
<link rel="icon" href="/icons/hub-192.png">
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--green:#a6e3a1;--blue:#89b4fa;--red:#f38ba8;}
  *{box-sizing:border-box;}
  html,body{background:var(--base);}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--surface0);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1.05rem;}
  .wordmark span{color:var(--amber);} .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  .hback{color:var(--amber);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border:1px solid var(--surface0);border-radius:8px;}
  main{max-width:1240px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:1.25rem;font-weight:600;margin:0 0 4px;} .lead{color:var(--sub);font-size:.82rem;margin:0 0 14px;line-height:1.5;}
  select,button,input{background:var(--mantle);color:var(--text);border:1px solid var(--surface0);border-radius:7px;padding:6px 10px;font-size:.8rem;font-family:inherit;}
  button{cursor:pointer;} button:hover{border-color:var(--amber);}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
  .tabs button{border-radius:999px;} .tabs button.on{background:var(--amber);color:#1e1e2e;border-color:var(--amber);font-weight:600;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;padding:12px 14px;}
  .kpi b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;} .kpi span{font-size:.68rem;color:var(--overlay0);text-transform:uppercase;letter-spacing:.06em;}
  .kpi small{display:block;color:var(--sub);font-size:.7rem;margin-top:2px;}
  .kpi.solar b{color:var(--amber);} .kpi.edl b{color:var(--blue);} .kpi.gen b{color:var(--red);} .kpi.mix b{color:#cba6f7;} .kpi.exp b{color:var(--green);}
  .card{background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.8rem;}
  th{font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--overlay0);font-weight:600;text-align:right;padding:8px;border-bottom:1px solid var(--surface0);white-space:nowrap;}
  th small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.62rem;}
  th:first-child,td:first-child{text-align:left;}
  td{padding:7px 8px;border-bottom:1px solid var(--surface0);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  td small{display:block;color:var(--overlay0);font-size:.64rem;}
  td.mix{color:#cba6f7;} td.edl{color:var(--blue);} td.gen{color:var(--red);} td.sol{color:var(--amber);} td.exp{color:var(--green,#a6e3a1);} td.def{color:var(--red);}
  td .z{color:var(--surface1);}
  tr.row{cursor:pointer;} tr.row:hover td{background:var(--surface0);}
  tr.day td{background:rgba(49,50,68,.35);font-size:.74rem;}
  tr.tot td{font-weight:600;border-top:2px solid var(--amber);color:var(--amber);background:rgba(242,169,59,.08);}
  tr.short td:first-child::after{content:" ·";color:var(--red);}
  .note{background:var(--mantle);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.78rem;color:var(--sub);line-height:1.55;margin-top:14px;}
  .note b{color:var(--text);font-weight:600;}
  .err{color:var(--red);font-size:.8rem;margin:8px 0;}
  .mh{font-size:.95rem;margin:22px 0 8px;font-weight:600;}
  #ptr{position:fixed;left:50%;top:0;transform:translate(-50%,-60px);background:var(--amber);color:#1e1e2e;font-weight:600;font-size:.8rem;padding:8px 14px;border-radius:0 0 12px 12px;z-index:60;transition:transform .15s;}
  .ph{display:none;}
  .mn{white-space:nowrap;} .views{margin:-2px 0 12px;} .views button{border-radius:8px;}
  tr.chart>td{padding:10px 12px 14px;background:rgba(49,50,68,.25);white-space:normal;text-align:left;}
  canvas.pp{width:100%;height:320px;display:block;} .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.7rem;color:var(--sub);margin:6px 0 2px;} .legend i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:4px;}
  .chartNote{font-size:.74rem;color:var(--sub);line-height:1.5;margin-top:6px;}
  .sim{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.78rem;color:var(--sub);}
  .sim[hidden],.sim [hidden]{display:none !important;} .scen{margin-bottom:14px;} .scen td:first-child{font-weight:600;} .scen tr.on td{background:rgba(242,169,59,.10);} #app.cur .up{display:none !important;} .kgrp{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--overlay0);margin:2px 0 6px;} .sim b{color:var(--text);font-weight:600;} .sim label{display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .sim input{width:70px;padding:4px 6px;text-align:right;} .sim select{padding:4px 6px;}
  .kpi.thrown b{color:var(--amber);} .kpi.rack b{color:var(--green);}
  @media (max-width:640px){ canvas.pp{height:240px;} }
  /* a laptop window: export, EDL + gen and battery out step aside (export is in the boxes, EDL + gen = grid + gen) so the table fits without a sideways scroll */
  @media (max-width:1700px){ .hide-md{display:none;} th,td{padding-left:6px;padding-right:6px;} }
  @media (max-width:1100px){ .hide-lg{display:none;} th,td{padding-left:4px;padding-right:4px;} table{font-size:.76rem;} }
  /* the phone: the table fits the width — days, battery and solar share move under the month name */
  @media (max-width:640px){
    header{padding:12px 16px;} main{padding:14px 12px 40px;}
    h1{font-size:1.05rem;} .lead{font-size:.76rem;}
    .kpis{grid-template-columns:1fr 1fr;gap:8px;} .kpi{padding:10px 12px;} .kpi b{font-size:1.1rem;} .kpi small{font-size:.64rem;}
    #app:not(.cur) .pz{display:none;}   /* Upgrade view: the two upgrade columns take the place of the port columns (Solar − load = what EDL + gen carried) so the table fits */
    .hide-sm{display:none;} .ph{display:block;color:var(--overlay0);font-size:.6rem;margin-top:1px;}
    table{font-size:.74rem;} th{padding:7px 4px;font-size:.54rem;} td{padding:7px 4px;}
    td:first-child,th:first-child{padding-left:10px;} td:last-child,th:last-child{padding-right:10px;}
    tr.day td{font-size:.7rem;}
    th small{display:none;} td:first-child{white-space:normal;} .ph{max-width:110px;line-height:1.3;}
    .note{font-size:.74rem;}
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">SHIFT <span>GROUP</span><small>MAKE THE SHIFT</small></div>
  <a class="hback" href="/" id="hubLink" hidden>Hub</a>
</header>
<div id="ptr">↓ Pull to refresh</div>
<main>
  <div id="app" hidden>
    <h1>Villa Tohme — The House of Christmas — 40.7 kWp</h1>
    <p class="lead" id="lead">Energy per month from DeyeCloud (station 61475496), integrated from the 5-minute power readings, since Shift installed the plant in April 2025.</p>
    <div class="tabs" id="years"></div>
    <div class="tabs views" id="views"><button data-v="current" class="on">Current</button><button data-v="energy">Upgrade</button><button data-v="batt">Second battery rack</button><button data-v="series">Panel series</button></div>
    <div class="sim" id="sim" hidden>
      <b>Add panels</b>
      <label><input id="sN" type="number" min="0" step="1"> panels ×</label>
      <label><input id="sW" type="number" min="0" step="5"> W</label>
      <label>at <input id="sC" type="number" min="0" step="0.01"> $/W installed</label>
      <label>battery <select id="sB"><option value="0">as now (60 kWh)</option><option value="1">+ second rack 60 kWh</option></select></label>
      <label id="sRl">rack <input id="sR" type="number" min="0" step="100"> $</label>
      <label>a kWh of EDL / generator = <input id="sK" type="number" min="0" step="0.01"> $</label>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card scen" id="scen" hidden></div>
    <div class="card"><table id="tbl"></table></div>
    <div class="err" id="err"></div>
    <div class="note" id="note"></div>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmt = v => v == null ? '' : (Math.abs(v) < 0.05 ? '<span class="z">0</span>' : Math.round(v).toLocaleString('en-US'));
  // solar − load; blank where there is no solar series (before 6 Aug 2025)
  const dif = (t, one) => !t.pv ? '' : (one ? fmt1 : fmt)(t.pv - t.useS).replace(/^(?!<)/, t.pv - t.useS < 0 ? '' : '+');
  const fmt1 = v => v == null ? '' : (Math.abs(v) < 0.05 ? '<span class="z">0</span>' : (Math.round(v * 10) / 10).toLocaleString('en-US'));
  const pc = (a, b) => b > 0 ? Math.round(a / b * 100) + ' %' : '';
  let D = null, year = null, open = {}, view = 'current', openDay = null, dayCache = {};
  const yearAgo = () => { const t = D.today || D.days[D.days.length - 1]; return (+t.slice(0, 4) - 1) + t.slice(4); };
  const fmtDay = d => `${+d.slice(8)} ${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
  // the filter: a year, "last12" (the same date a year ago → today) or "all" (every day DeyeCloud has, since 26 Apr 2025)
  const inYear = d => year === 'all' ? true : year === 'last12' ? d >= yearAgo() : d.slice(0, 4) === year;
  const totLabel = from => year === 'all' ? `Total ${fmtDay(from)} → ${fmtDay(D.today || D.days[D.days.length - 1])}` : year === 'last12' ? `Total ${fmtDay(yearAgo())} → ${fmtDay(D.today || D.days[D.days.length - 1])}` : 'Total ' + year;

  // one day of the add-panels model: n panels × w W, rack 0/1 → nk produced, uk replacing EDL / generator (see split)
  function simDay(m, n, w, rack) {
    const nk = n * w / 1000 * m.y;
    return { nk, uk: rack ? Math.min(nk + m.thr, m.dft, m.room + 54) : Math.min(nk, m.dft, m.room) };
  }
  // one day → the sources: the grid port = EDL, the generator port = the generator, export = what went out on either port
  function split(day, v) {
    // what the added panels would have done that day (only days with a solar series and the battery analysis):
    //   nk  = their production: added kWp × what one installed kWp could give that day ((solar + thrown) ÷ 40.71)
    //   dft = the deficit, load − solar (what EDL + the generator carried)
    //   uk  = the part that would have replaced EDL / generator — never more than the deficit, and never more than the
    //         battery can still take: with the battery as now, a day it filled already throws solar away, so the new
    //         panels add nothing; a day it didn't fill, they add at most what was missing ((100 − max SOC) % of 60 kWh).
    //         With a second rack: + 54 kWh room, and the thrown solar becomes usable too (rk = the rack alone).
    //   Daytime load carried by EDL / the generator while the battery was charging isn't counted — uk is low-side.
    const b = D.batt[day], pvOk = v.pv != null && !!b;
    const sm = pvOk ? { thr: b.fullAt ? b.thrown || 0 : 0, room: b.fullAt ? 0 : Math.max(0, 100 - (b.socMax || 0)) / 100 * 60,
      y: ((v.pv || 0) + (b.fullAt ? b.thrown || 0 : 0)) / (D.kwp || 40.71), dft: Math.max(0, (v.use || 0) - (v.pv || 0)) } : null;
    const r0 = sm ? simDay(sm, SIM.n, SIM.w, SIM.b) : null, nk = r0 ? r0.nk : 0, uk = r0 ? r0.uk : 0, dft = sm ? sm.dft : 0, rk = sm && SIM.b ? simDay(sm, 0, 0, 1).uk : 0;
    const bb = b && day >= (D.rack.from || '0') ? b : null;
    const bat = bb ? { bD: 1, bF: bb.fullAt ? 1 : 0, bM: bb.fullAt ? hm(bb.fullAt) : 0, bT: bb.fullAt ? bb.thrown || 0 : 0, bS: bb.fullAt ? bb.store || 0 : 0,
      bN: bb.night != null ? bb.night : 0, bNd: bb.night != null ? 1 : 0, bR: bb.replaced || 0 } : {};
    return { ...bat, sm, nk, uk, rk, dft, pv: v.pv || 0, use: v.use || 0, dis: v.discharge || 0, n: v.n || 0, edl: v.gridIn || 0, exp: (v.genOut || 0) + (v.gridOut || 0), gen: v.gen || 0, mix: 0, useS: v.pv == null ? 0 : (v.use || 0),
      pot: v.pv == null ? 0 : (v.pv || 0) + ((D.batt[day] || {}).fullAt ? D.batt[day].thrown || 0 : 0) };   // useS = load on days with a solar series (for solar − load); pot = solar + the part thrown while the battery was full
  }
  const add = (a, b) => { for (const k of ['bD', 'bF', 'bM', 'bT', 'bS', 'bN', 'bNd', 'bR', 'nk', 'uk', 'rk', 'dft', 'pv', 'pot', 'use', 'useS', 'dis', 'edl', 'exp', 'gen', 'mix', 'n']) a[k] = (a[k] || 0) + (b[k] || 0); a.days = (a.days || 0) + 1; return a; };

  // the add-panels simulation — Mario sets the panels, W, prices; kept in this browser
  const SIM = { n: 20, w: 590, c: 0.30, b: 0, r: 10000, k: 0.30 };
  try { Object.assign(SIM, JSON.parse(localStorage.getItem('tohmeSim') || '{}')); } catch (e) {}
  const simIds = { sN: 'n', sW: 'w', sC: 'c', sB: 'b', sR: 'r', sK: 'k' };
  for (const id in simIds) { $(id).value = SIM[simIds[id]]; $(id).addEventListener('input', () => { SIM[simIds[id]] = +$(id).value || 0; try { localStorage.setItem('tohmeSim', JSON.stringify(SIM)); } catch (e) {} render(); }); }


  async function load() {
    const r = await fetch('/api/tohme', { credentials: 'same-origin' });
    D = await r.json();
    if (D.isAdmin && !document.getElementById('plantCrumbs')) $('hubLink').hidden = false;
    $('app').hidden = false;
    if (D.error) $('err').textContent = 'DeyeCloud not reachable right now (' + D.error + ') — showing the stored days.';
    const ys = [...new Set(D.days.map(d => d.slice(0, 4)))];
    if (!year) year = ys[ys.length - 1];
    // "Last 12 months" = the same date a year ago → today (Mario 2026-10-13: "13 oct 2025 to 13 oct 2026")
    $('years').innerHTML = ys.map(y => `<button data-y="${y}" class="${y === year ? 'on' : ''}">${y}</button>`).join('') + `<button data-y="last12" class="${year === 'last12' ? 'on' : ''}">Last 12 months</button><button data-y="all" class="${year === 'all' ? 'on' : ''}">All</button>`;
    render();
  }

  function render() {
    // Current = the same page without the upgrade study: everything marked .up is hidden (#app.cur)
    $('app').classList.toggle('cur', view === 'current');
    $('sim').hidden = $('scen').hidden = view !== 'energy'; $('sRl').hidden = !SIM.b;
    if (view === 'batt') return renderBatt();
    if (view === 'series') return renderSeries();
    const months = {};
    const fi = D.fields.reduce((o, f, i) => (o[f] = i, o), {});
    D.days.forEach((d, i) => {
      if (!inYear(d)) return;
      const a = D.data[i]; if (!a) return;
      const v = {}; for (const f in fi) v[f] = a[fi[f]];
      const s = split(d, v); s.day = d;
      const k = d.slice(0, 7); (months[k] = months[k] || { list: [], t: {} }).list.push(s); add(months[k].t, s);
    });
    const keys = Object.keys(months).sort().reverse();
    const T = keys.reduce((t, k) => add(t, months[k].t), {}); T.days = keys.reduce((n, k) => n + months[k].list.length, 0);
    const supply = T.pv + T.edl + T.gen + T.mix;
    const split1 = keys.flatMap(k => months[k].list).filter(s => s.day >= '2025-08-06');
    const alone = split1.filter(s => s.edl + s.gen < 1).length;
    const best = split1.reduce((b, s) => !b || s.edl + s.gen < b.edl + b.gen ? s : b, null);
    $('kpis').innerHTML = '<div class="kgrp" style="grid-column:1/-1">Energy</div>' +
      `<div class="kpi solar"><span>Solar</span><b>${fmt(T.pv)} kWh</b><small>${pc(T.pv, supply)} of supply</small></div>` +
      `<div class="kpi edl"><span>Port grid</span><b>${fmt(T.edl)} kWh</b><small>EDL — ${pc(T.edl, supply)} of supply</small></div>` +
      `<div class="kpi gen"><span>Port gen</span><b>${fmt(T.gen)} kWh</b><small>generator — ${pc(T.gen, supply)} of supply</small></div>` +
      `<div class="kpi exp"><span>Export</span><b>${fmt(T.exp)} kWh</b><small>sent out on the grid + gen ports</small></div>` +
      `<div class="kpi"><span>Consumption</span><b>${fmt(T.use)} kWh</b><small>${T.days} days</small></div>` +
      `<div class="kpi solar"><span>Days on solar alone</span><b>${alone} days</b><small>of ${split1.length} — no EDL, no generator${best ? ` · best ${fmtDay(best.day)}: ${fmt(best.edl + best.gen)} kWh in` : ''}</small></div>`;
    // the simulation, over the days of the range that have a model
    const kwpAdd = SIM.n * SIM.w / 1000, cost = kwpAdd * 1000 * SIM.c + (SIM.b ? SIM.r : 0);
    const simDays = split1.filter(s => D.batt[s.day]).length, perYear = simDays ? 365 / simDays : 0;
    const save = T.uk * SIM.k, saveY = save * perYear, pay = saveY > 0 ? cost / saveY : null;
    $('kpis').innerHTML += '<div class="kgrp" style="grid-column:1/-1">Battery</div>' +
      `<div class="kpi"><span>Battery full</span><b>${T.bF || 0} days</b><small>of ${T.bD || 0} · on average at ${T.bF ? mh(T.bM / T.bF) : '—'}</small></div>` +
      `<div class="kpi thrown"><span>Solar thrown</span><b>${fmt(T.bT)} kWh</b><small>panels throttled while the battery was full</small></div>` +
      `<div class="kpi rack up"><span>A second rack would store</span><b>${fmt(T.bS)} kWh</b><small>54 kWh a day at most (60 kWh, 90 % usable)</small></div>` +
      `<div class="kpi mix"><span>Night generator + EDL</span><b>${fmt(T.bN)} kWh</b><small>${T.bNd || 0} nights after a full battery</small></div>` +
      `<div class="kpi rack up"><span>It would have replaced</span><b>${fmt(T.bR)} kWh</b><small>${pc(T.bR, T.bN)} of those nights</small></div>` +
      '<div class="kgrp up" style="grid-column:1/-1">Add panels / a rack — from the settings above</div>' +
      `<div class="kpi solar up"><span>+ ${fmt1(kwpAdd)} kWp would produce</span><b>${fmt(T.nk)} kWh</b><small>${SIM.n} × ${SIM.w} W over ${simDays} days, per kWp like the panels on the roof</small></div>` +
      `<div class="kpi rack up"><span>Would replace EDL + gen</span><b>${fmt(T.uk)} kWh</b><small>${pc(T.uk, T.dft)} of the ${fmt(T.dft)} kWh deficit${SIM.b ? ` · the rack alone ${fmt(T.rk)}` : ' · battery as now'}</small></div>` +
      `<div class="kpi up"><span>Cost</span><b>$${fmt(cost)}</b><small>panels $${fmt(kwpAdd * 1000 * SIM.c)}${SIM.b ? ` + rack $${fmt(SIM.r)}` : ''}</small></div>` +
      `<div class="kpi exp up"><span>Saves</span><b>$${fmt(saveY)} / year</b><small>$${fmt(save)} in these ${simDays} days at $${SIM.k} a kWh</small></div>` +
      `<div class="kpi ${pay && pay < 6 ? 'exp' : 'gen'} up"><span>Pays back in</span><b>${pay ? (Math.round(pay * 10) / 10) + ' y' : 'never'}</b><small>cost ÷ yearly saving</small></div>`;
    // the two parts apart (Mario 2026-10-22): the rack alone (no new panels) and what the panels add on top of it
    // (on top of the battery as now when no rack is chosen) — each with its own cost and payback
    const yrs = (c, s) => s > 0 ? (Math.round(c / s * 10) / 10) + ' y' : 'never';
    const pK = T.uk - T.rk, pY = pK * SIM.k * perYear, pCost = kwpAdd * 1000 * SIM.c, rY = T.rk * SIM.k * perYear;
    $('kpis').innerHTML +=
      `<div class="kpi solar up"><span>Panels ${SIM.b ? 'on top of the rack' : 'alone'}</span><b>$${fmt(pY)} / year</b><small>${fmt(pK * perYear)} kWh a year · $${fmt(SIM.n ? pY / SIM.n : 0)} a year per panel (cost $${fmt(SIM.w * SIM.c)}) · pays back in ${yrs(pCost, pY)}</small></div>` +
      (SIM.b ? `<div class="kpi rack up"><span>Second rack alone</span><b>$${fmt(rY)} / year</b><small>${fmt(T.rk * perYear)} kWh a year from the solar thrown now · cost $${fmt(SIM.r)} · pays back in ${yrs(SIM.r, rY)}</small></div>` : '');
    // the five options side by side (Mario 2026-10-22), at the W / prices set above, over the days of this range
    const simList = keys.flatMap(k => months[k].list).filter(x => x.sm);
    const SC = [['Second rack alone', 0, 1], ['10 panels alone', 10, 0], ['20 panels alone', 20, 0], ['10 panels + rack', 10, 1], ['20 panels + rack', 20, 1], ['30 panels + rack', 30, 1], ['40 panels + rack', 40, 1]];
    if (SIM.n && !(SIM.b ? [10, 20, 30, 40] : [10, 20]).includes(SIM.n)) SC.push([`${SIM.n} panels${SIM.b ? ' + rack' : ' alone'} (set above)`, SIM.n, SIM.b]);
    const dSum = simList.reduce((a, x) => a + x.sm.dft, 0);
    // two more paybacks per option (Mario 2026-10-22): the rack's own (rack cost ÷ what the rack alone saves) and the
    // panels' own (panel cost ÷ what they add — on top of the rack when there is one, on top of the battery as now otherwise)
    const ukOf = (n, rack) => simList.reduce((a, x) => a + simDay(x.sm, n, SIM.w, rack).uk, 0);
    const rackSy = ukOf(0, 1) * perYear * SIM.k;
    const pbCell = (c, s) => `<td class="${s > 0 && c / s < 6 ? 'exp' : 'def'}">${yrs(c, s)}</td>`;
    $('scen').innerHTML = `<table><tr><th>Option<small>${SIM.w} W panels · $${SIM.c}/W · rack $${fmt(SIM.r)} · $${SIM.k} a kWh</small></th><th class="hide-sm">New solar<small>kWh a year</small></th><th class="hide-sm">Replaces<small>EDL + gen kWh a year</small></th><th class="hide-sm">Of the deficit</th><th>Cost</th><th>Saves<small>a year</small></th><th>Pays back</th><th>Rack only<small>pays back</small></th><th>Panels alone<small>pays back</small></th></tr>` +
      SC.map(([label, n, rack]) => {
        const r = simList.reduce((a, x) => { const o = simDay(x.sm, n, SIM.w, rack); a.nk += o.nk; a.uk += o.uk; return a; }, { nk: 0, uk: 0 });
        const c = n * SIM.w * SIM.c + (rack ? SIM.r : 0), sy = r.uk * perYear * SIM.k, on = n === SIM.n && rack === SIM.b;
        const pSy = sy - (rack ? rackSy : 0), pC = n * SIM.w * SIM.c;
        return `<tr class="${on ? 'on' : ''}"><td>${label}</td><td class="sol hide-sm">${n ? fmt(r.nk * perYear) : '—'}</td><td class="exp hide-sm">${fmt(r.uk * perYear)}</td><td class="hide-sm">${pc(r.uk, dSum)}</td><td>$${fmt(c)}</td><td class="exp">$${fmt(sy)}</td>${pbCell(c, sy)}` +
          (rack ? pbCell(SIM.r, rackSy) : '<td>—</td>') + (n ? pbCell(pC, pSy) : '<td>—</td>') + '</tr>';
      }).join('') + '</table>';
    if (window.GraphHover) GraphHover.attachAll();
    const head = `<tr><th>Month</th><th class="hide-sm hide-lg">Days</th><th>Solar</th><th class="pz">Port grid<small>EDL</small></th><th class="hide-md">Export<small>grid + gen port</small></th>` +
      `<th class="pz">Port gen<small>generator</small></th><th class="hide-sm hide-md">EDL + gen<small>bought in</small></th><th>Load</th><th>Solar − load<small>deficit</small></th><th class="up">New panels<small>kWh</small></th><th class="up">Replaces<small>EDL + gen kWh</small></th><th class="hide-sm hide-md">Battery out</th><th class="hide-sm hide-lg">Solar share</th><th class="hide-sm">Days full<small>battery</small></th><th class="hide-sm hide-md">Full at<small>average</small></th><th class="hide-sm">Solar thrown<small>kWh</small></th><th class="hide-sm hide-md up">Rack would store<small>kWh</small></th><th class="hide-sm hide-md">Night gen + EDL<small>kWh</small></th><th class="hide-sm up">Rack replaces<small>kWh</small></th></tr>`;
    const bcells = (t, one) => !t.bD ? '<td class="hide-sm"></td><td class="hide-sm hide-md"></td><td class="hide-sm"></td><td class="hide-sm hide-md up"></td><td class="hide-sm hide-md"></td><td class="hide-sm up"></td>' :
      `<td class="hide-sm">${one ? (t.bF ? '✓' : '') : t.bF + ' / ' + t.bD}</td><td class="hide-sm hide-md">${t.bF ? mh(t.bM / t.bF) : '—'}</td><td class="sol hide-sm">${(one ? fmt1 : fmt)(t.bT)}</td>` +
      `<td class="exp hide-sm hide-md up">${(one ? fmt1 : fmt)(t.bS)}</td><td class="mix hide-sm hide-md">${t.bNd ? (one ? fmt1 : fmt)(t.bN) : ''}</td><td class="exp hide-sm up">${(one ? fmt1 : fmt)(t.bR)}</td>`;
    const phx = t => `<span class="ph">${t.days} days · battery ${fmt(t.dis)} · solar ${pc(t.pv, t.pv + t.edl + t.gen + t.mix)}</span>`;
    const line = (cls, label, t, attr) => `<tr class="${cls}" ${attr || ''}><td>${label}${phx(t)}</td><td class="hide-sm hide-lg">${t.days}</td>` +
      `<td class="sol">${fmt(t.pv)}</td><td class="edl pz">${fmt(t.edl)}</td><td class="exp hide-md">${fmt(t.exp)}</td><td class="mix pz">${fmt(t.mix + t.gen)}</td><td class="hide-sm hide-md">${fmt(t.edl + t.gen + t.mix)}</td>` +
      `<td>${fmt(t.use)}</td><td class="def">${dif(t)}</td><td class="sol up">${t.nk ? fmt(t.nk) : ''}</td><td class="exp up">${t.nk ? fmt(t.uk) : ''}</td><td class="hide-sm hide-md">${fmt(t.dis)}</td><td class="hide-sm hide-lg">${pc(t.pv, t.pv + t.edl + t.gen + t.mix)}</td>${bcells(t)}</tr>`;
    let rows = '';
    for (const k of keys) {
      const m = months[k], [y, mo] = k.split('-');
      const live = D.today && D.today.startsWith(k);
      rows += line('row', `${MONTHS[+mo - 1]} ${y}${live ? ' <small>to today</small>' : ''}`, m.t, `data-m="${k}"`);
      if (open[k]) for (const s of m.list.slice().reverse()) {
        const dd = +s.day.slice(8), t = { ...s, days: '' };
        rows += `<tr class="day${s.n < 250 && s.day !== D.today ? ' short' : ''}"><td>${dd} ${MONTHS[+mo - 1]}${s.day === D.today ? ' <small>so far</small>' : ''}<span class="ph">${s.n < 250 ? s.n + '/288 readings · ' : ''}solar ${pc(s.pv, s.pv + s.edl + s.gen + s.mix)}</span></td><td class="hide-sm hide-lg">${s.n < 250 ? s.n + '/288' : ''}</td>` +
          `<td class="sol">${fmt1(s.pv)}</td><td class="edl pz">${fmt1(s.edl)}</td><td class="exp hide-md">${fmt1(s.exp)}</td><td class="mix pz">${fmt1(s.mix + s.gen)}</td><td class="hide-sm hide-md">${fmt1(s.edl + s.gen + s.mix)}</td><td>${fmt1(s.use)}</td><td class="def">${dif(s, 1)}</td><td class="sol up">${s.nk ? fmt1(s.nk) : ''}</td><td class="exp up">${s.nk ? fmt1(s.uk) : ''}</td><td class="hide-sm hide-md">${fmt1(s.dis)}</td><td class="hide-sm hide-lg">${pc(s.pv, s.pv + s.edl + s.gen + s.mix)}</td>${bcells(s, 1)}</tr>`;
      }
    }
    rows += line('tot', totLabel(D.days[0]), T);
    $('tbl').innerHTML = head + rows;
    $('note').innerHTML =
      `<b>Solar − load</b> = solar minus consumption — negative is what the panels fell short of the house (the deficit EDL + the generator filled). <span class="up"><b>Battery columns</b> = the Second battery rack tab, month by month (from 6 Aug 2025) — that tab has the method and each day's chart. <b>Add panels.</b> <b>New panels</b> = what the added panels would have produced each day, per kWp like the 40.71 kWp on the roof (solar + what was thrown while the battery was full). <b>Replaces</b> = the part that would have taken over from EDL + the generator: never more than the deficit, and never more than the battery can still take — with the battery as now, a day it already filled from the sun gains nothing (the inverter is already throwing solar away), a day it didn't fill gains at most what was missing. With a second rack, 54 kWh more room and that day's thrown solar counts too. Daytime load EDL / the generator carried while the battery charged isn't counted, so Replaces is on the low side. Saves per year = Replaces scaled to 365 days. </span><b>Days on solar alone</b> = days with under 1 kWh in from EDL and the generator together, counted from 6 Aug 2025 (before that no split). ` +
      `<b>Ports.</b> EDL comes into the inverter on its grid port (blue), the generator on its generator port (purple); Export is what went back out on either port. ` +
      `<b>Before 6 Aug 2025</b> DeyeCloud kept only the total production, no solar / generator split — those months show load, grid and battery only. Until Jan 2026 the logger sent about 258 readings a day instead of 288. ` +
      `<b>Method.</b> kWh = sum of the 5-minute readings × 5 min (288 a day). A day with missing readings (red dot, tap a month to see the days) is under-counted, never averaged up. ` +
      `Same method as the Taan plant, checked there against DeyeCloud's own Excel export. Tap a month for its days.`;
  }


  // ── the second-rack case ────────────────────────────────────────────────────────────────────────────────────
  // per day (server tohme-batt.js): battery full at, the daylight window it stayed full, solar thrown in that window
  // (clear-sky curve fitted to the same morning − what the panels gave), what a 60 kWh rack (90 % usable) would have
  // stored, the night's generator + grid, and what the rack would have replaced.
  const inRange = d => d >= (D.rack.from || '0') && inYear(d);
  const hm = s => s ? +s.slice(0, 2) * 60 + +s.slice(3) : null;
  const mh = m => m == null ? '—' : `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.round(m % 60)).padStart(2, '0')}`;
  function renderBatt() {
    const months = {};
    D.days.forEach(d => {
      if (!inRange(d)) return;
      const b = D.batt[d]; if (!b) return;
      const k = d.slice(0, 7); (months[k] = months[k] || { list: [], t: { days: 0, full: 0, mins: 0, thrown: 0, store: 0, night: 0, replaced: 0, nightDays: 0 } }).list.push({ day: d, ...b });
      const t = months[k].t; t.days++;
      if (b.fullAt) { t.full++; t.mins += hm(b.fullAt); t.thrown += b.thrown || 0; t.store += b.store || 0; }
      if (b.night != null) { t.night += b.night; t.replaced += b.replaced || 0; t.nightDays++; }
    });
    const keys = Object.keys(months).sort().reverse();
    const T = { days: 0, full: 0, mins: 0, thrown: 0, store: 0, night: 0, replaced: 0, nightDays: 0 };
    keys.forEach(k => { for (const f in T) T[f] += months[k].t[f]; });
    $('kpis').innerHTML =
      `<div class="kpi"><span>Battery full</span><b>${T.full} days</b><small>of ${T.days} · on average at ${T.full ? mh(T.mins / T.full) : '—'}</small></div>` +
      `<div class="kpi thrown"><span>Solar thrown</span><b>${fmt(T.thrown)} kWh</b><small>panels throttled while the battery was full</small></div>` +
      `<div class="kpi rack up"><span>A second rack would store</span><b>${fmt(T.store)} kWh</b><small>60 kWh rack, 90 % usable = 54 kWh a day at most</small></div>` +
      `<div class="kpi mix"><span>Night generator + EDL</span><b>${fmt(T.night)} kWh</b><small>${T.nightDays} nights after a full battery</small></div>` +
      `<div class="kpi rack up"><span>It would have replaced</span><b>${fmt(T.replaced)} kWh</b><small>${pc(T.replaced, T.night)} of those nights</small></div>`;
    const head = `<tr><th>Month</th><th class="hide-sm">Days full<small>of days</small></th><th>Full at<small>average</small></th><th>Solar thrown<small>kWh</small></th><th>Rack would store<small>kWh</small></th><th class="hide-sm">Night gen + EDL<small>kWh</small></th><th>Would replace<small>kWh</small></th></tr>`;
    const line = (cls, label, t, attr) => `<tr class="${cls}" ${attr || ''}><td><span class="mn">${label}</span><span class="ph">${t.full}/${t.days} full</span></td><td class="hide-sm">${t.full} / ${t.days}</td>` +
      `<td>${t.full ? mh(t.mins / t.full) : '—'}</td><td class="sol">${fmt(t.thrown)}</td><td class="exp">${fmt(t.store)}</td><td class="hide-sm mix">${fmt(t.night)}</td><td class="exp">${fmt(t.replaced)}</td></tr>`;
    let rows = '';
    for (const k of keys) {
      const m = months[k], [y, mo] = k.split('-');
      rows += line('row', `${MONTHS[+mo - 1]} ${y}${D.today && D.today.startsWith(k) ? ' <small>to today</small>' : ''}`, m.t, `data-m="${k}"`);
      if (open[k]) for (const b of m.list.slice().reverse()) {
        const dd = +b.day.slice(8);
        rows += `<tr class="row day" data-d="${b.day}"><td>${dd} ${MONTHS[+mo - 1]}${b.day === D.today ? ' <small>so far</small>' : ''}<span class="ph">${b.fullAt ? 'full ' + b.fullAt + ' → ' + b.clipTo : b.fullOther ? '100 % at ' + b.fullOther.at + ' from ' + b.fullOther.from : 'max ' + b.socMax + ' %'}</span></td>` +
          `<td class="hide-sm">${b.fullAt ? '<small>full ' + b.fullAt + ' → ' + b.clipTo + '</small>' : b.fullOther ? '<small>100 % at ' + b.fullOther.at + ' from ' + b.fullOther.from + '</small>' : '<small>max ' + b.socMax + ' %</small>'}</td><td>${b.fullAt || '—'}</td>` +
          `<td class="sol">${b.fullAt ? fmt1(b.thrown) : ''}</td><td class="exp">${b.fullAt ? fmt1(b.store) : ''}</td><td class="hide-sm mix">${b.night != null ? fmt1(b.night) : ''}</td><td class="exp">${b.replaced != null ? fmt1(b.replaced) : ''}</td></tr>`;
        if (openDay === b.day) rows += `<tr class="chart"><td colspan="7"><div class="legend"><span><i style="background:#cba6f7"></i>PV</span><span><i style="background:#F2A93B;opacity:.5"></i>PV the sun allowed (clear-sky fit)</span><span><i style="background:#fab387"></i>Consumption</span><span><i style="background:#89dceb"></i>Battery (− charging)</span><span><i style="background:#94e2d5"></i>Generator</span><span><i style="background:#b4befe"></i>Grid</span><span><i style="background:#89b4fa;height:2px"></i>SOC %</span></div><canvas class="pp" id="cv-${b.day}"></canvas><div class="chartNote" id="cn-${b.day}">Reading DeyeCloud…</div></td></tr>`;
      }
    }
    rows += line('tot', totLabel(D.rack.from || D.days[0]), T);
    $('tbl').innerHTML = head + rows;
    if (openDay && $('cv-' + openDay)) chart(openDay);
    $('note').innerHTML =
      `<b>The case.</b> One 60 kWh rack (12 × 5 kWh) fills from the panels by early afternoon. From that moment the inverter throttles the panels down to the house load — on DeyeCloud's Power Profile the PV line drops onto Consumption while SOC sits at 100 % — and in the evening the generator and EDL carry the house. ` +
      `<b>Solar thrown</b> = what the sun allowed minus what the panels gave, over the daylight window the battery stayed full. "What the sun allowed" is a clear-sky curve for that date in Lebanon, scaled to what the panels were giving in the <b>90 minutes before</b> the battery filled — a cloudy day gives a lower curve. ` +
      `<b>A second rack</b> of 60 kWh at 90 % usable takes up to 54 kWh of that; <b>would replace</b> = the smaller of what it stores and what the generator + EDL gave that night (to the next sunrise). "Full at" counts only a battery filled by the panels in daylight; a battery that reaches 100 % in the evening from EDL or the generator threw no solar, so the line says so and counts nothing. <b>Would replace</b> is below <b>would store</b> on summer nights where the generator + EDL gave less than 54 kWh — the rack would have had more than the night needed. Starts 6 Aug 2025: before that DeyeCloud kept no solar series, so a full battery can't be told from the sun. Tap a month for its days, a day for its chart.`;
  }

  // ── the three panel series (inverter inputs PV1 / PV2 / PV3) in kWh per kWp ─────────────────────────────────────
  // server tohme-mppt.js: per day e (kWh), eu (kWh while the battery < 97 % — panels running free), am / pm (eu before /
  // after solar noon), im (highest A running free). Compared on eu ÷ kWp; a series under 90 % of the best is red.
  function renderSeries() {
    const S = D.series, K = S.kwp, Z = () => ({ days: 0, e: [0, 0, 0], eu: [0, 0, 0], am: [0, 0, 0], pm: [0, 0, 0], im: [0, 0, 0] });
    const put = (t, m) => { t.days++; for (const k of ['e', 'eu', 'am', 'pm']) for (let i = 0; i < 3; i++) t[k][i] += m[k][i]; for (let i = 0; i < 3; i++) t.im[i] = Math.max(t.im[i], m.im[i]); };
    const months = {}, T = Z();
    D.days.forEach(d => { const m = D.mppt[d]; if (!m || !inYear(d)) return; const k = d.slice(0, 7); (months[k] = months[k] || { list: [], t: Z() }).list.push({ day: d, ...m }); put(months[k].t, m); put(T, m); });
    const keys = Object.keys(months).sort().reverse();
    const y = (t, i, k = 'eu') => t[k][i] / K[i];
    const cells = (t, one) => { const r = [0, 1, 2].map(i => y(t, i)), best = Math.max(...r);
      return r.map(v => `<td class="${best > 0 && v < best * 0.9 ? 'def' : 'exp'}">${best > 0 ? (Math.round(v * 100) / 100).toFixed(2) : ''}</td>`).join('') +
        `<td>${best > 0 ? 'PV' + (r.indexOf(Math.min(...r)) + 1) + ' ' + Math.round((Math.min(...r) / best - 1) * 100) + ' %' : ''}</td>` +
        [0, 1, 2].map(i => `<td class="hide-sm">${t.pm[i] + t.am[i] > 0 ? Math.round(t.pm[i] / (t.am[i] + t.pm[i]) * 100) + ' %' : ''}</td>`).join('') +
        `<td class="hide-sm">${t.im.map(v => Math.round(v)).join(' · ')}</td>`; };
    const r = [0, 1, 2].map(i => y(T, i)), best = Math.max(...r), wi = r.indexOf(Math.min(...r));
    $('kpis').innerHTML = [0, 1, 2].map(i => `<div class="kpi ${best && r[i] < best * 0.9 ? 'gen' : 'rack'}"><span>PV${i + 1} · ${S.panels[i]} panels ≈ ${K[i].toFixed(1)} kWp</span><b>${(Math.round(r[i] * 100) / 100).toFixed(2)} kWh/kWp</b><small>${fmt(T.e[i])} kWh in ${T.days} days · ${fmt(T.eu[i])} running free</small></div>`).join('') +
      `<div class="kpi"><span>Weakest</span><b>PV${wi + 1} ${best ? Math.round((r[wi] / best - 1) * 100) : 0} %</b><small>per kWp, against the best series</small></div>`;
    const head = `<tr><th>Month</th><th class="hide-sm">Days</th><th>PV1<small>kWh/kWp</small></th><th>PV2<small>kWh/kWp</small></th><th>PV3<small>kWh/kWp</small></th><th>Weakest<small>vs best</small></th>` +
      `<th class="hide-sm">PV1 pm<small>after noon</small></th><th class="hide-sm">PV2 pm<small>after noon</small></th><th class="hide-sm">PV3 pm<small>after noon</small></th><th class="hide-sm">Max A<small>PV1 · PV2 · PV3</small></th></tr>`;
    let rows = '';
    for (const k of keys) {
      const m = months[k], [yy, mo] = k.split('-');
      rows += `<tr class="row" data-m="${k}"><td>${MONTHS[+mo - 1]} ${yy}${D.today && D.today.startsWith(k) ? ' <small>to yesterday</small>' : ''}</td><td class="hide-sm">${m.t.days}</td>${cells(m.t)}</tr>`;
      if (open[k]) for (const b of m.list.slice().reverse()) { const t = { days: 1, ...b }; rows += `<tr class="day"><td>${+b.day.slice(8)} ${MONTHS[+mo - 1]}<span class="ph">${fmt1(b.e[0] + b.e[1] + b.e[2])} kWh</span></td><td class="hide-sm"><small>${fmt1(b.e[0] + b.e[1] + b.e[2])} kWh</small></td>${cells(t, 1)}</tr>`; }
    }
    rows += `<tr class="tot"><td>${keys.length ? totLabel(keys[keys.length - 1] + '-01') : 'No days in this range'}</td><td class="hide-sm">${T.days}</td>${cells(T)}</tr>`;
    $('tbl').innerHTML = head + rows;
    $('note').innerHTML =
      `<b>Panel series.</b> The inverter has three solar inputs (MPPT PV1, PV2, PV3), each with its own strings. kWh/kWp = what a series gave per installed kWp, counted only while the battery was below 97 % — once it is full the inverter throttles the panels, not evenly, and that says nothing about the panels. A series more than 10 % under the best is red. ` +
      `<b>Pm</b> = share of the series' energy after solar noon: a series that drops in the afternoon while the others don't is shaded then (tree, wall, another row) or faces east. <b>Max A</b> = highest current running free — a string lost on a two-string input halves it, on sunny and cloudy days alike. ` +
      `<b>kWp per series is estimated</b> (${S.panels.join(' / ')} panels × ${S.panelW} W): the drawings don't give the string layout, so it is taken from overcast days, when each series' share follows its size. Give the real count per input and the figures firm up. ` +
      `DeyeCloud keeps the inverter's own series about 90 days — kept here from 24 Jul 2026 on (the oldest day it still had). Tap a month for its days.`;
  }

  async function chart(d) {
    let v = dayCache[d];
    if (!v) { try { v = dayCache[d] = await (await fetch('/api/tohme/day?d=' + d)).json(); } catch (e) { $('cn-' + d).textContent = 'DeyeCloud not reachable: ' + e.message; return; } }
    const cv = $('cv-' + d); if (!cv) return;
    const W = cv.clientWidth, H = cv.clientHeight, dpr = devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    const L = 36, R = 34, T = 10, Bm = 22, w = W - L - R, h = H - T - Bm;
    const n = v.t.length; if (!n) { $('cn-' + d).textContent = 'No readings for this day.'; return; }
    const t0 = v.t[0] - (v.t[0] % 300), span = 86400;
    const x = t => L + (t - t0) / span * w;
    const kMax = Math.max(5, ...v.pv, ...v.use, ...v.gen, ...v.grid, ...(v.pot || []), ...v.bat.map(Math.abs)); const lim = Math.ceil(kMax / 10) * 10;
    const yk = k => T + h / 2 - k / lim * h / 2, ys = s => T + h - s / 100 * h;
    c.clearRect(0, 0, W, H);
    c.strokeStyle = '#313244'; c.lineWidth = 1; c.font = '10px system-ui'; c.fillStyle = '#6c7086';
    for (let k = -lim; k <= lim; k += lim / 2) { c.beginPath(); c.moveTo(L, yk(k)); c.lineTo(L + w, yk(k)); c.stroke(); c.textAlign = 'right'; c.fillText(k, L - 4, yk(k) + 3); }
    for (let hh = 0; hh <= 24; hh += 3) { const xx = L + hh / 24 * w; c.textAlign = 'center'; c.fillText(String(hh).padStart(2, '0') + ':00', xx, H - 6); }
    for (let p = 0; p <= 100; p += 50) { c.textAlign = 'left'; c.fillText(p + ' %', L + w + 4, ys(p) + 3); }
    // the thrown solar: shaded between the clear-sky curve and PV, inside the full window
    const a = v.batt;
    if (v.pot && a.iFull != null) {
      c.beginPath(); c.fillStyle = 'rgba(242,169,59,.28)';
      for (let i = a.iFull; i <= a.iEnd; i++) c.lineTo(x(v.t[i]), yk(Math.max(v.pot[i], v.pv[i])));
      for (let i = a.iEnd; i >= a.iFull; i--) c.lineTo(x(v.t[i]), yk(v.pv[i]));
      c.closePath(); c.fill();
      c.strokeStyle = '#F2A93B'; c.setLineDash([4, 3]); c.beginPath(); v.pot.forEach((p, i) => { if (i === 0) c.moveTo(x(v.t[i]), yk(p)); else c.lineTo(x(v.t[i]), yk(p)); }); c.stroke(); c.setLineDash([]);
      c.strokeStyle = '#F2A93B'; c.beginPath(); c.moveTo(x(v.t[a.iFull]), T); c.lineTo(x(v.t[a.iFull]), T + h); c.stroke();
      c.fillStyle = '#F2A93B'; c.textAlign = 'left'; c.fillText('full ' + a.fullAt, x(v.t[a.iFull]) + 3, T + 10);
    }
    const line = (arr, col, y, wd) => { c.strokeStyle = col; c.lineWidth = wd || 1.4; c.beginPath(); arr.forEach((p, i) => { if (i === 0) c.moveTo(x(v.t[i]), y(p)); else c.lineTo(x(v.t[i]), y(p)); }); c.stroke(); };
    line(v.gen, '#94e2d5', yk); line(v.grid, '#b4befe', yk); line(v.bat, '#89dceb', yk); line(v.use, '#fab387', yk); line(v.pv, '#cba6f7', yk, 1.8); line(v.soc, '#89b4fa', ys, 2);
    $('cn-' + d).innerHTML = a.fullAt
      ? `Battery full at <b>${a.fullAt}</b>, stayed full until ${a.clipTo}. In that window the sun allowed about ${fmt1(a.pvPot)} kWh, the panels gave ${fmt1(a.pvPot - a.thrown)} — <b>${fmt1(a.thrown)} kWh thrown</b> (shaded). Clear-sky curve fitted on ${a.fitN} readings before full. PV peak ${a.pvPeak} kW.`
      : `The battery never filled this day (max ${a.socMax} %). PV peak ${a.pvPeak} kW.`;
  }

  $('views').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; open = {}; openDay = null; [...$('views').children].forEach(x => x.classList.toggle('on', x === b)); render(); });
  $('years').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; year = b.dataset.y; open = {}; openDay = null; [...$('years').children].forEach(x => x.classList.toggle('on', x === b)); render(); });   // the data is already here — no new read
  $('tbl').addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (!tr) return; if (tr.dataset.d) { openDay = openDay === tr.dataset.d ? null : tr.dataset.d; return render(); } open[tr.dataset.m] = !open[tr.dataset.m]; render(); });
  load().catch(e => { $('err').textContent = String(e.message || e); $('app').hidden = false; });

  // pull-to-refresh on a phone: drag down from the top, let go past 80 px → read again (as on /cpr)
  const ptr = $('ptr'); let y0 = null, dy = 0;
  addEventListener('touchstart', e => { y0 = scrollY <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy <= 0) return;
    ptr.textContent = dy > 80 ? '↻ Release to refresh' : '↓ Pull to refresh';
    ptr.style.transform = `translate(-50%, ${Math.min(dy, 100) - 60}px)`;
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 != null && dy > 80) { ptr.textContent = 'Refreshing…'; ptr.style.transform = 'translate(-50%, 0)'; load().finally(() => setTimeout(() => { ptr.style.transform = ''; }, 400)); }
    else ptr.style.transform = '';
    y0 = null; dy = 0;
  });
})();
</script>

<script src="/plant-crumbs.js" data-name="Tohme"></script>
<script src="/graph-hover.js"></script>   <!-- the payback chart's read-out under the cursor / finger -->
