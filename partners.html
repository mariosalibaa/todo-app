<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Partners · Shift Hub</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--red:#f38ba8;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--surface0);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1.05rem;}
  .wordmark span{color:var(--amber);}
  .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  .who{font-size:.78rem;color:var(--sub);display:flex;gap:12px;align-items:center;}
  .who a{color:var(--overlay0);text-decoration:none;} .who a:hover{color:var(--text);}
  main{max-width:860px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:1.35rem;font-weight:600;margin:0 0 6px;}
  .lead{color:var(--sub);font-size:.88rem;line-height:1.5;margin:0 0 30px;}
  h2{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--overlay0);margin:28px 0 10px;font-weight:600;}
  .files{display:flex;flex-direction:column;gap:8px;}
  .file{display:flex;align-items:center;gap:14px;background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;padding:14px 16px;transition:border-color .15s;}
  .file .open{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-decoration:none;color:var(--text);}
  .file:hover{border-color:var(--amber);}
  .file .ico{font-size:1.35rem;width:30px;text-align:center;flex:none;}
  .file .name{font-weight:500;font-size:.95rem;line-height:1.3;word-break:break-word;}
  .file .meta{font-size:.72rem;color:var(--overlay0);margin-top:3px;}
  .file .dl{flex:none;font-size:.72rem;color:var(--overlay0);border:1px solid var(--surface0);border-radius:6px;padding:4px 9px;text-decoration:none;}
  .file .dl:hover{color:var(--text);border-color:var(--surface1);}
  .back{font-size:.78rem;color:var(--overlay0);text-decoration:none;display:inline-block;margin-bottom:18px;}
  .back:hover{color:var(--text);}
  .empty{color:var(--overlay0);font-size:.88rem;}
  .rtl{direction:rtl;text-align:right;}
  /* terms at a glance */
  .termsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .lang button{background:none;border:1px solid var(--surface0);color:var(--sub);font-size:.75rem;padding:4px 11px;cursor:pointer;}
  .lang button:first-child{border-radius:6px 0 0 6px;} .lang button:last-child{border-radius:0 6px 6px 0;margin-left:-1px;}
  .lang button.on{background:var(--amber);border-color:var(--amber);color:var(--base);font-weight:600;}
  .tnote{font-size:.78rem;color:var(--overlay0);margin:0 0 14px;line-height:1.5;}
  .tsec{background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
  .tsec .thead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .tsec h3{margin:0;font-size:1.02rem;font-weight:600;}
  .tsec .tsub{font-size:.78rem;color:var(--sub);margin:0 0 14px;}
  .tstatus{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--base);background:var(--amber);border-radius:4px;padding:2px 6px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--base);border:1px solid var(--surface0);border-radius:10px;padding:12px 12px;}
  .kpi .v{font-size:1.25rem;font-weight:600;color:var(--amber);letter-spacing:-.01em;}
  .kpi .l{font-size:.72rem;color:var(--sub);margin-top:3px;line-height:1.35;}
  .trows{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 16px;font-size:.85rem;line-height:1.45;}
  .trows .k{color:var(--overlay0);} .trows .v{color:var(--text);}
  .ttable{width:100%;border-collapse:collapse;font-size:.83rem;margin:4px 0 14px;}
  .ttable th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--overlay0);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--surface0);}
  .ttable td{padding:7px 8px;border-bottom:1px solid var(--surface0);} .ttable td:nth-child(2),.ttable td:nth-child(4),.ttable th:nth-child(2),.ttable th:nth-child(4){text-align:right;white-space:nowrap;}
  #terms.rtl .ttable th,#terms.rtl .ttable td{text-align:right;} #terms.rtl .ttable td:nth-child(2),#terms.rtl .ttable td:nth-child(4),#terms.rtl .ttable th:nth-child(2),#terms.rtl .ttable th:nth-child(4){text-align:left;}
  #terms.rtl{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;}
  @media (max-width:600px){.trows{grid-template-columns:1fr;gap:2px 0;} .trows .k{margin-top:8px;font-size:.72rem;} .tsec{padding:14px;} .ttable{display:block;overflow-x:auto;}}
  /* the viewer: same tab, its own top bar, so there is always a way back */
  #viewer{position:fixed;inset:0;background:#0f0f17;z-index:500;display:none;flex-direction:column;}
  #viewer.on{display:flex;}
  .vbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--mantle);border-bottom:1px solid var(--surface0);flex:none;}
  .vbar .vback{color:var(--amber);text-decoration:none;font-size:.9rem;font-weight:600;white-space:nowrap;padding:6px 8px;border-radius:8px;}
  .vbar .vback:hover{background:var(--surface0);}
  .vbar .vtitle{flex:1;min-width:0;font-size:.85rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vbar .vbtn{color:var(--sub);text-decoration:none;font-size:.78rem;border:1px solid var(--surface0);border-radius:6px;padding:5px 10px;white-space:nowrap;}
  .vbar .vbtn:hover{color:var(--text);border-color:var(--surface1);}
  .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;}
  .vbody canvas{display:block;margin:0 auto 12px;max-width:100%;height:auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);}
  .vcard{max-width:420px;margin:60px auto;background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;padding:28px;text-align:center;}
  .vcard .big{font-size:2.4rem;margin-bottom:10px;}
  .vcard p{color:var(--sub);font-size:.88rem;line-height:1.5;}
  .vcard a{display:inline-block;background:var(--amber);color:var(--base);text-decoration:none;font-weight:600;border-radius:8px;padding:10px 20px;margin-top:8px;}
  .vstatus{color:var(--overlay0);font-size:.85rem;text-align:center;padding:40px 0;}
  .vdoc{max-width:800px;margin:12px auto;background:#fff;color:#222;padding:48px 56px;border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.5);font-family:Georgia,"Times New Roman",serif;font-size:.98rem;line-height:1.6;}
  .vdoc h1,.vdoc h2,.vdoc h3{line-height:1.3;} .vdoc table{border-collapse:collapse;width:100%;} .vdoc td,.vdoc th{border:1px solid #bbb;padding:4px 8px;vertical-align:top;} .vdoc img{max-width:100%;}
  @media (max-width:600px){.vdoc{padding:22px 18px;font-size:.92rem;}}
  @media (max-width:600px){header{padding:14px 16px;}main{padding:22px 14px;}.file{padding:12px 12px;}.vbar .vhide{display:none;}.vbody{padding:6px;}}
</style>
</head>
<body>
<header>
  <div class="wordmark">SHIFT <span>GROUP</span><small>PARTNERS</small></div>
  <div class="who" id="who"></div>
</header>
<main>
  <a class="back" href="/admin?stay" id="back" style="display:none">&lsaquo; Shift Hub</a>
  <h1>Ajaltoun 4193 · Villa D3</h1>
  <p class="lead">The agreements, fee frameworks and proposals between Mario Saliba and Antoine Char. Click a document to open it; the arrow downloads it.</p>
  <div class="termsbar">
    <h2 style="margin:0">Terms at a glance</h2>
    <div class="lang"><button id="lang-en" class="on" onclick="setLang('en')">English</button><button id="lang-ar" onclick="setLang('ar')">عربي</button></div>
  </div>
  <div id="terms"></div>
  <h2 style="margin-top:36px">Documents</h2>
  <div id="groups"><p class="empty">Loading…</p></div>
</main>
<div id="viewer">
  <div class="vbar">
    <a class="vback" href="#" onclick="closeViewer();return false;">&lsaquo; Documents</a>
    <div class="vtitle" id="vtitle"></div>
    <a class="vbtn vhide" id="vtab" href="#" target="_blank" rel="noopener">Open in new tab</a>
    <a class="vbtn" id="vdl" href="#">↓ Download</a>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/admin-shared.js"></script>
<script src="/phone-preview.js"></script>
<script>
const esc = Admin.esc;
const ICON = m => /pdf/.test(m) ? '📄' : /word|officedocument/.test(m) ? '📝' : /sheet|excel/.test(m) ? '📊' : /image/.test(m) ? '🖼️' : '📎';
const kb = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
const isAr = s => /[؀-ۿ]/.test(s);
// "20260830-3 Villa D3 Agreement (Mario Saliba).docx" → title "Villa D3 Agreement (Mario Saliba)", date 2026-08-30:
// the date under the file comes from Mario's yyyymmdd prefix when there is one, else from the file's own date
const titleOf = n => n.replace(/\.[a-z0-9]+$/i, '').replace(/^\d{8}(-\d+)?\s+/, '');
const dateOf = f => { const m = /^(\d{4})(\d{2})(\d{2})/.exec(f.name); return m ? `${m[1]}-${m[2]}-${m[3]}` : (f.mtime || '').slice(0, 10); };

Admin.require('partners', async me => {
  document.getElementById('who').innerHTML =
    `${esc(me.email)} <a href="#" onclick="Admin.signOut();return false;">Sign out</a>`;
  // the hub link only for those who have more than this one app
  if (me.admin || (me.apps || []).length > 1) document.getElementById('back').style.display = '';
  Admin.api('GET', '/api/partners/terms').then(x => { TERMS = x; renderTerms(); }).catch(() => {});   // after sign-in, alongside the list
  const box = document.getElementById('groups');
  let files;
  try { files = await Admin.api('GET', '/api/partners/files'); }
  catch (e) { box.innerHTML = `<p class="empty" style="color:var(--red)">Could not load the documents: ${esc(e.message)}</p>`; return; }
  if (!files.length) { box.innerHTML = '<p class="empty">No documents yet.</p>'; return; }
  const groups = [];
  for (const f of files) {
    let g = groups.find(x => x.name === f.group);
    if (!g) { g = { name: f.group, files: [] }; groups.push(g); }
    g.files.push(f);
  }
  FILES = files;
  box.innerHTML = groups.map(g => `
    <h2>${esc(g.name)}</h2>
    <div class="files">${g.files.map(f => `
      <div class="file">
        <a class="open" href="#${esc(f.id)}" onclick="openViewer('${esc(f.id)}');return false;">
          <div class="ico">${ICON(f.mime)}</div>
          <div style="flex:1;min-width:0">
            <div class="name ${isAr(f.name) ? 'rtl' : ''}">${esc(titleOf(f.name))}</div>
            <div class="meta">${esc(f.name.split('.').pop().toUpperCase())} · ${kb(f.size)} · ${esc(dateOf(f))}</div>
          </div>
        </a>
        <a class="dl" href="/api/partners/files/${esc(f.id)}?v=${esc((f.sha1 || '').slice(0, 8))}&dl=1" title="Download">↓</a>
      </div>`).join('')}
    </div>`).join('');
  // a shared link or a reload lands straight in the document
  if (location.hash.length > 1) openViewer(location.hash.slice(1), true);
});

// ── Terms at a glance ───────────────────────────────────────────────────────
// {en, ar} pairs from partners-terms.json (uploaded by partners-sync.mjs); one toggle flips the whole block
let TERMS = null, LANG = 'en';
try { LANG = localStorage.getItem('partners_lang') === 'ar' ? 'ar' : 'en'; } catch {}
const t = x => x == null ? '' : typeof x === 'string' ? x : (x[LANG] || x.en || '');
function setLang(l) {
  LANG = l; try { localStorage.setItem('partners_lang', l); } catch {}
  document.getElementById('lang-en').classList.toggle('on', l === 'en');
  document.getElementById('lang-ar').classList.toggle('on', l === 'ar');
  renderTerms();
}
function renderTerms() {
  const box = document.getElementById('terms');
  if (!TERMS) { box.innerHTML = ''; return; }
  box.className = LANG === 'ar' ? 'rtl' : '';
  box.innerHTML = `<p class="tnote">${esc(t(TERMS.note))}${TERMS.updated ? ' · ' + esc(TERMS.updated) : ''}</p>` + (TERMS.sections || []).map(s => `
    <section class="tsec">
      <div class="thead"><h3>${esc(t(s.title))}</h3>${s.status ? `<span class="tstatus">${esc(t(s.status))}</span>` : ''}</div>
      ${s.sub ? `<p class="tsub">${esc(t(s.sub))}</p>` : ''}
      ${s.kpis ? `<div class="kpis">${s.kpis.map(k => `<div class="kpi"><div class="v">${esc(t(k.v))}</div><div class="l">${esc(t(k.l))}</div></div>`).join('')}</div>` : ''}
      ${s.table ? `<table class="ttable"><thead><tr>${s.table.head.map(h => `<th>${esc(t(h))}</th>`).join('')}</tr></thead>
        <tbody>${s.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(t(c))}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''}
      ${s.rows ? `<div class="trows">${s.rows.map(r => `<div class="k">${esc(t(r.k))}</div><div class="v">${esc(t(r.v))}</div>`).join('')}</div>` : ''}
    </section>`).join('');
}
setLang(LANG);

let FILES = [];
window.addEventListener('hashchange', () => { if (location.hash.length > 1) openViewer(location.hash.slice(1), true); else closeViewer(true); });
const authed = url => fetch(url, { headers: { Authorization: 'Bearer ' + (Admin.session || '') } }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
const loadScript = (src, glob) => window[glob] ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('could not load ' + glob)); document.head.appendChild(s); });

async function openViewer(id, fromHash) {
  const f = FILES.find(x => x.id === id);
  if (!f) return;
  if (!fromHash) history.pushState(null, '', '#' + id);   // so the browser's own back button closes it too
  const v = document.getElementById('viewer'), body = document.getElementById('vbody');
  // the checksum in the URL makes every new version a new address — the browser can never show a stale copy
  const url = '/api/partners/files/' + encodeURIComponent(id) + '?v=' + (f.sha1 || '').slice(0, 8);
  document.getElementById('vtitle').textContent = titleOf(f.name);
  document.getElementById('vtab').href = url;
  document.getElementById('vdl').href = url + '&dl=1';
  v.classList.add('on'); document.body.style.overflow = 'hidden';
  body.innerHTML = '<div class="vstatus">Loading…</div>';
  const fallback = e => { body.innerHTML = `<div class="vcard"><div class="big">${ICON(f.mime)}</div><div style="font-weight:600">${esc(f.name)}</div>
      <p>This file cannot be shown here${e ? ' (' + esc(e.message) + ')' : ''} — download it and open it on your computer.</p>
      <a href="${url}?dl=1">↓ Download (${kb(f.size)})</a></div>`; };
  try {
    if (/pdf/.test(f.mime)) {
      // every page drawn on a canvas: the same on the laptop and on an iPhone, where an <iframe> shows one page only
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: await authed(url) }).promise;
      body.innerHTML = '';
      const width = Math.min(body.clientWidth - 24, 900);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const scale = width / page.getViewport({ scale: 1 }).width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: scale * dpr });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height; c.style.width = width + 'px';
        body.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    } else if (/wordprocessingml/.test(f.mime)) {
      // the Word agreement, converted to HTML in the browser — readable here, Word-exact only in Word
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', 'mammoth');
      const out = await mammoth.convertToHtml({ arrayBuffer: await authed(url) });
      const ar = /[؀-ۿ]/.test(out.value.replace(/<[^>]+>/g, '').slice(0, 400));
      body.innerHTML = `<div class="vdoc${ar ? ' rtl' : ''}">${out.value}</div>
        <p class="vstatus">Shown as text. <a href="${url}?dl=1" style="color:var(--amber)">Download the Word file</a> for the exact layout.</p>`;
    } else fallback();
  } catch (e) { fallback(e); }
}
function closeViewer(fromHash) {
  document.getElementById('viewer').classList.remove('on'); document.body.style.overflow = '';
  document.getElementById('vbody').innerHTML = '';
  // drop the #id without leaving the page (a reload or a shared link may have landed straight in the viewer)
  if (!fromHash && location.hash) history.replaceState(null, '', location.pathname + location.search);
}
</script>
</body>
</html>
