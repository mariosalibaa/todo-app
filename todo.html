// ── Saved views ───────────────────────────────────────────────────────────
function loadSavedViews() {
  try { savedViews = JSON.parse(localStorage.getItem('todo_saved_views') || '[]'); }
  catch { savedViews = []; }
}
function persistSavedViews() {
  localStorage.setItem('todo_saved_views', JSON.stringify(savedViews));
}

function captureViewState() {
  return { showDone, showSubtasks, groupByProject, currentView, filterPriority, filterProject };
}

function applyView(id) {
  const v = savedViews.find(x => x.id === id);
  if (!v) return;
  activeViewId = id;

  showDone       = v.state.showDone;
  showSubtasks   = v.state.showSubtasks;
  groupByProject = v.state.groupByProject;
  filterPriority = v.state.filterPriority;
  filterProject  = v.state.filterProject;

  // Sync toolbar buttons
  document.getElementById('show-done-btn').classList.toggle('active', showDone);
  document.getElementById('show-subs-btn').classList.toggle('active', showSubtasks);
  document.getElementById('group-btn').classList.toggle('active', groupByProject);
  document.getElementById('priority-filter').value = filterPriority;

  // Switch view
  setView(v.state.currentView);
  renderAll();
}

function deleteView(id) {
  savedViews = savedViews.filter(v => v.id !== id);
  if (activeViewId === id) activeViewId = null;
  persistSavedViews();
  renderViewsSection();
}

function updateView(id) {
  const v = savedViews.find(x => x.id === id);
  if (!v) return;
  v.state = captureViewState();
  activeViewId = id;
  persistSavedViews();
  renderViewsSection();
}

function startRenameView(e, id) {
  e.stopPropagation();
  const row = document.querySelector(`.view-item[data-vid="${id}"]`);
  if (!row) return;
  const label = row.querySelector('.view-item-label');
  const current = label.textContent;
  label.outerHTML = `<input class="view-item-rename-input" data-vid="${id}"
    value="${esc(current)}"
    onblur="confirmRenameView('${id}',this.value)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.dataset.cancel=1;this.blur();}">`;
  const inp = row.querySelector('.view-item-rename-input');
  inp.focus(); inp.select();
}

function confirmRenameView(id, val) {
  const v = savedViews.find(x => x.id === id);
  if (v && !document.querySelector(`.view-item-rename-input[data-vid="${id}"]`)?.dataset.cancel) {
    const trimmed = val.trim();
    if (trimmed) v.name = trimmed;
    persistSavedViews();
  }
  renderViewsSection();
}

function openSaveViewModal() {
  const state = captureViewState();
  const lines = [
    `View: ${state.currentView === 'kanban' ? '▐▐ Kanban' : '≡ List'}`,
    `Show done: ${state.showDone ? 'Yes' : 'No'}`,
    `Subtasks: ${state.showSubtasks ? 'Visible' : 'Hidden'}`,
    `Group by project: ${state.groupByProject ? 'Yes' : 'No'}`,
    `Priority filter: ${state.filterPriority}`,
    `Project filter: ${state.filterProject}`,
  ];
  document.getElementById('view-preview').innerHTML = lines.map(l => `· ${l}`).join('<br>');
  document.getElementById('view-name-input').value = '';
  openModal('save-view-modal');
  setTimeout(() => document.getElementById('view-name-input').focus(), 60);
}

function confirmSaveView() {
  const name = document.getElementById('view-name-input').value.trim();
  if (!name) { document.getElementById('view-name-input').focus(); return; }
  const view = { id: uid(), name, state: captureViewState() };
  savedViews.push(view);
  activeViewId = view.id;
  persistSavedViews();
  closeModalById('save-view-modal');
  renderViewsSection();
}

function renderViewsSection() {
  const el = document.getElementById('views-section');
  if (!savedViews.length) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="sidebar-section-label">Saved Views</div>
    ${savedViews.map(v => {
      const icon = v.state.currentView === 'kanban' ? '▐▐' : '≡';
      const isActive = activeViewId === v.id;
      return `
        <div class="view-item ${isActive ? 'active' : ''}" data-vid="${v.id}" onclick="applyView('${v.id}')">
          <span class="view-item-icon">${icon}</span>
          <span class="view-item-label">${esc(v.name)}</span>
          <div class="view-actions" onclick="event.stopPropagation()">
            <button class="view-act-btn" onclick="startRenameView(event,'${v.id}')" title="Rename">✎</button>
            <button class="view-act-btn" onclick="updateView('${v.id}')" title="Update with current settings">↺</button>
            <button class="view-act-btn del" onclick="deleteView('${v.id}')" title="Delete">✕</button>
          </div>
        </div>`;
    }).join('')}`;
}

function getOrderedProjects(projects) {
  const known   = colOrder.filter(p => projects.includes(p));
  const unknown = projects.filter(p => !colOrder.includes(p)).sort();
  return [...known, ...unknown];
}

// ── Projects board ────────────────────────────────────────────────────────────
let _pbDragProj = null;

function renderProjectsBoard() {
  const el = document.getElementById('projects-board');
  document.getElementById('toolbar-title').textContent = 'Projects';
  document.getElementById('task-count').textContent = '';

  const filtered = getFiltered();
  const anyFilter = filterUser || filterDept || filterStatus || filterCompany || searchQuery || showArchived || (filterPriority && filterPriority !== 'All');
  const matchingProjects = anyFilter
    ? new Set(filtered.map(t => t.project).filter(Boolean))
    : null;
  const allProjects = Array.from(new Set(tasks.map(t => t.project).filter(Boolean)))
    .filter(p => !matchingProjects || matchingProjects.has(p));

  // Dynamic columns from statuses + unassigned
  const COLS = [
    ...statuses.map(s => ({ key: s.id, label: s.name, color: s.color })),
    { key: null, label: 'No Status', color: 'var(--overlay0)' },
  ];

  el.innerHTML = COLS.map(col => {
    const projs = allProjects.filter(p => (projStatus(p) || null) === col.key);
    if (!projs.length && col.key !== null) return ''; // hide empty status cols except No Status
    const cards = projs.map(p => {
      const allT = tasks.filter(t => t.project === p && !t.archived);
      const open = allT.filter(t => !t.done).length;
      const done = allT.filter(t => t.done).length;
      const od   = allT.filter(t => isOverdue(t.due, t.done)).length;
      const co   = projCompany(p);
      const coName = co ? (companyById(co)?.name || co) : '';
      return `
        <div class="pb-proj-card" draggable="true" data-pbproj="${esc(p)}"
             onclick="openProjectTasks('${esc(p)}')">
          <div class="pb-proj-name">${esc(p)}</div>
          ${coName ? `<div style="font-size:0.68rem;color:var(--overlay0);margin-bottom:4px;">${esc(coName)}</div>` : ''}
          <div class="pb-stats">
            ${open ? `<span class="pb-stat open">${open} open</span>` : ''}
            ${done ? `<span class="pb-stat done">${done} done</span>` : ''}
            ${od   ? `<span class="pb-stat overdue">${od} overdue</span>` : ''}
            ${!open && !done ? `<span class="pb-stat open">No tasks</span>` : ''}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="pb-col" data-pbcol="${col.key ?? ''}">
        <div class="pb-col-header">
          <span style="width:9px;height:9px;border-radius:50%;background:${col.color};flex-shrink:0;display:inline-block;"></span>
          ${esc(col.label)}
          <span class="pb-col-count">${projs.length}</span>
        </div>
        <div class="pb-col-body">${cards}</div>
      </div>`;
  }).join('');

  initPBDrag();
}

function renderProjectsList() {
  const el = document.getElementById('projects-list-view');
  document.getElementById('toolbar-title').textContent = 'All Projects';
  document.getElementById('task-count').textContent = '';

  const allProjects = Array.from(new Set(tasks.map(t => t.project).filter(Boolean)))
    .concat(Object.keys(projectMeta).filter(p => !tasks.some(t => t.project === p)))
    .filter((p, i, arr) => arr.indexOf(p) === i)
    .sort();

  if (allProjects.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">✓</div><div>No projects yet</div></div>`;
    return;
  }

  const rows = allProjects.map(p => {
    const allT = tasks.filter(t => t.project === p && !t.archived);
    const open = allT.filter(t => !t.done).length;
    const done = allT.filter(t => t.done).length;
    const status = projStatus(p);
    const company = projCompany(p);
    const statusName = status ? statusLabel(status) : '—';
    const companyName = company ? (companyById(company)?.name || company) : '—';
    const createdDate = tasks.find(t => t.project === p)?.createdAt || '—';
    const displayDate = createdDate !== '—' ? new Date(createdDate).toLocaleDateString() : '—';
    const taskCount = allT.length;
    return `
      <tr data-proj="${esc(p)}" class="plist-row">
        <td class="plist-name-cell" ondblclick="startProjNameEdit('${esc(p)}')"><span class="plist-name" onclick="openProjectTasks('${esc(p)}')">${esc(p)}</span></td>
        <td class="plist-company-cell" onclick="startProjCompanyEdit('${esc(p)}')">${esc(companyName)}</td>
        <td class="plist-status-cell" onclick="startProjStatusEdit('${esc(p)}')">
          ${status ? `<span style="background:${statusColor(status)}22;color:${statusColor(status)};padding:2px 8px;border-radius:4px;font-weight:500;font-size:0.75rem;">${esc(statusName)}</span>` : statusName}
        </td>
        <td style="text-align:center;">${taskCount}</td>
        <td style="text-align:center;color:var(--overlay0);font-size:0.75rem;">${esc(displayDate)}</td>
        <td>
          <div class="plist-actions">
            <button class="plist-btn" onclick="deleteProject('${esc(p)}')" title="Delete">🗑</button>
            <button class="plist-btn" onclick="openAddModalForProject('${esc(p)}')" title="Add task">+ Task</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  el.innerHTML = `
    <div style="margin-bottom:14px;display:flex;gap:8px;">
      <button class="save-btn" onclick="openNewProjectFromList()" style="padding:6px 14px;font-size:0.82rem;">+ New Project</button>
    </div>
    <table class="projects-list-table">
      <thead>
        <tr>
          <th>Project</th>
          <th>Company</th>
          <th>Status</th>
          <th>Tasks</th>
          <th>Created</th>
          <th style="text-align:right;width:140px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>`;
}

function startProjNameEdit(projName) {
  const row = document.querySelector(`tr[data-proj="${escAttr(projName)}"]`);
  const cell = row.querySelector('.plist-name-cell');
  const inp = document.createElement('input');
  inp.className = 'plist-edit-input';
  inp.value = projName;
  inp.style.width = '150px';
  cell.innerHTML = '';
  cell.appendChild(inp);
  inp.focus();
  inp.select();
  function commit() {
    const newName = inp.value.trim();
    if (newName && newName !== projName) {
      tasks.forEach(t => { if (t.project === projName) t.project = newName; });
      if (projectMeta[projName]) { projectMeta[newName] = projectMeta[projName]; delete projectMeta[projName]; }
      const ci = colOrder.indexOf(projName);
      if (ci !== -1) colOrder[ci] = newName;
      if (filterProject === projName) filterProject = newName;
      saveColOrder();
      saveProjectMeta();
      scheduleSave();
    }
    renderProjectsList();
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') inp.blur();
    if (e.key === 'Escape') renderProjectsList();
  });
}

function startProjCompanyEdit(projName) {
  const row = document.querySelector(`tr[data-proj="${escAttr(projName)}"]`);
  const cell = row.querySelector('.plist-company-cell');
  const cur = projCompany(projName) || '';
  const sel = document.createElement('select');
  sel.className = 'plist-edit-select';
  sel.innerHTML = '<option value="">No company</option>' +
    companies.map(c => `<option value="${c.id}" ${cur === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  cell.innerHTML = '';
  cell.appendChild(sel);
  sel.focus();
  function commit() {
    const newCo = sel.value || null;
    if (newCo !== cur) {
      if (!projectMeta[projName]) projectMeta[projName] = {};
      projectMeta[projName].company = newCo;
      saveProjectMeta();
    }
    renderProjectsList();
  }
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
  sel.addEventListener('keydown', e => { if (e.key === 'Escape') renderProjectsList(); });
}

function startProjStatusEdit(projName) {
  const row = document.querySelector(`tr[data-proj="${escAttr(projName)}"]`);
  const cell = row.querySelector('.plist-status-cell');
  const cur = projStatus(projName) || '';
  const sel = document.createElement('select');
  sel.className = 'plist-edit-select';
  sel.innerHTML = '<option value="">No status</option>' +
    statuses.map(s => `<option value="${s.id}" ${cur === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  cell.innerHTML = '';
  cell.appendChild(sel);
  sel.focus();
  function commit() {
    const newSt = sel.value || null;
    if (newSt !== cur) {
      if (!projectMeta[projName]) projectMeta[projName] = {};
      projectMeta[projName].status = newSt;
      saveProjectMeta();
    }
    renderProjectsList();
  }
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
  sel.addEventListener('keydown', e => { if (e.key === 'Escape') renderProjectsList(); });
}

function escAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function initPBDrag() {
  const board = document.getElementById('projects-board');
  if (board._pbDragInited) return;
  board._pbDragInited = true;

  board.addEventListener('dragstart', e => {
    const card = e.target.closest('[data-pbproj]');
    if (!card) return;
    _pbDragProj = card.dataset.pbproj;
    card.classList.add('is-dragging-pb');
    e.dataTransfer.effectAllowed = 'move';
  });
  board.addEventListener('dragend', e => {
    const card = e.target.closest('[data-pbproj]');
    if (card) card.classList.remove('is-dragging-pb');
    document.querySelectorAll('.pb-col').forEach(c => c.classList.remove('drag-over-pb'));
    _pbDragProj = null;
  });
  board.addEventListener('dragover', e => {
    const col = e.target.closest('.pb-col');
    if (!col || !_pbDragProj) return;
    e.preventDefault();
    document.querySelectorAll('.pb-col').forEach(c => c.classList.remove('drag-over-pb'));
    col.classList.add('drag-over-pb');
  });
  board.addEventListener('dragleave', e => {
    if (!e.currentTarget.contains(e.relatedTarget))
      document.querySelectorAll('.pb-col').forEach(c => c.classList.remove('drag-over-pb'));
  });
  board.addEventListener('drop', e => {
    const col = e.target.closest('.pb-col');
    if (!col || !_pbDragProj) return;
    e.preventDefault();
    const newStatus = col.dataset.pbcol || null;
    if (!projectMeta[_pbDragProj]) projectMeta[_pbDragProj] = {};
    if (newStatus) projectMeta[_pbDragProj].status = newStatus;
    else delete projectMeta[_pbDragProj].status;
    saveProjectMeta();
    renderAll();
  });
}

// ── Column drag handlers ───────────────────────────────────────────────────
// ── Column drag (event-delegation on board container) ─────────────────────
function onColDragStart(e, name) {
  draggedCol = name;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', name);
  // defer so the ghost image captures the element before opacity drops
  requestAnimationFrame(() => {
    document.querySelectorAll('.kanban-col').forEach(el => {
      el.classList.toggle('is-dragging', el.dataset.proj === name);
    });
  });
}

function initBoardDrag() {
  const board = document.getElementById('kanban-board');
  if (board._dragInited) return;
  board._dragInited = true;

  board.addEventListener('dragstart', e => {
    const card = e.target.closest('[data-taskid]');
    if (card) {
      draggedTask = card.dataset.taskid;
      draggedCol  = null;
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => card.classList.add('is-dragging-task'));
      return;
    }
    // column drag is started via onColDragStart (inline handler on header)
  });

  board.addEventListener('dragover', e => {
    e.preventDefault();
    const col = e.target.closest('.kanban-col');
    if (!col) return;
    if (draggedTask) {
      document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('task-drag-over'));
      col.classList.add('task-drag-over');
    } else if (draggedCol) {
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
      if (col.dataset.proj !== draggedCol) col.classList.add('drag-over');
    }
  });

  board.addEventListener('dragleave', e => {
    if (!board.contains(e.relatedTarget)) {
      document.querySelectorAll('.kanban-col').forEach(c =>
        c.classList.remove('drag-over', 'task-drag-over'));
    }
  });

  board.addEventListener('drop', e => {
    e.preventDefault();
    const col = e.target.closest('.kanban-col');
    const targetProj = col?.dataset.proj;

    if (draggedTask && targetProj !== undefined) {
      const task = tasks.find(t => t.id === draggedTask);
      if (task && task.project !== targetProj) {
        task.project = targetProj === '—' ? '' : targetProj;
        scheduleSave();
      }
      cleanupDrag();
      renderAll();
      return;
    }

    if (draggedCol && targetProj && draggedCol !== targetProj) {
      const allProjs = Array.from(new Set(tasks.map(t => t.project || '').filter(Boolean)));
      const order = getOrderedProjects(allProjs);
      const from = order.indexOf(draggedCol);
      const to   = order.indexOf(targetProj);
      if (from !== -1 && to !== -1) {
        order.splice(from, 1);
        order.splice(to, 0, draggedCol);
      }
      colOrder = order;
      saveColOrder();
    }
    cleanupDrag();
    renderKanban();
  });

  board.addEventListener('dragend', cleanupDrag);
}

function cleanupDrag() {
  draggedCol  = null;
  draggedTask = null;
  document.querySelectorAll('.kanban-col').forEach(el =>
    el.classList.remove('is-dragging', 'drag-over', 'task-drag-over'));
  document.querySelectorAll('.kanban-card').forEach(el =>
    el.classList.remove('is-dragging-task'));
}

// ── Sidebar project drag ───────────────────────────────────────────────────
let draggedProj = null;

function onSidebarDragStart(e, name) {
  draggedProj = name;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', name);
  requestAnimationFrame(() => {
    document.querySelectorAll('.project-item[data-proj]').forEach(el => {
      el.classList.toggle('is-dragging-proj', el.dataset.proj === name);
    });
  });
}

function initSidebarDrag() {
  const list = document.getElementById('projects-list');
  if (list._dragInited) return;
  list._dragInited = true;

  list.addEventListener('dragover', e => {
    if (!draggedProj) return;
    e.preventDefault();
    const item = e.target.closest('.project-item[data-proj]');
    document.querySelectorAll('.project-item').forEach(el => el.classList.remove('drag-over-proj'));
    if (item && item.dataset.proj !== draggedProj) item.classList.add('drag-over-proj');
  });

  list.addEventListener('dragleave', e => {
    if (!list.contains(e.relatedTarget)) {
      document.querySelectorAll('.project-item').forEach(el => el.classList.remove('drag-over-proj'));
    }
  });

  list.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('.project-item[data-proj]');
    const targetProj = item?.dataset.proj;
    if (!draggedProj || !targetProj || draggedProj === targetProj) {
      cleanupSidebarDrag(); return;
    }
    const allProjs = getProjects();
    const order = getOrderedProjects(allProjs);
    const from = order.indexOf(draggedProj);
    const to   = order.indexOf(targetProj);
    if (from !== -1 && to !== -1) {
      order.splice(from, 1);
      order.splice(to, 0, draggedProj);
    }
    colOrder = order;
    saveColOrder();
    cleanupSidebarDrag();
    renderAll();
  });

  list.addEventListener('dragend', cleanupSidebarDrag);
}

function cleanupSidebarDrag() {
  draggedProj = null;
  document.querySelectorAll('.project-item').forEach(el =>
    el.classList.remove('is-dragging-proj', 'drag-over-proj'));
}

// ── Persistence ───────────────────────────────────────────────────────────
async function loadTasks() {
  try { const r = await fetch('/api/tasks'); tasks = await r.json(); }
  catch { tasks = []; }
  renderAll();
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
async function doSave() {
  try {
    await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tasks)
    });
    updateLastSaved();
  } catch {}
}

function updateLastSaved() {
  const el = document.getElementById('last-updated');
  if (!el) return;
  el.textContent = 'Updated ' + formatDateTime(new Date().toISOString());
}

// ── Helpers ───────────────────────────────────────────────────────────────
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(d) {
  if (!d) return '';
  const [, m, day] = d.split('-');
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mon[+m - 1]} ${+day}`;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h = d.getHours(), mi = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 || 12;
  return `${mon[d.getMonth()]} ${d.getDate()}, ${hh}:${String(mi).padStart(2,'0')} ${ampm}`;
}

function isOverdue(due, done) {
  return !done && !!due && due < todayStr();
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getProjects() {
  const s = new Set();
  tasks.forEach(t => { if (t.project) s.add(t.project); });
  return Array.from(s).sort();
}

function getFiltered() {
  return tasks.filter(t => {
    // Archived mode: show only archived; normal mode: hide archived
    if (showArchived) { if (!t.archived) return false; }
    else              { if (t.archived)  return false; }
    if (!showDone && t.done) return false;
    if (filterProject  !== 'All' && t.project  !== filterProject)  return false;
    if (filterPriority !== 'All' && t.priority !== filterPriority) return false;
    if (filterStatus  && projStatus(t.project)   !== filterStatus)  return false;
    if (filterUser    && !(t.assignees||[]).includes(filterUser))  return false;
    if (filterDept    && t.department !== filterDept)              return false;
    if (filterCompany && projCompany(t.project)  !== filterCompany) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!t.title.toLowerCase().includes(q) &&
          !(t.notes  || '').toLowerCase().includes(q) &&
          !(t.project|| '').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ── Active filter chips bar ────────────────────────────────────────────────
function renderActiveFiltersBar() {
  const bar = document.getElementById('active-filters-bar');
  if (!bar) return;
  const chips = [];

  if (filterPriority && filterPriority !== 'All') {
    chips.push({ label: `Priority: ${filterPriority}`, clear: () => { filterPriority = 'All'; const el = document.getElementById('priority-filter'); if(el){el.value='All';el.classList.remove('filter-active');} renderAll(); } });
  }
  if (filterStatus) {
    const name = statuses.find(s => s.id === filterStatus)?.name || filterStatus;
    chips.push({ label: `Status: ${name}`, clear: () => { filterStatus = null; const el = document.getElementById('status-filter'); if(el){el.value='';el.classList.remove('filter-active');} renderAll(); } });
  }
  if (filterCompany) {
    const name = companies.find(c => c.id === filterCompany)?.name || filterCompany;
    chips.push({ label: `Company: ${name}`, clear: () => { filterCompany = null; const el = document.getElementById('company-filter'); if(el){el.value='';el.classList.remove('filter-active');} renderAll(); } });
  }
  if (filterDept) {
    const name = departments.find(d => d.id === filterDept)?.name || filterDept;
    chips.push({ label: `Dept: ${name}`, clear: () => { filterDept = null; const el = document.getElementById('dept-filter'); if(el){el.value='';el.classList.remove('filter-active');} renderAll(); } });
  }
  if (filterUser) {
    const name = users.find(u => u.id === filterUser)?.name || filterUser;
    chips.push({ label: `User: ${name}`, clear: () => { filterUser = null; const el = document.getElementById('user-filter'); if(el){el.value='';el.classList.remove('filter-active');} renderAll(); } });
  }

  if (!chips.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `<span class="active-filters-bar-label">Active:</span>` +
    chips.map((c, i) => `<span class="filter-chip-active">${esc(c.label)}<span class="chip-x" onclick="clearFilterChip(${i})">✕</span></span>`).join('') +
    (chips.length > 1 ? `<span class="filter-chip-clear" onclick="clearAllFilters()">Clear all</span>` : '');
  bar._chips = chips;
}

function clearFilterChip(i) {
  const bar = document.getElementById('active-filters-bar');
  if (bar && bar._chips && bar._chips[i]) bar._chips[i].clear();
}

function clearAllFilters() {
  filterPriority = 'All'; filterStatus = null; filterCompany = null; filterDept = null; filterUser = null;
  ['priority-filter','status-filter','company-filter','dept-filter','user-filter'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = id === 'priority-filter' ? 'All' : '';
    el.classList.remove('filter-active');
  });
  renderAll();
}

// ── Render ────────────────────────────────────────────────────────────────
function renderAll() {
  renderSidebar();
  renderViewsSection();
  renderUserFilter();
  renderPriorityFilter();
  renderStatusFilterRow();
  renderDeptFilter();
  renderCompanyFilter();
  renderActiveFiltersBar();
  if (currentView === 'kanban') renderKanban();
  else if (currentView === 'projects') renderProjectsBoard();
  else if (currentView === 'projects-list') renderProjectsList();
  else renderTasks();
  updateDatalist();
}

function setView(v) {
  currentView = v;
  const isList        = v === 'list';
  const isKanban      = v === 'kanban';
  const isProjects    = v === 'projects';
  const isProjectList = v === 'projects-list';
  document.getElementById('task-list').style.display         = isList        ? '' : 'none';
  document.getElementById('kanban-board').style.display      = isKanban      ? '' : 'none';
  document.getElementById('projects-board').style.display    = isProjects    ? '' : 'none';
  document.getElementById('projects-list-view').style.display = isProjectList ? '' : 'none';

  document.getElementById('view-projects-btn').classList.toggle('active', isProjects);
  document.getElementById('view-projects-list-btn').classList.toggle('active', isProjectList);
  document.getElementById('group-btn').style.display = isList ? '' : 'none';
  document.getElementById('group-select').style.display = isList ? '' : 'none';

function renderKanban() {
  const el = document.getElementById('kanban-board');
  const filtered = getFiltered();

  document.getElementById('toolbar-title').textContent =
    filterProject === 'All' ? 'All Tasks' : filterProject;
  document.getElementById('task-count').textContent =
    filtered.length ? `${filtered.length} task${filtered.length === 1 ? '' : 's'}` : '';

  // Build columns ordered by user preference
  const rawProjects = filterProject === 'All'
    ? Array.from(new Set(tasks.map(t => t.project || '').filter(Boolean)))
    : [filterProject];
  // When a status filter is active, hide columns whose project doesn't match
  const visibleProjects = filterStatus
    ? rawProjects.filter(p => projStatus(p) === filterStatus)
    : rawProjects;
  const projects = filterProject === 'All' ? getOrderedProjects(visibleProjects) : visibleProjects;

  const noProject = filterProject === 'All' ? filtered.filter(t => !t.project) : [];

  let cols = projects.map(p => ({
    name: p,
    tasks: sortTasks(filtered.filter(t => t.project === p))
  }));
  // Hide empty columns when any filter is active
  const anyFilter = filterUser || filterDept || filterStatus || filterCompany || searchQuery || showArchived || (filterPriority && filterPriority !== 'All');
  if (anyFilter) cols = cols.filter(c => c.tasks.length > 0);
  if (noProject.length) cols.push({ name: '—', tasks: sortTasks(noProject) });

  if (cols.length === 0) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">✓</div><div>No tasks here</div></div>`;
    return;
  }

  const draggable = filterProject === 'All';

  el.innerHTML = cols.map(col => {
    const st = projStatus(col.name);
    const dotStyle = statusDotStyle(st);
    return `
    <div class="kanban-col" data-proj="${esc(col.name)}">
      <div class="kanban-col-header"
        ${draggable ? `draggable="true" ondragstart="onColDragStart(event,'${esc(col.name)}')"` : ''}>
        <div style="display:flex;align-items:center;gap:7px;flex:1;min-width:0;">
          ${draggable ? '<span style="color:var(--surface2);font-size:0.8rem;">⠿</span>' : ''}
          <span class="status-dot ${st ? '' : 'status-none'}" style="${dotStyle}"
                title="${st ? statusLabel(st) : 'No status'}"
                onclick="openProjectPopover(event,'${esc(col.name)}')"></span>
          <span class="kanban-col-title" ondblclick="startColRename(event,'${esc(col.name)}')" title="Double-click to rename">${esc(col.name)}</span>
          ${st ? `<span class="status-badge" style="background:${statusColor(st)}22;color:${statusColor(st)}">${esc(statusLabel(st))}</span>` : ''}
        </div>
        <span class="kanban-col-count">${col.tasks.filter(t => !t.done).length}</span>
      </div>
      <div class="kanban-cards">
        ${col.tasks.map(t => kanbanCardHtml(t)).join('')}
      </div>
      <button class="kanban-add-btn" onclick="openAddModalForProject('${esc(col.name === '—' ? '' : col.name)}')">+ Add task</button>
    </div>
  `;}).join('');

  // Wire up delegation once the board DOM is ready
  initBoardDrag();
}

function kanbanCardHtml(t) {
  const doneSubs  = (t.subtasks || []).filter(s => s.done).length;
  const totalSubs = (t.subtasks || []).length;
  const overdue   = isOverdue(t.due, t.done);
  const pct = totalSubs ? Math.round(doneSubs / totalSubs * 100) : 0;

  const subHtml = showSubtasks && totalSubs ? `
    <div class="kc-sub">
      <div class="kc-sub-bar"><div class="kc-sub-fill" style="width:${pct}%"></div></div>
      ${doneSubs}/${totalSubs}
    </div>` : '';

  const visibleSubs = showDone ? t.subtasks : (t.subtasks || []).filter(s => !s.done);
  const subtaskListHtml = showSubtasks && visibleSubs.length ? `
    <div style="margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--surface1);margin-left:4px;">
      ${visibleSubs.map(s => `
        <div style="display:flex;flex-direction:column;gap:1px;">
          <div style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:${s.done ? 'var(--overlay1)' : 'var(--subtext0)'};">
            <input type="checkbox" ${s.done ? 'checked' : ''} style="accent-color:var(--accent);width:12px;height:12px;cursor:pointer;flex-shrink:0;"
              onclick="onSubCheck(event,'${t.id}','${s.id}')">
            <span style="${s.done ? 'text-decoration:line-through' : ''}">${esc(s.text)}</span>
          </div>
          ${s.done && s.doneAt ? `<div style="padding-left:18px;font-size:0.65rem;color:var(--green);opacity:0.75;">✓ Done ${formatDateTime(s.doneAt)}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="kanban-card ${t.done ? 'done' : ''} ${overdue ? 'overdue' : ''} ${t.archived ? 'is-archived' : ''}"
         draggable="true" data-taskid="${t.id}"
         onclick="onKanbanCardClick(event,'${t.id}')">
      ${t.archived ? `<div class="archived-ribbon">Archived</div>` : ''}
      <div class="kc-top">
        <input class="kc-checkbox" type="checkbox" ${t.done ? 'checked' : ''}
               onclick="onCheck(event,'${t.id}')">
        <span class="kc-title">${esc(t.title)}</span>
        ${t.priority ? `<span class="badge" style="background:${priorityColor(t.priority)}22;color:${priorityColor(t.priority)}">${esc(priorityName(t.priority))}</span>` : ''}
        ${t.department ? (() => { const d = deptById(t.department); return d ? `<span class="dept-badge" style="background:${d.color}22;color:${d.color}">${esc(d.name)}</span>` : ''; })() : ''}
      </div>
      ${t.notes ? `<div class="kc-notes">${esc(t.notes.slice(0, 80) + (t.notes.length > 80 ? '…' : ''))}</div>` : ''}
      ${subtaskListHtml}
      <div class="kc-footer">
        ${subHtml}

        ${t.due ? `<button class="cal-btn" onclick="openGoogleCalendar(event,'${esc(t.title)}','${t.due}','${esc(t.notes||'')}')" title="Add to Google Calendar">📅</button>` : ''}
      </div>
      ${t.taskType === 'accounting' && (t.acctPartner || t.acctBalance != null) ? `
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;">

        ${t.acctPartner ? `<span style="font-size:0.72rem;color:var(--subtext0);">${esc(t.acctPartner)}</span>` : ''}
        ${t.acctBalance != null ? `<span class="acct-balance">${t.acctBalance.toLocaleString()} USD</span>` : ''}
        <button class="odoo-link-btn" onclick="openOdooPartnerLedger(event,'${esc(t.acctPartnerId||'')}','${esc(t.acctPartner||'')}')">Odoo ↗</button>

      ${(t.assignees||[]).length ? `
      <div style="display:flex;gap:3px;margin-top:6px;">
        ${(t.assignees||[]).map(id => userAvatarHtml(userById(id),'sm')).join('')}
      </div>` : ''}

        <span class="kc-ts">⊕ Created ${formatDateTime(t.createdAt)}</span>
        ${t.done && t.doneAt ? `<span class="kc-ts done-ts">✓ Done ${formatDateTime(t.doneAt)}</span>` : ''}
      </div>
    </div>`;
}

  const el = document.getElementById('projects-list');
  const allActive = tasks.filter(t => !t.done).length;

      <span class="proj-label">All Tasks</span>

  const filteredSet = anyFilter ? new Set(getFiltered().map(t => t.project).filter(Boolean)) : null;

  function projItemHtml(p) {
    if (filteredSet && !filteredSet.has(p)) return '';
    const count  = anyFilter
      ? getFiltered().filter(t => t.project === p).length
      : tasks.filter(t => t.project === p && !t.done && !t.archived).length;
    const status = projStatus(p);
    const co     = projCompany(p);
    const dotStyle = statusDotStyle(status);
    return `
      <div class="project-item ${filterProject === p ? 'active' : ''}"
           draggable="true" data-proj="${esc(p)}"
           style=""
           ondragstart="onSidebarDragStart(event,'${esc(p)}')"
           onclick="selectProject('${esc(p)}')">
        <span class="proj-drag-handle">⠿</span>
        <span class="status-dot ${status ? '' : 'status-none'}" style="${dotStyle}"
              title="${status ? statusLabel(status) : 'No status — click to set'}"
              onclick="openProjectPopover(event,'${esc(p)}')"></span>
        <span class="proj-label">${esc(p)}</span>
        <button class="proj-edit-btn" onclick="openProjectPopover(event,'${esc(p)}')" title="Edit project">✎</button>
        <span class="proj-count">${count}</span>
      </div>`;
  }

  // Group by company first, then by status within each company
  const companyGroups = new Map();
  companies.forEach(c => companyGroups.set(c.id, { label: c.name, projs: [] }));
  companyGroups.set(null, { label: 'No Company', projs: [] });
  ordered.forEach(p => {
    const co = projCompany(p) || null;
    if (!companyGroups.has(co)) companyGroups.set(co, { label: 'No Company', projs: [] });
    companyGroups.get(co).projs.push(p);
  });

  let projItems = '';
  for (const [coId, { label, projs }] of companyGroups) {
    if (!projs.length) continue;
    const isCoActive = filterCompany === coId;
    projItems += `<div class="sidebar-company-header ${isCoActive ? 'active' : ''}"
      onclick="toggleCompanyFilter(${coId ? `'${coId}'` : 'null'})">
      ${esc(label)}
    </div>`;

    // Sub-group by status within company
    const statusGroups = new Map();
    statuses.forEach(s => statusGroups.set(s.id, []));
    statusGroups.set(null, []);
    projs.forEach(p => {
      const st = projStatus(p) || null;
      if (!statusGroups.has(st)) statusGroups.set(st, []);
      statusGroups.get(st).push(p);
    });

    for (const [stId, stProjs] of statusGroups) {
      if (!stProjs.length) continue;
      const color = stId ? statusColor(stId) : 'var(--surface2)';
      const stLabel = stId ? statusLabel(stId) : 'No Status';
      projItems += `<div class="sidebar-group-header" style="display:flex;align-items:center;gap:5px;">
        <span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;"></span>
        ${esc(stLabel)}
      </div>`;
      projItems += stProjs.map(projItemHtml).join('');
    }
  }

  el.innerHTML = allItem + projItems;
  initSidebarDrag();
}

function getPrioOrder(id) { const i = priorities.findIndex(p => p.id === id); return i === -1 ? 99 : i; }

function taskCardHtml(t) {
  const doneSubs  = (t.subtasks || []).filter(s => s.done).length;
  const totalSubs = (t.subtasks || []).length;
  const overdue   = isOverdue(t.due, t.done);
  const visibleSubs = showDone ? (t.subtasks || []) : (t.subtasks || []).filter(s => !s.done);
  const subListHtml = showSubtasks && visibleSubs.length ? `
    <div style="margin-top:6px;padding-left:20px;display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--surface1);margin-left:4px;">
      ${visibleSubs.map(s => `
        <div style="display:flex;flex-direction:column;gap:1px;">
          <div style="display:flex;align-items:center;gap:7px;font-size:0.8rem;color:${s.done ? 'var(--overlay1)' : 'var(--subtext0)'};">
            <input type="checkbox" ${s.done ? 'checked' : ''} style="accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0;"
              onclick="onSubCheck(event,'${t.id}','${s.id}')">
            <span style="${s.done ? 'text-decoration:line-through' : ''}">${esc(s.text)}</span>
          </div>
          ${s.done && s.doneAt ? `<div style="padding-left:20px;font-size:0.65rem;color:var(--green);opacity:0.75;">✓ Done ${formatDateTime(s.doneAt)}</div>` : ''}
        </div>`).join('')}
    </div>` : '';
  const showProj = filterProject === 'All' && !groupByProject && t.project;
  return `
    <div class="task-card ${t.done ? 'done' : ''} ${overdue ? 'overdue' : ''} ${t.archived ? 'is-archived' : ''}"
         onclick="onCardClick(event,'${t.id}')">
      ${t.archived ? `<div class="archived-ribbon">Archived</div>` : ''}
      <input class="task-checkbox" type="checkbox" ${t.done ? 'checked' : ''}
             onclick="onCheck(event,'${t.id}')">
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        ${t.notes ? `<div class="task-notes">${esc(t.notes.slice(0, 100) + (t.notes.length > 100 ? '…' : ''))}</div>` : ''}
        ${subListHtml}
        <div class="task-timestamps">
          <span class="task-ts">⊕ ${formatDateTime(t.createdAt)}</span>
          ${t.done && t.doneAt ? `<span class="task-ts done-ts">✓ Done ${formatDateTime(t.doneAt)}</span>` : ''}
        </div>
      </div>
      <div class="task-meta">
        ${t.department ? (() => { const d = deptById(t.department); return d ? `<span class="dept-badge" style="background:${d.color}22;color:${d.color}">${esc(d.name)}</span>` : ''; })() : ''}
        ${t.taskType === 'accounting' ? `<span class="acct-badge">$</span>` : ''}
        ${t.acctBalance != null ? `<span class="acct-balance">${t.acctBalance.toLocaleString()} USD</span>` : ''}
        ${t.acctPartner && t.taskType === 'accounting' ? `<button class="odoo-link-btn" onclick="openOdooPartnerLedger(event,'${esc(t.acctPartnerId||'')}','${esc(t.acctPartner||'')}')">Odoo ↗</button>` : ''}
        ${t.priority ? `<span class="badge" style="background:${priorityColor(t.priority)}22;color:${priorityColor(t.priority)}">${esc(priorityName(t.priority))}</span>` : ''}
        ${showProj ? `<span class="task-proj-tag">${esc(t.project)}</span>` : ''}
        ${t.due ? `<span class="task-due">${formatDate(t.due)}</span>` : ''}
        ${t.due ? `<button class="cal-btn" onclick="openGoogleCalendar(event,'${esc(t.title)}','${t.due}','${esc(t.notes||'')}')" title="Add to Google Calendar">📅</button>` : ''}
        ${(t.assignees||[]).length ? `<span style="display:flex;gap:2px;">${(t.assignees||[]).map(id => userAvatarHtml(userById(id),'sm')).join('')}</span>` : ''}
      </div>
    </div>`;
}

function sortTasks(arr) {
  return [...arr].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const pa = getPrioOrder(a.priority), pb = getPrioOrder(b.priority);
    if (pa !== pb) return pa - pb;
    if (a.due && b.due) return a.due < b.due ? -1 : 1;
    if (a.due) return -1;
    if (b.due) return 1;
    return a.createdAt < b.createdAt ? 1 : -1;
  });
}

function renderTasks() {
  const el = document.getElementById('task-list');
  const filtered = getFiltered();

  document.getElementById('toolbar-title').textContent =
    filterProject === 'All' ? 'All Tasks' : filterProject;
  document.getElementById('task-count').textContent =
    filtered.length ? `${filtered.length} task${filtered.length === 1 ? '' : 's'}` : '';

  if (filtered.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✓</div>
        <div>No tasks here</div>
        <div class="empty-hint">Press <b>N</b> or click "+ Add task" to create one</div>
      </div>`;
    return;
  }

  if (groupBy && filterProject === 'All') {
    const groups = new Map();
    sortTasks(filtered).forEach(t => {
      let key, label;
      if (groupBy === 'project') {
        key = t.project || '—'; label = key;
      } else if (groupBy === 'status') {
        const st = projStatus(t.project);
        key = st || '—'; label = st ? statusLabel(st) : 'No Status';
      } else if (groupBy === 'dept') {
        const d = deptById(t.department);
        key = t.department || '—'; label = d ? d.name : 'No Department';
      }
      if (!groups.has(key)) groups.set(key, { label, tasks: [] });
      groups.get(key).tasks.push(t);
    });

    // For status grouping, respect statuses order; otherwise alpha
    let keys;
    if (groupBy === 'status') {
      const statusIds = statuses.map(s => s.id);
      keys = [...groups.keys()].sort((a, b) => {
        const ia = statusIds.indexOf(a), ib = statusIds.indexOf(b);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1; if (ib === -1) return -1;
        return ia - ib;
      });
    } else {
      keys = [...groups.keys()].sort((a, b) => a === '—' ? 1 : b === '—' ? -1 : a.localeCompare(b));
    }

    el.innerHTML = keys.map(key => {
      const { label, tasks: gt } = groups.get(key);
      const color = groupBy === 'status' && key !== '—' ? statusColor(key) : null;
      const dot = color ? `<span style="width:9px;height:9px;border-radius:50%;background:${color};display:inline-block;margin-right:6px;flex-shrink:0;"></span>` : '';
      return `<div class="group-header" style="display:flex;align-items:center;">${dot}${esc(label)}</div>
        ${gt.map(taskCardHtml).join('')}`;
    }).join('');
    return;
  }

  // Flat sorted list
  const sorted = sortTasks(filtered);

  el.innerHTML = sorted.map(t => {
    const doneSubs  = (t.subtasks || []).filter(s => s.done).length;
    const totalSubs = (t.subtasks || []).length;
    const overdue   = isOverdue(t.due, t.done);
    const pct = totalSubs ? Math.round(doneSubs / totalSubs * 100) : 0;

    const subHtml = showSubtasks && totalSubs ? `
      <div class="subtask-progress">
        <div class="sub-bar"><div class="sub-bar-fill" style="width:${pct}%"></div></div>
        ${doneSubs}/${totalSubs} subtasks
      </div>` : '';

    const showProj = filterProject === 'All' && t.project;

    return `
      <div class="task-card ${t.done ? 'done' : ''} ${overdue ? 'overdue' : ''}"
           onclick="onCardClick(event,'${t.id}')">
        <input class="task-checkbox" type="checkbox" ${t.done ? 'checked' : ''}
               onclick="onCheck(event,'${t.id}')">
        <div class="task-body">
          <div class="task-title">${esc(t.title)}</div>
          ${t.notes ? `<div class="task-notes">${esc(t.notes.slice(0, 100) + (t.notes.length > 100 ? '…' : ''))}</div>` : ''}
          ${subHtml}
        </div>
        <div class="task-meta">
          ${t.priority ? `<span class="badge" style="background:${priorityColor(t.priority)}22;color:${priorityColor(t.priority)}">${esc(priorityName(t.priority))}</span>` : ''}
          ${showProj ? `<span class="task-proj-tag">${esc(t.project)}</span>` : ''}
          ${t.due ? `<span class="task-due">${formatDate(t.due)}</span>` : ''}
        </div>
      </div>`;
  }).join('');
}

function startColRename(e, projName) {
  e.stopPropagation();
  const span = e.target;
  const inp = document.createElement('input');
  inp.className = 'kanban-col-rename-input';
  inp.value = projName;
  span.replaceWith(inp);
  inp.focus(); inp.select();
  function commit() {
    const newName = inp.value.trim();
    if (newName && newName !== projName) {
      // Rename project across tasks, projectMeta, colOrder
      tasks.forEach(t => { if (t.project === projName) t.project = newName; });
      if (projectMeta[projName]) {
        projectMeta[newName] = projectMeta[projName];
        delete projectMeta[projName];
      }
      const ci = colOrder.indexOf(projName);
      if (ci !== -1) colOrder[ci] = newName;
      if (filterProject === projName) filterProject = newName;
      saveColOrder();
      saveProjectMeta();
      scheduleSave();
    }
    renderAll();
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') inp.blur();
    if (e.key === 'Escape') { inp.value = projName; inp.blur(); }
  });
}

// ── Google Calendar ────────────────────────────────────────────────────────
function openGoogleCalendar(e, title, date, notes) {
  e.stopPropagation();
  const d = date.replace(/-/g, '');
  const next = new Date(date); next.setDate(next.getDate() + 1);
  const endD = next.toISOString().slice(0, 10).replace(/-/g, '');
  const url = new URL('https://calendar.google.com/calendar/render');
  url.searchParams.set('action', 'TEMPLATE');
  url.searchParams.set('text', title);
  url.searchParams.set('dates', `${d}/${endD}`);
  if (notes) url.searchParams.set('details', notes);
  window.open(url.toString(), '_blank');
}

  task.done   = e.target.checked;

function openEditModal(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editingId        = id;
  editingPriority  = t.priority || '';
  editingSubtasks  = (t.subtasks || []).map(s => ({ ...s }));
  editingAssignees = [...(t.assignees || [])];
  editingTaskType  = t.taskType || 'task';
  editingDept      = t.department || null;
  window._showAddUserForm = false;
  document.getElementById('modal-title').textContent = 'Edit Task';
  document.getElementById('m-title').value   = t.title;
  document.getElementById('m-project').value = t.project || '';
  document.getElementById('m-due').value     = t.due || '';
  document.getElementById('m-notes').value   = t.notes || '';
  document.getElementById('m-partner').value    = t.acctPartner || '';
  document.getElementById('m-balance').value    = t.acctBalance != null ? t.acctBalance : '';
  document.getElementById('m-partner-id').value = t.acctPartnerId || '';
  document.getElementById('delete-btn').style.display = '';
  const archBtn = document.getElementById('archive-btn');
  archBtn.style.display = '';
  archBtn.textContent = t.archived ? 'Unarchive' : 'Archive';
  archBtn.style.color = t.archived ? 'var(--green)' : '';
  setPriorityUI(t.priority || '');
  selectDept(editingDept);
  renderModalDepts();
  renderModalAssignees();
  renderSubtaskList();
  openModal('task-modal');
  setTimeout(() => document.getElementById('m-title').focus(), 60);
}

function saveTask() {
  const title = document.getElementById('m-title').value.trim();
  if (!title) { document.getElementById('m-title').focus(); return; }

  const isAcct = editingTaskType === 'accounting';
  const data = {
    title,
    project:       document.getElementById('m-project').value.trim(),
    due:           document.getElementById('m-due').value,
    priority:      editingPriority,
    notes:         document.getElementById('m-notes').value.trim(),
    subtasks:      editingSubtasks,
    assignees:     editingAssignees,
    taskType:      editingTaskType,
    department:    editingDept,
    acctPartner:   isAcct ? document.getElementById('m-partner').value.trim() : '',
    acctBalance:   isAcct && document.getElementById('m-balance').value !== '' ? parseFloat(document.getElementById('m-balance').value) : null,
    acctPartnerId: isAcct ? document.getElementById('m-partner-id').value.trim() : '',
  };

  if (editingId) {
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx >= 0) Object.assign(tasks[idx], data);
  } else {
    tasks.push({ id: uid(), done: false, doneAt: null, createdAt: new Date().toISOString(), ...data });
  }

  closeModal();
  scheduleSave();
  renderAll();
}

function deleteTask() {
  if (!editingId) return;
  if (!confirm('Delete this task?')) return;
  tasks = tasks.filter(t => t.id !== editingId);
  closeModal();
  scheduleSave();
  renderAll();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('task-modal').classList.contains('open')) { closeModal(); return; }
    if (document.getElementById('proj-modal').classList.contains('open')) { closeNewProjectModal(); return; }
    if (document.getElementById('save-view-modal').classList.contains('open')) { closeModalById('save-view-modal'); return; }
  }
  const tag = document.activeElement?.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.key === 'n' && !typing && !e.ctrlKey && !e.metaKey) openAddModal();
});

// ── Boot ──────────────────────────────────────────────────────────────────
loadColOrder();
loadSavedViews();
Promise.all([loadProjectMeta(), loadUsers(), loadDepartments(), loadCompanies(), loadStatuses(), loadPriorities(), loadChangelog()])
  .then(() => loadTasks());
</script>
