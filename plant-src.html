<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Plant · Shift Group</title>
<link rel="icon" href="/icons/hub-192.png">
<!-- One page for the plants whose sources are told apart from the inverter's own readings — Bookstop Kaslique and
     McKinsey Electronics (Mario 2026-10-20, same idea as /energy/plants/mahab). The plant comes from the path
     (/energy/plants/<key>); data from /api/plant-src?p=<key> (plantsrc.js). PUBLIC: the owners and the generator
     supplier get the link. Print = a light A4 version (the controls drop out). -->
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--green:#a6e3a1;--blue:#89b4fa;--red:#f38ba8;}
  *{box-sizing:border-box;} [hidden]{display:none !important;}
  html,body{background:var(--base);}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--surface0);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1.05rem;}
  .wordmark span{color:var(--amber);} .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:1.25rem;font-weight:600;margin:0 0 4px;} .lead{color:var(--sub);font-size:.82rem;margin:0 0 12px;line-height:1.5;}
  button,a.btn{background:var(--mantle);color:var(--text);border:1px solid var(--surface0);border-radius:999px;padding:6px 12px;font-size:.8rem;font-family:inherit;cursor:pointer;text-decoration:none;}
  button:hover{border-color:var(--amber);} button.on{background:var(--amber);color:#1e1e2e;border-color:var(--amber);font-weight:600;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .row .sp{margin-left:auto;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;padding:12px 14px;}
  .kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;} .kpi span{font-size:.66rem;color:var(--overlay0);text-transform:uppercase;letter-spacing:.06em;}
  .kpi small{display:block;color:var(--sub);font-size:.7rem;margin-top:2px;}
  .card{background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.8rem;}
  th{font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--overlay0);font-weight:600;text-align:right;padding:8px;border-bottom:1px solid var(--surface0);white-space:nowrap;}
  th small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.62rem;}
  th:first-child,td:first-child{text-align:left;}
  td{padding:7px 8px;border-bottom:1px solid var(--surface0);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  td small{display:block;color:var(--overlay0);font-size:.64rem;}
  td .z{color:var(--surface1);}
  tr.tot td{font-weight:600;border-top:2px solid var(--amber);color:var(--amber);background:rgba(242,169,59,.08);}
  .mh{font-size:.95rem;margin:22px 0 8px;font-weight:600;}
  .note{background:var(--mantle);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.78rem;color:var(--sub);line-height:1.55;margin-top:14px;}
  .note b{color:var(--text);font-weight:600;}
  .err{color:var(--red);font-size:.85rem;margin:10px 0;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .c-e{background:#89b4fa;} .c-b{background:#cba6f7;} .c-s{background:#f38ba8;} .c-g{background:#cba6f7;} .c-r{background:#fab387;} .c-o{background:var(--surface1);}
  /* the time view: one 24 h bar per day */
  .tl{padding:12px 14px 10px;max-height:560px;overflow-y:auto;}
  .tl .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--sub);margin-bottom:10px;}
  .tl .r{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px;margin:3px 0;}
  .tl .r>span{font-size:.72rem;color:var(--sub);white-space:nowrap;}
  .tl .b{position:relative;height:44px;background:var(--base);border-radius:4px;overflow:hidden;}
  .tl .b.tall{height:58px;}
  .tl .b i{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:0 2px;box-shadow:inset -1px 0 0 rgba(30,30,46,.35);}
  .tl .b i b{display:block;font-style:normal;font-size:.56rem;font-weight:600;line-height:1.2;color:#1e1e2e;white-space:normal;overflow-wrap:anywhere;overflow:hidden;}
  .tl .b u{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(166,173,200,.18);}
  .tl .ax{position:relative;height:14px;font-size:.6rem;color:var(--overlay0);}
  .tl .ax s{position:absolute;transform:translateX(-50%);text-decoration:none;}
  #tip{min-height:1.2em;margin:6px 0 0;}
  /* the battery study (McKinsey, Mario 2026-10-22) */
  .sim{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
  .sim label{display:flex;flex-direction:column;gap:3px;font-size:.66rem;color:var(--overlay0);text-transform:uppercase;letter-spacing:.05em;}
  .sim input{width:96px;background:var(--mantle);color:var(--text);border:1px solid var(--surface0);border-radius:8px;padding:6px 8px;font:inherit;font-size:.85rem;}
  td.sol{color:var(--amber);} td.gen{color:#cba6f7;} td.sav{color:var(--green);}
  .kpi.sav b{color:var(--green);} .kpi.thr b{color:var(--amber);}
  td.thr{color:var(--amber);} th.tm,td.tm{text-align:left;white-space:normal;min-width:260px;font-size:.72rem;} td.tm i{display:inline-block;white-space:nowrap;font-style:normal;margin-right:10px;}
  .sim .sg{width:70px;font-size:.78rem;font-weight:600;color:var(--sub);align-self:center;}
  .sim .tot{align-self:center;font-size:.82rem;color:var(--text);font-variant-numeric:tabular-nums;}
  .sim input{width:84px;}
  tr.mrow{cursor:pointer;} tr.mrow:hover td{background:rgba(242,169,59,.06);}
  tr.dy td{font-size:.74rem;color:var(--sub);background:var(--base);}
  #stT th.grp{text-align:center;border-bottom:1px solid var(--surface1);}
  .after{color:var(--green);}
  @media (max-width:640px){ header{padding:12px 16px;} main{padding:14px 12px 40px;} .kpis{grid-template-columns:1fr 1fr;gap:8px;} table{font-size:.74rem;} th{padding:7px 4px;font-size:.54rem;} td{padding:7px 4px;} }
  /* print: light, A4, no controls — the page itself is the report for the owner and the generator supplier */
  @page{size:A4;margin:12mm;}
  @media print{
    :root{--base:#fff;--mantle:#fff;--surface0:#d9dde3;--surface1:#c9ccd2;--text:#1f2328;--sub:#444;--overlay0:#5f6670;}
    header{border-bottom:3px solid var(--amber);} .noprint,#plantCrumbs{display:none !important;}
    .card,.kpi{break-inside:avoid;} .tl{max-height:none;overflow:visible;} .tl .b{background:#eef0f3;}
    main{max-width:none;padding:8px 0;} h1{color:#1f3864;} .mh{color:#1f3864;}
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">SHIFT <span>GROUP</span><small>MAKE THE SHIFT</small></div>
  <a class="btn noprint" href="/" id="hubLink" hidden>Hub</a>
</header>
<main>
  <h1 id="title">Loading…</h1>
  <p class="lead" id="lead"></p>
  <div class="err" id="err"></div>
  <div id="app" hidden>
    <p class="lead" id="nowLine"></p>
    <div class="row noprint"><span id="months"></span><button class="sp" onclick="print()">📄 Print / PDF</button></div>
    <div class="kpis" id="kpis"></div>
    <div id="mmBox"><h2 class="mh">Month by month</h2>
    <div class="card"><table id="monthT"></table></div>
    <p class="lead noprint">Click a month for its days.</p></div>
    <div id="refusedBox" hidden>
      <h2 class="mh">Generator refused by the inverters</h2>
      <div class="card"><table id="refT"></table></div>
    </div>
    <div id="timeBox">
    <h2 class="mh">Which source, hour by hour</h2>
    <div class="row noprint"><button id="socBtn" title="Battery state of charge at the start → end of each stretch">🔋 Battery SOC</button></div>
    <div class="card tl" id="time"></div>
    <p class="lead noprint" id="tip"></p>
    </div>
    <div id="dayBox"><h2 class="mh">Day by day</h2>
    <div class="card"><table id="dayT"></table></div></div>
    <div id="studyBox" hidden>
      <h2 class="mh" id="stTitle">Battery — now and after an upgrade</h2>
      <div class="row noprint" id="stRange"></div>
      <div class="sim noprint">
        <span class="sg">Now</span>
        <label>Racks<input id="bR" type="number" min="0" step="1"></label>
        <label>Batteries a rack<input id="bP" type="number" min="0" step="1"></label>
        <label>kWh a battery<input id="bK" type="number" min="0" step="0.1"></label>
        <span class="tot" id="bT"></span>
      </div>
      <div class="sim noprint">
        <span class="sg">Upgrade</span>
        <label>Racks<input id="uR" type="number" min="0" step="1"></label>
        <label>Batteries a rack<input id="uP" type="number" min="0" step="1"></label>
        <label>kWh a battery<input id="uK" type="number" min="0" step="0.1"></label>
        <span class="tot" id="uT"></span>
      </div>
      <div class="sim noprint">
        <span class="sg">Prices</span>
        <label>Usable %<input id="sUse" type="number" min="10" max="100" step="5"></label>
        <label>$ a new battery<input id="sCost" type="number" min="0" step="50"></label>
        <label>Generator $ / kWh<input id="sKw" type="number" min="0" step="0.01"></label>
      </div>
      <div class="kpis" id="stKpis"></div>
      <div class="card"><table id="stT"></table></div>
      <p class="lead noprint">Click a month for its days.</p>
      <div class="note" id="stNote"></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</main>
<script src="/plant-crumbs.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MO = MONTHS.map(m => m.slice(0, 3));
  const f0 = v => v == null ? '' : Math.abs(v) < 0.05 ? '<span class="z">0</span>' : Math.round(v).toLocaleString('en-US');
  const f1 = v => v == null ? '' : Math.abs(v) < 0.05 ? '<span class="z">0</span>' : (Math.round(v * 10) / 10).toLocaleString('en-US');
  const dd = d => `${+d.slice(8)} ${MO[+d.slice(5, 7) - 1]}`;
  const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const key = location.pathname.replace(/\/$/, '').split('/').pop();
  let D = null, month = null, showSoc = false, mOpen = {};
  try { showSoc = localStorage.getItem('plantSrcSoc') === '1'; } catch {}

  // two calls (2026-10-22): the stored days first (Firestore, ~1 s), then — only when today's reading is over 10 min or
  // a day is missing — a live one that reads the cloud and re-draws. The page never waits on the cloud to show.
  const get = live => fetch('/api/plant-src?p=' + encodeURIComponent(key) + (live ? '&live=1' : '')).then(r => r.json());
  get(false).then(j => {
    if (j.error) throw new Error(j.error);
    if (j.stale) get(true).then(k => { if (!k.error) { D = k; render(); } }).catch(() => {});
    if (j.study) loadStudy();
    D = j; document.title = `${D.name} · Shift Group`;
    if (D.isAdmin && window.PlantCrumbs) PlantCrumbs.show(D.name.split(' ')[0]);
    const ms = [...new Set(Object.keys(D.days).map(d => d.slice(0, 7)))].sort();
    month = new URLSearchParams(location.search).get('m') || ms[ms.length - 1];
    $('months').innerHTML = ms.map(m => `<button data-m="${m}">${MO[+m.slice(5) - 1]} ${m.slice(0, 4)}</button>`).join(' ');
    $('months').onclick = e => { const b = e.target.closest('button'); if (b) { month = b.dataset.m; render(); } };
    $('socBtn').onclick = () => { showSoc = !showSoc; try { localStorage.setItem('plantSrcSoc', showSoc ? '1' : '0'); } catch {} render(); };
    $('monthT').onclick = e => { const tr = e.target.closest('tr.mrow'); if (tr) { mOpen[tr.dataset.m] = !mOpen[tr.dataset.m]; render(); } };
    $('time').onclick = e => { const i = e.target.closest('.b i'); $('tip').textContent = i ? i.title : ''; };
    $('app').hidden = false; render();
  }).catch(e => { $('title').textContent = 'Plant'; $('err').textContent = 'Could not load the plant (' + e.message + ').'; });

  function render() {
    const C = D.classes, K = Object.keys(C);
    $('title').textContent = `${D.name} — ${D.kwp} kWp`;
    $('lead').textContent = `${D.lead} · read from ${D.src === 'solarman' ? 'SOLARMAN' : 'DeyeCloud'}, the inverters' own readings every 5 minutes`;
    const n = D.now;
    if (n) {
      const at = new Date(n.at * 1000).toLocaleTimeString('en-GB', { timeZone: 'Asia/Beirut', hour: '2-digit', minute: '2-digit' });
      $('nowLine').innerHTML = `Now (${at}): <b>${n.src === 'o' ? 'no source — on battery and sun' : C[n.src]}</b>${n.hz && n.src !== 'o' ? ' · ' + n.hz + ' Hz' : ''} · battery ${n.soc} % · solar ${f1(n.pv / 1000)} kW · load ${f1(n.l / 1000)} kW`;
    }
    // a plant with the battery study (McKinsey): the month buttons, these tiles and the month table go — the battery table has every
    // month (Mario 2026-10-23: "month by month dashboard is useless, I already have the table")
    // Bookstop too (Mario 2026-10-23: "dashboard per month useless") — the month table and the days carry it
    $('months').hidden = $('kpis').hidden = true;
    $('mmBox').hidden = !!D.study;
    $('months').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === month));
    $('socBtn').classList.toggle('on', showSoc);
    const days = Object.keys(D.days).filter(d => d.startsWith(month)).sort();
    const T = { pv: 0, load: 0, full: 0, socMin: null, src: {}, ref: 0 };
    for (const k of K) T.src[k] = { h: 0, in: 0, out: 0 };
    for (const d of days) { const s = D.days[d]; T.pv += s.pv; T.load += s.load; T.full += s.full; if (s.socMin != null) T.socMin = T.socMin == null ? s.socMin : Math.min(T.socMin, s.socMin);
      for (const k of K) for (const f of ['h', 'in', 'out']) T.src[k][f] += s.src[k][f]; T.ref += s.refused.length; }
    const tin = K.reduce((a, k) => a + T.src[k].in, 0), mName = `${MONTHS[+month.slice(5) - 1]} ${month.slice(0, 4)}`;
    $('kpis').innerHTML =
      `<div class="kpi"><span>Solar · ${mName}</span><b style="color:var(--amber)">${f0(T.pv)} kWh</b><small>${days.length} days${days.includes(D.today) ? ', today so far' : ''}</small></div>` +
      `<div class="kpi"><span>Load</span><b>${f0(T.load)} kWh</b></div>` +
      `<div class="kpi"><span>From ${K.length > 1 ? 'the sources' : 'the generator'}</span><b style="color:var(--red)">${f0(tin)} kWh</b><small>${K.filter(k => k !== 'r').map(k => `${C[k].replace(/ —.*/, '')} ${f0(T.src[k].h)} h`).join(' · ')}</small></div>` +
      `<div class="kpi"><span>Battery lowest</span><b style="color:${T.socMin != null && T.socMin < 20 ? 'var(--red)' : 'var(--green)'}">${T.socMin ?? '—'} %</b><small>${days.filter(d => D.days[d].socMin != null && D.days[d].socMin < 20).length} days under 20 %</small></div>` +
      `<div class="kpi"><span>Battery full, sun up</span><b>${f0(T.full)} h</b><small>solar held back — nowhere to put it</small></div>` +
      (C.r ? `<div class="kpi"><span>Generator refused</span><b style="color:${T.ref ? '#fab387' : 'var(--green)'}">${T.ref}×</b><small>${f0(T.src.r.h)} h in ${mName.split(' ')[0]}</small></div>` : '');

    // month by month — click a month for its days, a total row at the end (Mario 2026-10-23)
    const months = [...new Set(Object.keys(D.days).map(d => d.slice(0, 7)))].sort().reverse();
    const io = D.port === 'grid';
    let mt = `<tr><th>Month</th><th>Solar<small>kWh</small></th><th>Load<small>kWh</small></th>${K.map(k => `<th><span class="dot c-${k}"></span>${C[k]}<small>hours · kWh in${io ? ' · out' : ''}</small></th>`).join('')}<th>Battery<small>lowest %</small></th><th>Solar thrown<small>kWh · full h</small></th></tr>`;
    const tot = ds => { const t = { pv: 0, load: 0, full: 0, thrown: 0, low: null, src: {} };
      for (const k of K) t.src[k] = { h: 0, in: 0, out: 0 };
      for (const d of ds) { const s = D.days[d]; t.pv += s.pv; t.load += s.load; t.full += s.full; t.thrown += s.thrown || 0; if (s.socMin != null) t.low = t.low == null ? s.socMin : Math.min(t.low, s.socMin); for (const k of K) for (const f of ['h', 'in', 'out']) t.src[k][f] += s.src[k][f]; }
      return t; };
    const cells = (t, f) => `<td>${f(t.pv)}</td><td>${f(t.load)}</td>` + K.map(k => `<td>${f(t.src[k].h)} h · ${f(t.src[k].in)}${io ? ' · ' + f(t.src[k].out) : ''}</td>`).join('') + `<td>${t.low ?? ''}</td><td class="thr">${f(t.thrown)} · ${f(t.full)} h</td>`;
    for (const m of months) {
      const ds = Object.keys(D.days).filter(d => d.startsWith(m)).sort();
      mt += `<tr class="mrow" data-m="${m}"><td>${mOpen[m] ? '▾' : '▸'} ${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}<small>${ds.length} days${ds.includes(D.today) ? ', to today' : ''}</small></td>${cells(tot(ds), f0)}</tr>`;
      if (mOpen[m]) for (const d of ds.slice().reverse()) {
        const x = D.days[d];
        mt += `<tr class="dy"><td>${dd(d)}${d === D.today ? '<small>so far</small>' : x.n < 250 ? '<small>' + x.n + ' readings</small>' : ''}</td><td>${f1(x.pv)}</td><td>${f1(x.load)}</td>` +
          K.map(k => `<td>${f1(x.src[k].h)} h · ${f1(x.src[k].in)}${io ? ' · ' + f1(x.src[k].out) : ''}</td>`).join('') + `<td>${x.socMin ?? ''}${x.socMax != null ? '–' + x.socMax : ''}</td><td class="thr">${f1(x.thrown || 0)} · ${f1(x.full)} h</td></tr>`;
      }
    }
    const allDays = Object.keys(D.days);
    mt += `<tr class="tot"><td>Total<small>${allDays.length} days</small></td>${cells(tot(allDays), f0)}</tr>`;
    $('monthT').innerHTML = mt;

    // the refused generator (Bookstop)
    $('refusedBox').hidden = !C.r;
    if (C.r) {
      let rt = `<tr><th>Day</th><th>From – to</th><th>Minutes</th><th>Frequency<small>highest, Hz</small></th><th>Battery<small>start → end (lowest) %</small></th></tr>`;
      const all = days.flatMap(d => D.days[d].refused.map(x => ({ d, ...x }))).reverse();
      for (const x of all) rt += `<tr><td>${dd(x.d)}</td><td>${x.a} – ${x.b}</td><td>${x.min}</td><td>${x.hz ?? ''}</td><td>${x.s0} → ${x.s1} (${x.sMin})</td></tr>`;
      if (!all.length) rt += `<tr><td colspan="5" style="text-align:left;color:var(--green)">No refused stretch in ${mName}.</td></tr>`;
      $('refT').innerHTML = rt;
    }

    // time view — not for McKinsey (Mario 2026-10-20: "remove for mckinsey": the generator runs a few hours a month, the bars stay empty)
    $('timeBox').hidden = D.key === 'mckinsey';
    const pos = m => (m / 1440 * 100).toFixed(3) + '%';
    const grid = [3, 6, 9, 12, 15, 18, 21].map(h => `<u style="left:${pos(h * 60)}"></u>`).join('');
    const ax = `<div class="r"><span></span><div class="ax">${[0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => `<s style="left:${pos(h * 60)}">${h}</s>`).join('')}</div></div>`;
    let tl = `<div class="lg">${K.map(k => `<span><span class="dot c-${k}"></span>${C[k]}</span>`).join('')}<span><span class="dot c-o"></span>no source (battery + sun)</span><span>on each stretch: kWh in${D.port === 'grid' ? ' · out' : ''}${showSoc ? ', battery start→end' : ''}</span></div>` + ax;
    for (const d of days.slice().reverse()) {
      const bar = D.days[d].bar || [];
      tl += `<div class="r"><span>${dd(d)}</span><div class="b${showSoc ? ' tall' : ''}">${grid}${bar.map(([k, a, b, io, ou, s0, s1]) =>
        `<i class="c-${k}" style="left:${pos(a)};width:${pos(b - a)}" title="${dd(d)} · ${C[k]} ${hm(a)}–${hm(b)} · in ${io}${D.port === 'grid' ? ' · out ' + ou : ''} kWh · battery ${s0} → ${s1} %">` +
        (io < 0.05 && ou < 0.05 ? '<b>0</b>' : (io >= 0.05 ? `<b>in ${io}</b>` : '') + (ou >= 0.05 ? `<b>out ${ou}</b>` : '')) +
        (showSoc ? `<b>${s0}→${s1}%</b>` : '') + `</i>`).join('')}</div></div>`;
    }
    $('time').innerHTML = tl + ax;

    // day by day — not for McKinsey either (Mario 2026-10-20: "remove for mckinsey")
    $('dayBox').hidden = D.key === 'mckinsey';
    let dt = `<tr><th>Day</th><th>Solar</th><th>Load</th>${K.map(k => `<th><span class="dot c-${k}"></span>${C[k]}<small>h · in${D.port === 'grid' ? ' · out' : ''}</small></th>`).join('')}<th>Battery<small>min–max %</small></th><th>Solar thrown<small>kWh · full at</small></th><th class="tm">Timing</th></tr>`;
    for (const d of days.slice().reverse()) { const s = D.days[d];
      dt += `<tr><td>${dd(d)}${d === D.today ? '<small>so far</small>' : ''}${s.n < 250 && d !== D.today ? '<small>' + s.n + ' readings</small>' : ''}</td><td>${f1(s.pv)}</td><td>${f1(s.load)}</td>` +
        K.map(k => `<td>${f1(s.src[k].h)} · ${f1(s.src[k].in)}${D.port === 'grid' ? ' · ' + f1(s.src[k].out) : ''}</td>`).join('') + `<td>${s.socMin ?? ''}–${s.socMax ?? ''}</td><td class="thr">${f1(s.thrown || 0)}${s.fullAt ? ' · ' + s.fullAt : ''}</td>` +
        `<td class="tm">${(s.bar || []).map(([k, a, b]) => `<i><span class="dot c-${k}"></span>${hm(a)}–${hm(b)}</i>`).join('')}</td></tr>`; }
    $('dayT').innerHTML = dt;

    $('note').innerHTML = (D.key === 'bookstop'
      ? `<b>How each source is recognised.</b> EDL and both generators reach the inverters through the ATS on one input; the inverter logs that input's voltage and frequency every 5 minutes. ` +
        `<b>Big generator (150 kW)</b>: holds 50.0 Hz whatever the load (its governor), about 220 V — it runs the working day, about 07:45 to 21:30, not on Sundays. ` +
        `<b>EDL</b>: 49.0–49.5 Hz at a higher voltage (222–231 V), in blocks of 2–3 hours that start on the hour. ` +
        `<b>Small generator (80 kW)</b>: loaded it sags to 48.6–49.1 Hz at 217–219 V — short runs early morning and late night; with no load it runs fast (51.6–53 Hz) and the inverters <b>refuse</b> it (nothing comes in, the battery keeps draining) — the orange stretch and the table above. ` +
        `Re-read with Mario on 23 Oct 2026 (before that, the steady 50 Hz was wrongly shown as EDL).<br>`
      : `<b>The generator.</b> No EDL on this site; the generator is on the inverters' generator input, so every hour it ran and every kWh it gave is counted directly. ${D.history || ''}<br>`) +
      `<b>Solar thrown</b> = what the panels could have given while the battery sat full, minus what they gave: a clear-sky curve for that date, fitted on the same day's readings in the 90 min before the battery filled (a cloudy day gives a lower curve) — the same method as Villa Tohme. ` +
      `<b>Battery full, sun up</b> = hours the battery sat at 99–100 % while the panels produced: the inverters hold the solar back then, because there is nowhere to put it. ` +
      `<b>Method.</b> kWh = each reading's power × the time to the next one (about 5 minutes), summed; the inverters in parallel are added together. A day with missing readings is under-counted, never averaged up.`;
    renderStudy();
  }

  // ── the battery study (Mario 2026-10-22, McKinsey: "same as we did for Tohme — check the solar thrown, and what an
  // additional battery brings … the idea is to check what adding 120 kWh batt brings"). /api/plant-study, per day:
  // solar thrown while the battery sat full, generator kWh before / after that window. The extra battery runs through
  // the days in order: it fills from the thrown solar (up to its usable kWh) and gives it back in place of the generator,
  // carrying what is left to the next day. Settings kept in this browser.
  let S = null, stRange = 'now', stOpen = {};
  // Mario 2026-10-23: "mckinsey has rack1 12×5 = 60 kWh, rack2 12×5 = 60 kWh; if I upgrade to 4 racks × 9 batt = 180 kWh,
  // the difference before and after — generator hours / kWh per day / month — with the battery customised (number and kWh)"
  const SIM = { bR: 2, bP: 12, bK: 5, uR: 4, uP: 9, uK: 5, use: 90, cost: 1000, k: 0.30 };
  let simSet = false;
  function loadStudy() {
    try { const v = JSON.parse(localStorage.getItem('plantStudy2_' + key) || 'null'); if (v) { Object.assign(SIM, v); simSet = true; } } catch {}
    const go = live => fetch('/api/plant-study?p=' + encodeURIComponent(key) + (live ? '&live=1' : '')).then(r => r.json());
    go(false).then(j => {
      if (j.error) return; S = j;
      if (!simSet && S.batt) { Object.assign(SIM, { bR: S.batt.racks, bP: S.batt.per, bK: S.batt.kwh }); if (S.upgrade) Object.assign(SIM, { uR: S.upgrade.racks, uP: S.upgrade.per, uK: S.upgrade.kwh }); }
      for (const f of ['bR', 'bP', 'bK', 'uR', 'uP', 'uK']) $(f).value = SIM[f];
      renderStudy();
      if (j.left) go(true).then(k => { if (!k.error) { S = k; renderStudy(); } }).catch(() => {});
    }).catch(() => {});
    for (const [id, f] of [['bR', 'bR'], ['bP', 'bP'], ['bK', 'bK'], ['uR', 'uR'], ['uP', 'uP'], ['uK', 'uK'], ['sUse', 'use'], ['sCost', 'cost'], ['sKw', 'k']]) {
      $(id).value = SIM[f];
      $(id).addEventListener('input', () => { SIM[f] = +$(id).value || 0; simSet = true; try { localStorage.setItem('plantStudy2_' + key, JSON.stringify(SIM)); } catch {} renderStudy(); });
    }
    $('stRange').onclick = e => { const b = e.target.closest('button'); if (b) { stRange = b.dataset.r; stOpen = {}; renderStudy(); } };
    $('stT').onclick = e => { const tr = e.target.closest('tr.mrow'); if (tr) { stOpen[tr.dataset.m] = !stOpen[tr.dataset.m]; renderStudy(); } };
  }
  // the added kWh runs through the days in order: it fills from the solar thrown (up to its usable part) and gives it
  // back in place of the generator — the same day before the battery filled, or the evening / night after — carrying
  // what is left to the next day. Generator hours after = that day's hours × the share of its kWh still needed.
  function simulate(days, extra) {
    const cap = Math.max(0, extra) * SIM.use / 100; let e = 0;
    return days.map(d => {
      const a = Math.min(e, d.genBefore); e -= a;
      e += Math.min(cap - e, d.thrown);
      const b = Math.min(e, d.genAfter); e -= b;
      const rep = Math.min(d.gen, a + b), g2 = Math.max(0, d.gen - rep);
      return { ...d, rep, gen2: g2, h2: d.gen > 0 ? (d.genH || 0) * g2 / d.gen : 0 };
    });
  }
  function renderStudy() {
    if (!S || !D) return;
    $('studyBox').hidden = false;
    const nowK = SIM.bR * SIM.bP * SIM.bK, upK = SIM.uR * SIM.uP * SIM.uK, extra = upK - nowK, addN = SIM.uR * SIM.uP - SIM.bR * SIM.bP;
    $('bT').innerHTML = `= <b>${f0(nowK)} kWh</b> (${SIM.bR * SIM.bP} batteries)`;
    $('uT').innerHTML = `= <b>${f0(upK)} kWh</b> (${SIM.uR * SIM.uP} batteries) · <b class="${extra > 0 ? 'after' : ''}">${extra >= 0 ? '+' : ''}${f0(extra)} kWh</b>${addN > 0 ? ` · ${addN} batteries to buy` : ''}`;
    const all = simulate(S.days.filter(d => d.n > 0), extra);
    if (!all.length) { $('stKpis').innerHTML = '<p class="lead">No day stored yet.</p>'; return; }
    // the plant as it is now: from the first day DeyeCloud had the present kWp (it grew)
    const kNow = all[all.length - 1].kwp, since = (all.find((d, i) => all.slice(i).every(x => !x.kwp || x.kwp >= kNow * 0.9)) || all[0]).day;
    const yAgo = (() => { const t = new Date(D.today + 'T12:00:00Z'); t.setUTCFullYear(t.getUTCFullYear() - 1); return t.toISOString().slice(0, 10); })();
    const R = { now: [`Since ${kNow} kWp (${dd(since)} ${since.slice(0, 4)})`, d => d.day >= since], y: ['Last 12 months', d => d.day > yAgo], all: ['All', () => true] };
    $('stRange').innerHTML = Object.entries(R).map(([k, [l]]) => `<button data-r="${k}" class="${k === stRange ? 'on' : ''}">${l}</button>`).join(' ');
    const list = all.filter(R[stRange][1]), N = list.length, perYear = N ? 365 / N : 0;
    const sum = (a, f) => a.reduce((s, d) => s + (d[f] || 0), 0), cnt = (a, f) => a.filter(d => (d[f] || 0) >= 0.5).length;
    const G = { k: sum(list, 'gen'), h: sum(list, 'genH'), d: cnt(list, 'gen') }, G2 = { k: sum(list, 'gen2'), h: sum(list, 'h2'), d: cnt(list, 'gen2') };
    const full = list.filter(d => d.fullAt), thrown = sum(list, 'thrown'), rep = G.k - G2.k;
    const cost = Math.max(0, addN) * SIM.cost, saveY = rep * SIM.k * perYear, pay = saveY > 0 ? cost / saveY : null;
    const h1 = h => h < 10 ? (Math.round(h * 10) / 10).toLocaleString('en-US') : f0(h);
    $('stTitle').textContent = `Battery — ${f0(nowK)} kWh now → ${f0(upK)} kWh (${S.invKw} kW of inverters)`;
    $('stKpis').innerHTML =
      `<div class="kpi"><span>Battery full from the sun</span><b>${full.length} days</b><small>of ${N} with ${f0(nowK)} kWh</small></div>` +
      `<div class="kpi thr"><span>Solar thrown</span><b>${f0(thrown)} kWh</b><small>${f0(thrown * perYear)} a year · held back while the battery was full</small></div>` +
      `<div class="kpi"><span>Generator now · ${f0(nowK)} kWh</span><b style="color:#cba6f7">${f0(G.k)} kWh</b><small>${h1(G.h)} h · ${G.d} days · ${f0(G.k * perYear)} kWh a year</small></div>` +
      `<div class="kpi sav"><span>Generator after · ${f0(upK)} kWh</span><b>${f0(G2.k)} kWh</b><small>${h1(G2.h)} h · ${G2.d} days · ${f0(G2.k * perYear)} kWh a year</small></div>` +
      `<div class="kpi sav"><span>Saves</span><b>$${f0(saveY)} / year</b><small>${f0(rep)} kWh in these ${N} days · ${f0(G.h - G2.h)} h less · $${SIM.k} a kWh</small></div>` +
      `<div class="kpi"><span>Pays back in</span><b style="color:${pay && pay < 6 ? 'var(--green)' : 'var(--red)'}">${addN <= 0 ? '—' : pay ? (pay > 99 ? 'over 99 y' : (Math.round(pay * 10) / 10) + ' y') : 'never'}</b><small>${addN > 0 ? `${addN} × $${f0(SIM.cost)} = $${f0(cost)}` : 'no battery to buy'}</small></div>`;
    const ms = [...new Set(list.map(d => d.day.slice(0, 7)))].sort().reverse();
    const gcell = (k, h, n, cls) => `<td class="${cls}">${f0(k)}</td><td class="${cls}">${h1(h)}</td><td class="${cls}">${n}</td>`;
    let t = `<tr><th></th><th></th><th></th><th></th><th></th><th class="grp" colspan="3">Generator now · ${f0(nowK)} kWh</th><th class="grp" colspan="3">Generator after · ${f0(upK)} kWh</th><th></th><th></th></tr>` +
      `<tr><th>Month</th><th>kWp</th><th>Solar<small>kWh</small></th><th>Battery full<small>days</small></th><th>Solar thrown<small>kWh</small></th>` +
      `<th>kWh</th><th>hours</th><th>days</th><th>kWh</th><th>hours</th><th>days</th><th>Saved<small>kWh</small></th><th>Saves<small>$</small></th></tr>`;
    for (const m of ms) {
      const x = list.filter(d => d.day.startsWith(m)), ks = x.map(d => d.kwp).filter(Boolean);
      const r = sum(x, 'gen') - sum(x, 'gen2');
      t += `<tr class="mrow" data-m="${m}"><td>${stOpen[m] ? '▾' : '▸'} ${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}<small>${x.length} days</small></td><td>${ks.length ? Math.max(...ks) : ''}</td><td>${f0(sum(x, 'pv'))}</td><td>${x.filter(d => d.fullAt).length}</td><td class="sol">${f0(sum(x, 'thrown'))}</td>` +
        gcell(sum(x, 'gen'), sum(x, 'genH'), cnt(x, 'gen'), 'gen') + gcell(sum(x, 'gen2'), sum(x, 'h2'), cnt(x, 'gen2'), 'sav') + `<td class="sav">${f0(r)}</td><td class="sav">${f0(r * SIM.k)}</td></tr>`;
      if (stOpen[m]) for (const d of x.slice().reverse()) {
        const r2 = d.gen - d.gen2;
        t += `<tr class="dy"><td>${dd(d.day)}<small>${d.fullAt ? 'full at ' + d.fullAt : 'battery not full'} · ${d.socMin ?? ''}–${d.socMax ?? ''} %</small></td><td>${d.kwp || ''}</td><td>${f1(d.pv)}</td><td>${d.fullAt ? '✓' : ''}</td><td class="sol">${f1(d.thrown)}</td>` +
          `<td class="gen">${f1(d.gen)}</td><td class="gen">${f1(d.genH)}</td><td></td><td class="sav">${f1(d.gen2)}</td><td class="sav">${f1(d.h2)}</td><td></td><td class="sav">${f1(r2)}</td><td class="sav">${f1(r2 * SIM.k)}</td></tr>`;
      }
    }
    t += `<tr class="tot"><td>${R[stRange][0]}<small>${N} days</small></td><td></td><td>${f0(sum(list, 'pv'))}</td><td>${full.length}</td><td>${f0(thrown)}</td>` +
      `<td>${f0(G.k)}</td><td>${h1(G.h)}</td><td>${G.d}</td><td>${f0(G2.k)}</td><td>${h1(G2.h)}</td><td>${G2.d}</td><td>${f0(rep)}</td><td>${f0(rep * SIM.k)}</td></tr>`;
    $('stT').innerHTML = t;
    $('stNote').innerHTML =
      `<b>Generator now</b> = what the generator actually gave, from the station's 5-minute readings (hours = readings with more than 0.5 kW coming in). ` +
      `<b>Generator after</b> = the same days with the battery set above: the ${f0(Math.max(0, extra))} kWh added (${SIM.use} % usable = ${f0(Math.max(0, extra) * SIM.use / 100)} kWh) is run through the days in order. It fills from the solar thrown — the solar the inverters hold back once the battery is full (clear-sky curve fitted on the same day's readings before the battery filled, same method as Villa Tohme) — and gives it back whenever the generator ran: the same morning before the battery filled, or the evening and night after, carrying what is left to the next day. ` +
      `A day's generator hours after = its hours × the share of its kWh still needed. Losses in and out of the battery are not counted (a few %), so the saving is slightly on the high side. Nothing is guessed for days with no readings. <b>kWp</b> = what DeyeCloud had installed that day — the plant grew, so the first range is the plant as it is now.`;
  }
})();
</script>
</body>
</html>
