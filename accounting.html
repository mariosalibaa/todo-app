<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#714B67">
<title>Accounting · Accounts</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  /* Odoo-like: purple top bar, white grid, thin borders, few colours */
  :root{--odoo:#714B67;--odoo2:#875A7B;--line:#dee2e6;--muted:#6c757d;--bg:#f8f9fa;--text:#212529;--amber:#F2A93B;--green:#28a745;--red:#dc3545;--blue:#1a73e8;--auto:#1a73e8;--manual-bg:#eaf6ec;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--text);background:#fff;display:flex;flex-direction:column;overflow:hidden;}
  .top,.bar,.msg,.legend{flex:none;}
  .top{background:var(--odoo);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;height:46px;}
  .top a{color:#fff;text-decoration:none;opacity:.85;}
  .top .brand{font-weight:600;font-size:14px;}
  .top .sp{flex:1;}
  .top .who{font-size:12px;opacity:.85;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg);}
  .bar select,.bar input{border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-size:13px;background:#fff;height:30px;}
  .bar .search{min-width:180px;flex:1;max-width:320px;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 10px;height:30px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .btn.primary{background:var(--odoo);border-color:var(--odoo);color:#fff;}
  .btn:disabled{opacity:.5;cursor:default;}
  .legend{display:flex;gap:16px;align-items:center;padding:4px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line);}
  .legend .clr{margin-left:auto;color:var(--odoo);cursor:pointer;display:none;}
  .legend .clr.on{display:inline;}
  .wrap{flex:1;min-height:0;overflow:auto;}   /* grid scrolls; top bar, toolbar and header stay */
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1300px;}
  thead th{position:sticky;background:var(--bg);text-align:left;font-weight:600;padding:0 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;color:#495057;z-index:2;}
  thead tr.hdr th{top:0;height:30px;cursor:pointer;user-select:none;}
  thead tr.hdr th:hover{color:var(--odoo);}
  thead tr.hdr th .arr{color:var(--odoo);font-size:10px;margin-left:3px;}
  thead tr.flt th{top:30px;height:30px;padding:0 4px;border-bottom:2px solid var(--line);}
  thead tr.flt input,thead tr.flt select{width:100%;height:22px;border:1px solid var(--line);border-radius:3px;font-size:11px;padding:0 5px;background:#fff;font-family:inherit;}
  thead tr.flt input.on,thead tr.flt select.on{border-color:var(--odoo);background:#f5f2f7;}
  td{padding:3px 8px;border-bottom:1px solid #eef0f2;vertical-align:middle;white-space:nowrap;}
  tr:hover td{background:#f5f2f7;}
  tr.personal td{color:#9aa0a6;}
  tr.personal td input,tr.personal td select{color:#9aa0a6;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.debit{color:var(--red);} td.credit{color:var(--green);}
  td input[type=text],td select{width:100%;border:1px solid transparent;background:transparent;padding:4px 5px;font-size:13px;border-radius:3px;font-family:inherit;color:inherit;}
  td input[type=text]:hover,td select:hover{border-color:var(--line);}
  td input[type=text]:focus,td select:focus{border-color:var(--odoo2);outline:0;background:#fff;}
  td input.dirty{background:#fff8e6;}
  td input.saved{background:#eef9f0;}
  /* where a value came from */
  td.src-auto input,td.src-auto select,td.src-auto{color:var(--auto);font-style:italic;}
  td.src-manual input,td.src-manual select{background:var(--manual-bg);}
  td.src-odoo input,td.src-odoo select,td.src-odoo{color:var(--odoo);font-weight:600;}
  tr.personal td.src-auto input,tr.personal td.src-auto select{color:#8ab0e6;}
  .c-date{width:92px;} .c-desc{min-width:220px;max-width:320px;white-space:normal;} .c-partner{min-width:170px;} .c-company{width:140px;} .c-proj{min-width:150px;} .c-note{min-width:110px;}
  .c-desc .svc{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-right:4px;}
  .c-desc .who{font-size:11.5px;color:var(--muted);cursor:pointer;margin-top:1px;}
  .c-desc .who:hover{text-decoration:underline;}
  .c-desc .who.src-manual{color:var(--green);font-style:normal;} .c-desc .who.src-auto{color:var(--auto);font-style:italic;}
  td.c-desc,td.c-partner,td.c-company{vertical-align:top;padding-top:4px;}
  .odoo-warn{color:#b26a00;font-size:11px;margin-top:2px;}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;}
  .sheet[hidden]{display:none;}   /* display:flex would otherwise beat the hidden attribute and cover the grid */
  .sheet-box{background:#fff;border-radius:8px;width:min(920px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);}
  .sheet-body{overflow:auto;padding:12px 14px;}
  .sheet-body h4{margin:14px 0 6px;font-size:13px;} .sheet-body h4:first-child{margin-top:0;}
  .bill{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;font-size:12px;}
  .bill .grow{flex:1;min-width:0;}
  .bill .what{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bill .amt{font-variant-numeric:tabular-nums;font-weight:600;}
  .bill.done{background:#f6fbf7;border-color:#cfe8d6;}
  .rule{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;font-size:12px;}
  .rule.off{opacity:.55;}
  .btn.book{padding:1px 7px;height:22px;font-size:11.5px;color:var(--odoo);border-color:#d9c9d4;} .btn.book:hover{background:#f5f2f7;}
  .odoo-doc{color:var(--muted);font-size:11px;margin-top:1px;white-space:normal;word-break:break-word;}
  td:last-child{max-width:230px;}
  /* partner picker */
  .pick{position:relative;}
  .pick input{width:100%;}
  .pick-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:0 0 4px 4px;max-height:210px;overflow:auto;display:none;box-shadow:0 8px 20px rgba(0,0,0,.18);min-width:240px;}
  .pick-list.on{display:block;} .pick-list.empty{pointer-events:none;}
  .pick-list div{padding:5px 8px;cursor:pointer;display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-style:normal;color:var(--text);}
  .pick-list div .g{margin-left:auto;color:var(--muted);font-size:11px;}
  .pick-list div.hi{background:#dbeafc;} .pick-list div.none{color:var(--muted);cursor:default;}
  .sug-act{display:flex;gap:4px;align-items:center;}
  .sug-act button{border:1px solid var(--line);background:#fff;border-radius:3px;width:22px;height:20px;line-height:1;cursor:pointer;font-size:12px;padding:0;}
  .sug-act button.yes{color:var(--green);border-color:#bfe3c8;} .sug-act button.yes:hover{background:#eef9f0;}
  .sug-act button.no{color:var(--muted);} .sug-act button.no:hover{background:#f1f3f5;}
  .sug-act button.many{width:auto;padding:0 5px;color:var(--odoo);border-color:#d9c9d4;font-size:10.5px;font-weight:600;}
  .sug-act button.many:hover{background:#f5f2f7;}
  .sug-act button.many.over{color:var(--muted);border-color:var(--line);cursor:not-allowed;}
  .sug-act{margin-top:3px;flex-wrap:wrap;} .sug-act .what{flex-basis:100%;font-size:10.5px;color:var(--auto);font-style:italic;white-space:normal;line-height:1.25;}
  .sug-skip{color:#adb5bd;font-size:11px;margin-top:3px;} .sug-skip a{color:var(--odoo);cursor:pointer;}
  .ref{color:var(--muted);font-size:11px;}
  .c-proj .plan{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pick-list div.new{color:var(--odoo);font-weight:600;border-top:1px solid var(--line);}
  .pick-list div.new.off{color:var(--muted);font-weight:400;cursor:not-allowed;}
  .odoo-ok{color:var(--green);text-decoration:none;font-weight:600;}
  .odoo-no{color:#adb5bd;}
  .odoo-multi{color:var(--amber);font-weight:600;}
  tfoot td{font-weight:600;background:var(--bg);border-top:2px solid var(--line);}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);}
  .empty b{display:block;font-size:15px;color:var(--text);margin-bottom:6px;}
  .msg{padding:6px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);display:none;}
  .msg.err{color:var(--red);display:block;} .msg.ok{color:var(--green);display:block;}
  /* accounts: a line not counted (duplicate of another record), who really paid, the source of a line */
  tr.excluded td{color:#adb5bd;} tr.excluded td.debit,tr.excluded td.credit{text-decoration:line-through;}
  .flag{display:inline-block;font-size:10.5px;color:#b26a00;background:#fff4e0;border:1px solid #f4d9a6;border-radius:3px;padding:0 5px;margin-top:2px;white-space:nowrap;}
  .flag.own{color:var(--muted);background:#f1f3f5;border-color:var(--line);}
  .srctog{cursor:pointer;text-decoration:none;color:inherit;}
  .srctog:hover .src{border-color:var(--odoo);color:var(--odoo);}
  .srctog.off{opacity:.45;text-decoration:line-through;}
  .odoo-partner{color:#0d6efd;font-size:12px;margin-top:2px;white-space:normal;}
  .ptag{display:inline-block;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-top:2px;text-decoration:none;} a.ptag.cash{color:var(--green);border-color:var(--green);}
  .nat-transfer{color:var(--green);border-color:var(--green);} .nat-refund{color:#b8860b;border-color:#b8860b;} .nat-labour{color:var(--odoo);border-color:var(--odoo);} .nat-vendor{color:#b8860b;border-color:#b8860b;} .nat-expense{color:#6c757d;}
  .months td,.months th{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top;} .months th{text-align:left;font-size:12px;color:#495057;} .months .num{text-align:right;font-variant-numeric:tabular-nums;}
  .sug-why{font-size:10.5px;color:var(--auto);font-style:italic;margin-right:4px;}
  .c-type{width:118px;} .c-type select{width:100%;font-size:12px;}
  .locked{color:var(--muted);}
  td select:has(option[value=""]:checked){color:var(--auto);font-style:italic;} td input::placeholder{color:var(--auto);font-style:italic;}
  .noteline{margin-top:1px;} .note-in{border:none;background:transparent;color:#0d6efd;font-size:12px;width:100%;padding:0;font-family:inherit;} .note-in::placeholder{color:transparent;} tr:hover .note-in::placeholder{color:#adb5bd;} .note-in:focus{outline:none;border-bottom:1px solid #0d6efd;}
  .src{display:inline-block;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px;letter-spacing:.02em;}
  .acts{margin-top:2px;font-size:11px;} .acts a{color:var(--muted);text-decoration:none;margin-right:6px;cursor:pointer;} .acts a:hover{color:var(--odoo);}
  .c-paid{width:110px;}
  .form{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center;font-size:13px;}
  .form label{color:var(--muted);font-size:12px;} .form input,.form select,.form textarea{border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-size:13px;font-family:inherit;width:100%;}
  .form .row{display:flex;gap:8px;} .form .row > *{flex:1;}
  .form .full{grid-column:1 / -1;}
  .jlist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12px;}
  .jlist label{display:block;color:var(--text);font-size:12px;padding:1px 0;} .jlist b{display:block;color:var(--muted);font-size:11px;margin-top:5px;text-transform:uppercase;letter-spacing:.04em;}
  .hint{color:var(--muted);font-size:12px;}
  .sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);}
  .bal-note{font-size:11px;color:var(--muted);margin-left:8px;}
  @media (max-width:700px){.top{height:42px;} .bar .search{max-width:none;} .form{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="top">
  <a href="/accounting" title="Accounting">‹</a>
  <a href="/admin" title="Shift Hub">⌂</a>
  <span class="brand">Accounting</span>
  <span style="opacity:.6">›</span>
  <span id="crumb">Accounts</span>
  <span style="opacity:.6;margin-left:10px">|</span>
  <a href="/accounting/transfers" style="opacity:.7">Transfers</a>
  <a href="/accounting/wise" style="opacity:.7">Wise</a>
  <a href="/accounting/budget" style="opacity:.7">Budget</a>
  <span class="sp"></span>
  <span class="who" id="who"></span>
</div>
<div class="bar">
  <select id="acc" onchange="selectAccount(this.value)"></select>
  <button class="btn" onclick="openAccountForm()" title="Create a cash or bank account">＋</button>
  <button class="btn" id="btn-edit" onclick="openAccountForm(account)" title="Account settings: opening balance, Odoo journals, imports">⚙</button>
  <input type="date" id="from" onchange="render()" title="From">
  <input type="date" id="to" onchange="render()" title="To">
  <input class="search" type="search" id="q" placeholder="Search everything…" oninput="render()">
  <span id="rowcount" style="font-size:12px;color:var(--muted);white-space:nowrap;cursor:help"></span>
  <span class="sp" style="flex:1"></span>
  <button class="btn" id="btn-review" onclick="reviewSuggestions()" title="Show only the lines with a partner or company suggestion waiting">⚡ Review suggestions</button>
  <button class="btn" id="btn-check" onclick="toggleReviewImported()" title="WhatsApp messages that match nothing in the Excel or in Odoo: not counted until you accept them" style="display:none">❓ To review</button>
  <button class="btn primary" id="btn-line" onclick="openLineForm()" title="Type a line: money in or out of this account">＋ Line</button>
  <label class="btn primary" for="file" id="btn-upload">⬆ Upload statement (PDF)</label>
  <input type="file" id="file" accept="application/pdf" style="display:none" onchange="upload(this.files[0])">
  <button class="btn" id="btn-import" onclick="importOdooLines()" title="Pull every line of this account's Odoo journals (re-running updates, never duplicates)">⇄ Import Odoo</button>
  <button class="btn" id="btn-contacts" onclick="importContacts()" title="Read phone numbers from your Google Contacts to name the counterparties">👤 Google contacts</button>
  <button class="btn" id="btn-odoo" onclick="checkOdoo()" title="Look for these amounts in the account's Odoo journals">⇄ Check Odoo</button>
  <button class="btn" id="btn-months" onclick="openMonths()" title="One draft bill per month from this person, one line per Excel row, each with its project" style="display:none">📅 Book months</button>
  <button class="btn" id="btn-bills" onclick="openBills()" title="Recurring payments with a standing rule — create their draft bills in Odoo">📗 Odoo bills</button>
</div>
<div class="legend">
  <span id="lg-src" hidden></span>
  <span class="clr on" style="margin-left:0;display:inline" onclick="showSkipped()" title="Lines whose suggestion you waved away">skipped</span>
  <span class="clr" id="clr" onclick="clearFilters()">✕ Clear column filters</span>
</div>
<div class="sheet" id="bills" hidden>
  <div class="sheet-box">
    <div class="sheet-head"><b>Recurring payments → draft bills</b>
      <span class="sp" style="flex:1"></span>
      <button class="btn" onclick="closeBills()">✕ Close</button></div>
    <div class="sheet-body" id="bills-body"></div>
  </div>
</div>
<div class="sheet" id="months" hidden>
  <div class="sheet-box">
    <div class="sheet-head"><b id="months-title">Book the months</b>
      <span class="sp" style="flex:1"></span>
      <button class="btn" onclick="document.getElementById('months').hidden = true">✕ Close</button></div>
    <div class="sheet-body" id="months-body"></div>
  </div>
</div>
<div class="sheet" id="accform" hidden>
  <div class="sheet-box" style="width:min(640px,94vw)">
    <div class="sheet-head"><b id="accform-title">New account</b><span class="sp" style="flex:1"></span><button class="btn" onclick="closeSheet('accform')">✕ Close</button></div>
    <div class="sheet-body"><div class="form" id="accform-body"></div></div>
    <div class="sheet-foot"><span class="hint" id="accform-msg" style="flex:1"></span><button class="btn primary" id="accform-save" onclick="saveAccount()">Save</button></div>
  </div>
</div>
<div class="sheet" id="lineform" hidden>
  <div class="sheet-box" style="width:min(600px,94vw)">
    <div class="sheet-head"><b id="lineform-title">New line</b><span class="sp" style="flex:1"></span><button class="btn" onclick="closeSheet('lineform')">✕ Close</button></div>
    <div class="sheet-body"><div class="form" id="lineform-body"></div></div>
    <div class="sheet-foot"><span class="hint" id="lineform-msg" style="flex:1"></span><button class="btn primary" onclick="saveLine()">Save</button></div>
  </div>
</div>
<div class="sheet" id="trform" hidden>
  <div class="sheet-box" style="width:min(520px,94vw)">
    <div class="sheet-head"><b>Transfer between accounts</b><span class="sp" style="flex:1"></span><button class="btn" onclick="closeSheet('trform')">✕ Close</button></div>
    <div class="sheet-body"><div class="form" id="trform-body"></div></div>
    <div class="sheet-foot"><span class="hint" id="trform-msg" style="flex:1"></span><button class="btn primary" onclick="saveTransfer()">Save transfer</button></div>
  </div>
</div>
<div class="msg" id="msg"></div>
<div class="wrap">
  <table id="grid" style="display:none">
    <thead>
      <tr class="hdr" id="hdr"></tr>
      <tr class="flt" id="flt"></tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot><tr id="totals"></tr></tfoot>
  </table>
  <div class="empty" id="empty"><b>No lines yet</b><span id="empty-hint">Type a line with ＋ Line, import the account's Odoo journals, or upload a statement.</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/admin-shared.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const esc = Admin.esc;
const fmt = n => n ? n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
const ODOO = 'https://shift2.odoo.com/web#model=account.move&view_type=form&id=';
const SAME_CAP = 60;   // one number's repeats may go together; a crowd may not
let accounts = [], acc = null, account = null, tx = [], contacts = {}, partners = [], companies = [], analytic = [], rules = []
let plans = [], journals = [], budgetAccounts = [];
const KNOWN = { '9613700985': 'Maya', '9613299799': 'Walid Hibri', '9613165168': 'Mario Saliba' };   // seeds until contacts are imported
const PEOPLE = ['mario', 'abed', 'georges', 'ziad', 'mitri', 'khodr', 'therese', 'other'];
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const isStatement = () => !!(account && account.statement);          // Whish prints its own balance
const isCash = () => !!(account && account.type === 'cash');

// ── Columns: the first five are the statement as printed (or the Odoo line), then what we add ──
// `only` limits a column to one account type: who physically paid matters for a wallet, not for a bank.
const ALL_COLS = [
  { k: 'date',    l: 'Date / ref',            f: 'text',   v: t => t.date + ' ' + (t.ref || ''), c: 'c-date' },
  { k: 'desc',    l: 'Description',           f: 'text',   v: t => [t.service, t.description, contactName(t).name, t.note].filter(Boolean).join(' '), c: 'c-desc' },
  { k: 'type',    l: 'Type',                  f: 'select', v: t => t.nature || '', c: 'c-type', only: 'ledger' },
  { k: 'out',     l: 'Debit',                 f: 'amount', v: t => t.debit || 0, num: true },
  { k: 'in',      l: 'Credit',                f: 'amount', v: t => t.credit || 0, num: true },
  { k: 'bal',     l: 'Balance',               f: 'amount', v: t => isStatement() ? t.balance : t._bal, num: true },
  { k: 'partner', l: 'Partner / cash',        f: 'text',   v: t => t.partnerName || '', c: 'c-partner' },
  { k: 'company', l: 'Company',               f: 'select', v: t => companyOf(t), c: 'c-company' },
  { k: 'proj',    l: 'Analytic (Odoo)',       f: 'text',   v: t => t.analyticName || '', c: 'c-proj' },
  { k: 'odoo',    l: 'Odoo',                  f: 'odoo',   v: t => !t.odoo ? -1 : (t.odoo.matches || []).length },
];
let COLS = ALL_COLS.filter(c => !c.only);
function buildCols() { COLS = ALL_COLS.filter(c => !c.only || (account && c.only === account.type) || (c.only === 'ledger' && isExcelKept())); }
let sort = { k: 'date', dir: -1 };            // newest first, like an Odoo bank statement
let colF = {};                                // column filters, key → string
let sugFilter = '';                           // '' | 'pending' | 'skipped' — the Review button
let reviewImported = false;                   // the ❓ button: only WhatsApp lines nobody wrote down elsewhere
const TYPES = ['transfer', 'labour', 'expense', 'vendor', 'refund'];
const TYPE_TIP = { transfer: 'Money moved between him and one of our accounts — never a bill, no project', labour: 'His own work — the month\'s labour bill from him', expense: 'Unofficial spending he fronted — the month\'s expenses bill', vendor: 'An official supplier: its own bill, settled by him', refund: 'Money back from a supplier — keeps the supplier and the project' };
// a sheet row still missing its company, its type, or its project (transfers have none) is a question to answer
const asks = t => t.src === 'excel' && !t.excluded && (!companyOf(t) || !t.nature || (t.nature !== 'transfer' && !t.analyticName));
let srcOff = new Set();                       // sources hidden by clicking their chip in the count
const isExcelKept = () => !!(account && account.excel && account.excel.file);
// every source starts shown — clicking its name in the count is what hides it
const resetSources = () => { srcOff = new Set(); };

function say(text, cls) { const m = document.getElementById('msg'); m.textContent = text; m.className = 'msg ' + (cls || 'ok'); if (!text) m.className = 'msg'; }

Admin.require('accounting', async me => {
  document.getElementById('who').textContent = me.name || me.email;
  buildHeader();
  await Promise.all([loadAccounts(), loadContacts()]);
  loadPartners();
  const want = new URLSearchParams(location.search).get('id') || localStorage.getItem('acct_id') || localStorage.getItem('whish_acc');
  if (accounts.length) selectAccount(accounts.some(a => a.id === want) ? want : accounts[0].id);
  else openAccountForm();
});

async function loadAccounts() {
  accounts = (await Admin.api('GET', '/api/accounting/accounts')).filter(a => !a.archived);
  const sel = document.getElementById('acc');
  const label = a => `${a.type === 'cash' ? '💵' : '🏦'} ${a.name} (${a.currency})`;
  sel.innerHTML = accounts.map(a => `<option value="${esc(a.id)}">${esc(label(a))}</option>`).join('')
    || '<option value="">— no account yet —</option>';
}
async function loadContacts() {
  contacts = {};
  for (const c of await Admin.api('GET', '/api/accounting/whish/contacts')) contacts[c.phone] = c;
}
async function loadPartners() {
  try {
    const r = await Admin.api('GET', '/api/accounting/partners');
    partners = r.partners || []; companies = r.companies || [];
    analytic = await Admin.api('GET', '/api/accounting/analytic').catch(() => []);
    plans = await Admin.api('GET', '/api/accounting/analytic/plans').catch(() => []);
    rules = await Admin.api('GET', '/api/accounting/whish/rules').catch(() => []);
    matchMemo.clear();
    if (acc) await adoptOdooFacts();   // now the partner ids can be filled in too
    buildHeader(); render();
  } catch (e) { say('Odoo partners not available: ' + e.message, 'err'); }
}
async function selectAccount(a) {
  acc = a; localStorage.setItem('acct_id', a);
  account = accounts.find(x => x.id === a) || null;
  document.getElementById('acc').value = a;
  buildCols(); colF = {}; buildHeader();
  // which buttons make sense here: a statement account is fed by uploads, the others by typing and Odoo
  const st = isStatement(), hasJ = !!(account && ((account.odooJournals || []).length || (account.odooPartner && account.odooPartner.id)));
  document.getElementById('btn-upload').style.display = st ? '' : 'none';
  document.getElementById('btn-contacts').style.display = st ? '' : 'none';
  document.getElementById('btn-line').style.display = st ? 'none' : '';
  document.getElementById('btn-import').style.display = hasJ ? '' : 'none';
  document.getElementById('btn-months').style.display = isExcelKept() && account.odooPartner && account.odooPartner.id ? '' : 'none';
  document.getElementById('btn-odoo').style.display = (st || hasJ) ? '' : 'none';
  document.getElementById('btn-edit').style.display = st ? 'none' : '';
  document.getElementById('crumb').textContent = account ? account.name : 'Accounts';
  document.getElementById('lg-src').innerHTML = st ? '<i style="background:#fff"></i>Date, service, description, amounts: the Whish statement as printed'
    : isExcelKept() ? '<i style="background:#fff"></i>The Excel ledger <span class="src">excel</span> is the account; Odoo entries are matched onto its rows (✓ in the Odoo column) and never counted on their own. WhatsApp <span class="src">whatsapp</span> adds what the Excel missed once accepted.'
    : '<i style="background:#fff"></i>Lines from Odoo <span class="src">odoo</span>, HomeBudget <span class="src">budget</span>, the Excel ledger <span class="src">excel</span>, the WhatsApp group <span class="src">whatsapp</span>, typed here <span class="src">manual</span> or transfers <span class="src">transfer</span>';
  document.getElementById('empty-hint').textContent = st ? 'Export the statement as PDF from the Whish app (up to 6 months) and upload it here.'
    : hasJ ? 'Press ⇄ Import Odoo to pull the journal lines, or ＋ Line to type one.' : 'Type a line with ＋ Line, or add Odoo journals to this account with ⚙.';
  tx = a ? await Admin.api('GET', `/api/accounting/accounts/${a}/tx`) : [];
  resetSources();
  computeBalances();
  await adoptOdooFacts();
  render();
}
// Non-statement accounts are balanced from the opening row: the balance right before the
// first line of `opening.date` equals `opening.amount`; earlier lines get the implied history.
// Excluded lines (duplicates) are shown but not counted.
function computeBalances() {
  if (!account || isStatement()) return;
  const ord = [...tx].sort(dayOrder);
  const mv = t => t.excluded ? 0 : (t.credit || 0) - (t.debit || 0);
  const op = account.opening;
  let run = op ? op.amount - ord.filter(t => t.date < op.date).reduce((s, t) => s + mv(t), 0) : 0;
  for (const t of ord) { run = Math.round((run + mv(t)) * 100) / 100; t._bal = run; }
}
// same date: the Excel row order (the sheet's own sequence), then the id
const dayOrder = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : ((a.excelRow || 0) - (b.excelRow || 0)) || String(a.id).localeCompare(String(b.id));
const closing = () => { if (!tx.length) return 0; if (isStatement()) { const o = [...tx].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (+a.ref) - (+b.ref)); return o[o.length - 1].balance; } const o = [...tx].sort(dayOrder); return o[o.length - 1]._bal; };
// A line matched to an Odoo payment already knows its partner and its company:
// they are facts from the ledger, not suggestions. Write them onto the line (purple)
// unless you chose something yourself, so nothing asks you what Odoo already said.
async function adoptOdooFacts() {
  const items = [];
  for (const t of tx) {
    const win = t.odoo && (t.odoo.matches || []).find(m => m.chosen); if (!win) continue;
    const it = { id: t.id };
    if (win.partner && t.src !== 'excel' && t.partnerSrc !== 'manual' && (t.partnerName !== win.partner || t.partnerSrc !== 'odoo')) {
      const p = partners.find(x => x.id === win.partnerId) || partners.find(x => x.name === win.partner);
      Object.assign(it, { partnerName: win.partner, partnerId: win.partnerId || (p ? p.id : null), partnerSrc: 'odoo' });
    }
    if (win.company && t.companySrc !== 'manual' && (companyOf(t) !== win.company || t.companySrc !== 'odoo'))
      Object.assign(it, { company: win.company, companySrc: 'odoo', kind: 'work', kindSrc: 'odoo' });
    if (Object.keys(it).length > 1) items.push(it);
  }
  if (!items.length || !acc) return;
  try {
    await Admin.api('POST', `/api/accounting/accounts/${acc}/tx-bulk`, { items });
    for (const it of items) Object.assign(tx.find(x => x.id === it.id), it);
  } catch (e) { say('Could not record the Odoo partners: ' + e.message, 'err'); }
}

// ── Who is behind a line ──
// contact = the phone owner (evidence, from Google contacts / the statement).
// partner = the Odoo partner the payment belongs to (a decision). They usually agree.
function contactName(t) {
  const c = t.phone && contacts[t.phone];
  if (c && c.name) return { name: c.name, src: c.source === 'manual' ? 'manual' : 'auto' };
  if (t.name) return { name: t.name, src: 'whish' };
  if (t.phone && KNOWN[t.phone]) return { name: KNOWN[t.phone], src: 'auto' };
  return { name: '', src: '' };
}
const companyOf = t => t.company || (t.kind === 'personal' ? 'Personal' : '');

// name similarity, same recipe as the server: shared words or bigram overlap
const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const bigrams = s => { const g = new Set(); const t = s.replace(/ /g, ''); for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; };
function similarity(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const wa = a.split(' ').filter(w => w.length > 2), wb = b.split(' ').filter(w => w.length > 2);
  const shared = wa.filter(w => wb.includes(w)).length;
  const words = wa.length && wb.length ? shared / Math.min(wa.length, wb.length) : 0;
  const ga = bigrams(a), gb = bigrams(b);
  let inter = 0; for (const g of ga) if (gb.has(g)) inter++;
  const dice = (ga.size + gb.size) ? (2 * inter) / (ga.size + gb.size) : 0;
  return Math.max(words, dice);
}
const matchMemo = new Map();
function partnerMatch(name) {
  if (!name || !partners.length) return null;
  const key = norm(name); if (!key) return null;
  if (matchMemo.has(key)) return matchMemo.get(key);
  let best = null, bs = 0;
  for (const p of partners) { const s = similarity(key, p.name); if (s > bs) { bs = s; best = p; } }
  const out = bs >= 0.62 ? { id: best.id, name: best.name, score: bs } : null;
  matchMemo.set(key, out);
  return out;
}
// last value used for the same phone number → suggestion for untagged rows
function lastFor(t, field) {
  if (!t.phone) return '';
  for (let i = tx.length - 1; i >= 0; i--) { const o = tx[i]; if (o.phone === t.phone && o[field] && o.id !== t.id) return o[field]; }
  return '';
}
function lastRow(t, field) {
  if (!t.phone) return null;
  for (let i = tx.length - 1; i >= 0; i--) { const o = tx[i]; if (o.phone === t.phone && o[field] && o.id !== t.id) return o; }
  return null;
}
// What is waiting on this row: a partner (in order: used before for this number,
// an Odoo partner matching the contact name, the partner on the matched Odoo payment)
// and a company (used before for this number, else the matched payment's company).
function sugFor(t) {
  const out = { partner: null, company: '', any: false };
  if (!t.partnerName) {
    const prev = lastRow(t, 'partnerName');
    if (prev) out.partner = { id: prev.partnerId || null, name: prev.partnerName, why: 'used before for this number' };
    else {
      const cn = contactName(t).name || (t.phone ? '' : t.description);
      const p = partnerMatch(cn);
      if (p) out.partner = { id: p.id, name: p.name, why: 'matches ' + cn };
      else if (t.odooPartner) { const q = partners.find(x => x.name === t.odooPartner); out.partner = { id: q ? q.id : null, name: t.odooPartner, why: 'partner on the matched Odoo payment' }; }
    }
  }
  if (!companyOf(t)) {
    const prev = lastFor(t, 'company');
    if (prev) out.company = prev;
    else if (t.phone && lastFor(t, 'kind') === 'personal') out.company = 'Personal';
    else { const win = t.odoo && (t.odoo.matches || []).find(m => m.chosen); if (win && win.company) out.company = win.company; }
  }
  out.any = !!(out.partner || out.company);
  return out;
}
function sugState(t) {
  if (!sugFor(t).any) return '';
  return t.suggestSkip ? 'skipped' : 'pending';
}
const srcClass = s => s === 'manual' ? 'src-manual' : (s === 'odoo' || s === 'excel') ? 'src-odoo'
  : (s === 'suggest' || s === 'auto' || s === 'google') ? 'src-auto' : '';

// ── Header + column filters ──
function buildHeader() {
  document.getElementById('hdr').innerHTML = COLS.map(c =>
    `<th class="${c.num ? 'num ' : ''}${c.c || ''}" onclick="setSort('${c.k}')">${c.l}<span class="arr" id="arr-${c.k}"></span></th>`).join('');
  document.getElementById('flt').innerHTML = COLS.map(c => {
    const on = colF[c.k] ? 'on' : '';
    if (c.f === 'text') return `<th><input type="text" class="${on}" value="${esc(colF[c.k] || '')}" placeholder="filter" oninput="setFilter('${c.k}', this.value)"></th>`;
    if (c.f === 'amount') return `<th><input type="text" class="${on}" value="${esc(colF[c.k] || '')}" placeholder="=, >, <, a-b" title="150  ·  >100  ·  <50  ·  100-200" oninput="setFilter('${c.k}', this.value)"></th>`;
    if (c.f === 'odoo') return `<th><select class="${on}" onchange="setFilter('${c.k}', this.value)">
        <option value="">all</option><option value="found" ${colF[c.k] === 'found' ? 'selected' : ''}>found</option>
        <option value="none" ${colF[c.k] === 'none' ? 'selected' : ''}>not found</option><option value="unchecked" ${colF[c.k] === 'unchecked' ? 'selected' : ''}>unchecked</option></select></th>`;
    if (c.f === 'select') {
      const vals = c.k === 'type' ? TYPES : c.k === 'paidby' ? PEOPLE : [...new Set(tx.map(c.v))].filter(Boolean).sort();
      return `<th><select class="${on}" onchange="setFilter('${c.k}', this.value)"><option value="">all</option>${vals.map(v => `<option ${colF[c.k] === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}<option value="__unset" ${colF[c.k] === '__unset' ? 'selected' : ''}>not set</option></select></th>`;
    }
    return '<th></th>';
  }).join('');
}
function setFilter(k, v) {
  if (v) colF[k] = v; else delete colF[k];
  const el = document.getElementById('flt').children[COLS.findIndex(c => c.k === k)].firstElementChild;
  el.classList.toggle('on', !!v);
  render();
}
function clearFilters() { colF = {}; sugFilter = ''; buildHeader(); render(); }
function setSort(k) { sort = sort.k === k ? { k, dir: -sort.dir } : { k, dir: k === 'date' ? -1 : 1 }; render(); }

function amountMatch(v, f) {
  f = f.replace(/,/g, '').trim();
  let m;
  if ((m = f.match(/^([\d.]+)\s*-\s*([\d.]+)$/))) return v >= +m[1] && v <= +m[2];
  if ((m = f.match(/^>=?\s*([\d.]+)$/))) return v >= +m[1];
  if ((m = f.match(/^<=?\s*([\d.]+)$/))) return v <= +m[1];
  if ((m = f.match(/^=?\s*([\d.]+)$/))) return Math.abs(v - +m[1]) < 0.005;
  return String(v).includes(f);
}
function passes(t) {
  if (sugFilter && sugState(t) !== sugFilter && !(sugFilter === 'pending' && ((t.projectFrom && t.analyticName && t.analyticSrc !== 'manual') || asks(t)))) return false;
  for (const c of COLS) {
    const f = colF[c.k]; if (!f) continue;
    const v = c.v(t);
    if (c.f === 'text') { if (!String(v).toLowerCase().includes(f.toLowerCase())) return false; }
    else if (c.f === 'select') { if (f === '__unset' ? !!v : v !== f) return false; }
    else if (c.f === 'odoo') { if (f === 'found' ? v <= 0 : f === 'none' ? v !== 0 : v !== -1) return false; }
    else if (c.f === 'amount') { if (!amountMatch(v, f)) return false; }
  }
  return true;
}
function visible() {
  const from = document.getElementById('from').value, to = document.getElementById('to').value;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = tx.filter(t => {
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    if (reviewImported && !t.review) return false;
    if (srcOff.has(t.src || 'manual')) return false;
    if (q) {
      const hay = [t.date, t.service, t.description, t.phone, contactName(t).name, t.partnerName, companyOf(t), t.note, t.analyticName, t.ref, fmt(t.debit), fmt(t.credit), String(t.debit || t.credit)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return passes(t);
  });
  const col = COLS.find(c => c.k === sort.k) || COLS[0];
  list.sort((a, b) => {
    let x = col.v(a), y = col.v(b);
    if (typeof x === 'string') { x = x.toLowerCase(); y = y.toLowerCase(); }
    const r = x < y ? -1 : x > y ? 1 : 0;
    return r ? r * sort.dir : (isStatement() ? (a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.ref || a.id).localeCompare(String(b.ref || b.id), undefined, { numeric: true })) : dayOrder(a, b)) * (sort.k === 'date' ? sort.dir : -1);
  });
  return list;
}

const matchTip = x => [x.move, x.date, x.company, x.partner || x.label,
  (x.docs || []).length ? '↳ ' + x.docs.join(', ') : '',
  (x.analytics || []).length ? '↳ project ' + x.analytics.map(a => a.name).join(', ') : '',
  (x.why || []).length ? '(' + x.why.join(', ') + ')' : ''].filter(Boolean).join(' · ');
// found / not found, and — once you have chosen a partner — whether Odoo agrees
// Same test as the server's, so the button only shows where Book would work.
const cents = n => Math.round(Number(n || 0) * 100) / 100;
function ruleFor(t) {
  if (t.src === 'odoo' || t.kind === 'transfer') return null;   // already in the books / not a purchase
  return rules.find(r => r.active !== false
    && (!r.accountId || r.accountId === acc)
    && (r.phone || r.contains)
    && (!r.phone || String(t.phone || '') === String(r.phone))
    && (!r.contains || String(t.description || '').toLowerCase().includes(String(r.contains).toLowerCase()))
    && ((r.direction || 'out') === 'out' ? cents(t.debit) > 0 : cents(t.credit) > 0)
    && (r.amount == null || r.amount === '' || cents(r.amount) === ((r.direction || 'out') === 'out' ? cents(t.debit) : cents(t.credit))));
}
function bookButton(t) {
  const bk = t.booked;
  if (bk && bk.paymentState === 'paid') return `<a class="odoo-ok" target="_blank" href="${ODOO}${bk.moveId}" title="${esc('Booked from this page: ' + bk.move + (bk.payment ? ', paid by ' + bk.payment.name : ''))}">✓ ${esc(bk.move)}</a>`;
  const r = ruleFor(t);
  if (!r) return '';
  const what = [r.partnerName, r.companyName, r.accountCode, r.analyticName].filter(Boolean).join(' · ');
  // classify-only: the answers are filled in, but the bill has to come from the document
  if (r.book === false) return `<span class="odoo-no" title="${esc((r.description || 'This rule fills the answers in but does not book.') + ' — ' + what)}">needs the bill</span>`;
  return `<button class="btn book" onclick="bookRow('${t.id}', this)" title="${esc('Create the bill, post it and pay it from ' + (r.paymentJournalName || 'the cash journal') + ':\n' + what)}">${bk ? '📗 Post & pay' : '📗 Book'}</button>`;
}
function odooCell(t) {
  const btn = bookButton(t);
  if (!t.odoo) return btn || '<span class="odoo-no" title="Not checked yet">·</span>';
  const m = t.odoo.matches || [];
  if (!m.length) return btn || '<span class="odoo-no" title="Checked ' + esc(t.odoo.checkedAt.slice(0, 10)) + ': nothing found in the Odoo journals of this account">—</span>';
  const win = m.find(x => x.chosen);
  if (win) {
    const tip = [matchTip(win), m.length > 1 ? 'also possible: ' + m.slice(1).map(x => x.move).join(', ') : ''].filter(Boolean).join('\n');
    const differs = t.src !== 'excel' && t.partnerName && win.partner && (win.partnerId && t.partnerId ? win.partnerId !== t.partnerId : similarity(win.partner, t.partnerName) < 0.6);
    const docs = [...new Set((win.docs || []).filter(d => d && d !== win.move))];
    const oref = (t.bookedMove && t.bookedMove.ref) || win.odooRef || '';
    return `<a class="odoo-ok" target="_blank" href="${ODOO}${win.moveId}" title="${esc(tip)}">✓ ${esc(win.move)}</a>`
      + (oref && oref !== win.move ? `<div class="odoo-doc" title="The reference entered in Odoo">${esc(oref)}</div>` : '')
      + ((t.fileIds || []).length ? `<div class="odoo-doc">${t.fileIds.map(f => `<a target="_blank" href="https://shift2.odoo.com/web/content/${f.id}" title="${esc(f.name)}">📎 ${esc(f.name.length > 42 ? f.name.slice(0, 40) + '…' : f.name)}</a>`).join('<br>')}</div>` : '')
      + (docs.length ? `<div class="odoo-doc" title="${esc('Settles ' + docs.join(', '))}">${docs.map(d => win.docIds && win.docIds[d] ? `<a class="odoo-ok" style="font-weight:normal" target="_blank" href="${ODOO}${win.docIds[d]}">${esc(d)}</a>` : esc(d)).join(', ')}</div>` : '')
      + (differs ? `<div class="odoo-warn" title="${esc('The Odoo payment is booked to ' + win.partner)}">⚠ Odoo says ${esc(win.partner)}</div>` : '');
  }
  const tip = m.map(matchTip).join('\n');
  return `<span class="odoo-multi" title="${esc(tip)}">${m.length} possible — pick one</span>`;
}

function render() {
  const rows = visible();
  document.getElementById('grid').style.display = tx.length ? '' : 'none';
  document.getElementById('empty').style.display = tx.length ? 'none' : '';
  for (const c of COLS) document.getElementById('arr-' + c.k).textContent = sort.k === c.k ? (sort.dir > 0 ? '▲' : '▼') : '';
  document.getElementById('clr').classList.toggle('on', Object.keys(colF).length > 0 || !!sugFilter);

  let pending = 0;
  // Lines sharing a number AND the same suggested answer are one decision repeated, so
  // those may be taken together. A mixed batch never is.
  const sameKey = t => { const g = sugFor(t); return g.any ? [t.phone || '', g.partner ? g.partner.name : '', g.company || ''].join('|') : ''; };
  const groups = {};
  for (const o of tx) { if (sugState(o) !== 'pending' || !o.phone) continue; const k = sameKey(o); if (k) (groups[k] = groups[k] || []).push(o.id); }
  document.getElementById('rows').innerHTML = rows.map(t => {
    const cn = contactName(t), sg = sugFor(t), co = companyOf(t);
    if (sg.any && !t.suggestSkip) pending++;
    const cp = t.phone ? esc(t.phone.replace(/^961/, '0')) : '';
    const sugTxt = [sg.partner && sg.partner.name, sg.company].filter(Boolean).join(' / ');
    const st = isStatement(), own = account && (account.owner || 'mario');

          oninput="anFilter('an-${t.id}')" onkeydown="anKey(event,'an-${t.id}')" onblur="anBlur('an-${t.id}')">

      </td>`}
      <td>${odooCell(t)}</td>
    </tr>`;
  }).join('');
  const counted = rows.filter(t => !t.excluded);
  const allCounted = tx.filter(t => !t.excluded).length;
  const rc = document.getElementById('rowcount');
  // the count, broken down by where the lines came from, and which of them move the balance
  const bySrc = {}, countedBy = {};
  for (const t of tx) { const k = t.src || 'manual'; bySrc[k] = (bySrc[k] || 0) + 1; if (!t.excluded) countedBy[k] = (countedBy[k] || 0) + 1; }
  const ORDER = ['excel', 'odoo', 'whatsapp', 'budget', 'transfer', 'telegram', 'manual'];
  const chips = ORDER.filter(k => bySrc[k]).map(k => {
    const n = bySrc[k], c = countedBy[k] || 0;

    const off = srcOff.has(k);

  const out = counted.reduce((a, t) => a + (t.debit || 0), 0), inn = counted.reduce((a, t) => a + (t.credit || 0), 0);
  const op = account && account.opening;
  document.getElementById('totals').innerHTML =

     <td class="num debit">${fmt(out)}</td><td class="num credit">${fmt(inn)}</td><td class="num" title="${esc(op ? 'Pinned: ' + fmt(op.amount) + ' on ' + op.date + (op.note ? ' — ' + op.note : '') : isStatement() ? 'Closing balance of the statement' : 'No opening balance set: ⚙ to pin one')}">${fmt(closing())}${op ? '' : isStatement() ? '' : '<span class="bal-note">no opening</span>'}</td><td colspan="${COLS.length - 5}"></td>`;

  rv.classList.toggle('primary', sugFilter === 'pending');
  rv.disabled = !waiting && sugFilter !== 'pending';
  const ck = document.getElementById('btn-check'), toCheck = tx.filter(t => t.review).length;
  ck.style.display = toCheck || reviewImported ? '' : 'none';

function toggleReviewImported() { reviewImported = !reviewImported; render(); }
function toggleSrc(k) { if (srcOff.has(k)) srcOff.delete(k); else srcOff.add(k); render(); }

// ── Partner picker: type to filter the Odoo partners, ↑↓, Enter or click ──
const P = {};
function pickFilter(id) {
  const txt = document.getElementById(id + '-txt'), box = document.getElementById(id + '-list');
  if (!txt || !box) return;
  const q = norm(txt.value);
  const list = (q ? partners.filter(p => norm(p.name).includes(q)) : partners.slice(0, 40)).slice(0, 40);
  P[id] = { list, hi: 0 };
  const raw = txt.value.trim(), exact = list.some(p => norm(p.name) === q);
  let html = list.map((p, i) => `<div class="${i === 0 ? 'hi' : ''}" onmousedown="event.preventDefault();pickChoose('${id}',${p.id})"><span>${esc(p.name)}</span><span class="g">${p.vendor && p.customer ? 'vendor · customer' : p.vendor ? 'vendor' : p.customer ? 'customer' : ''}</span></div>`).join('');
  if (raw && !exact) {
    const row = tx.find(x => x.id === (document.getElementById(id) || {}).dataset?.row);
    const co = row && companies.find(c => c.name === companyOf(row));
    html += co
      ? `<div class="new" onmousedown="event.preventDefault();pickCreate('${id}')"><span>＋ Create "${esc(raw)}" in Odoo</span><span class="g">${esc(co.name)} · ${row && +row.credit > 0 ? 'customer' : 'vendor'}</span></div>`
      : `<div class="new off"><span>＋ Create "${esc(raw)}"</span><span class="g">choose the company first</span></div>`;
  }
  if (!html) html = '<div class="none">no Odoo partner matches — type the exact name to check spelling</div>';
  box.innerHTML = html;
  box.className = 'pick-list on' + (list.length || raw ? '' : ' empty');
}
function pickKey(e, id) {
  const box = document.getElementById(id + '-list');
  if (e.key === 'Escape') { if (box.className.includes('on')) e.stopPropagation(); box.className = 'pick-list'; return; }
  if (e.key === 'ArrowDown' && !box.className.includes('on')) { e.preventDefault(); pickFilter(id); return; }
  const st = P[id]; if (!st) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!st.list.length) return;
    e.preventDefault();
    st.hi = Math.min(st.list.length - 1, Math.max(0, st.hi + (e.key === 'ArrowDown' ? 1 : -1)));
    [...box.children].forEach((c, i) => c.className = i === st.hi ? 'hi' : '');
    const hi = box.querySelector('.hi'); if (hi) hi.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); if (!box.className.includes('on')) return; if (st.list.length) pickChoose(id, st.list[st.hi].id); else pickCreate(id); }
}
// ── Analytic picker ────────────────────────────────────────────────────────
// Same widget as the partner cell, so both columns behave alike. The plan is

function planOf(analyticId) {
  const a = analytic.find(x => x.id === +analyticId);
  return a && a.plan ? a.plan : '';
}
function anFilter(id) {
  const txt = document.getElementById(id + '-txt'), box = document.getElementById(id + '-list');
  if (!txt || !box) return;
  const raw = txt.value.trim(), q = norm(raw);
  const list = (q ? analytic.filter(a => norm(a.name).includes(q)) : analytic.slice(0, 40)).slice(0, 40);
  const exact = list.some(a => norm(a.name) === q);
  P[id] = { list, hi: 0 };
  let html = list.length
    ? list.map((a, i) => `<div class="${i === 0 ? 'hi' : ''}" onmousedown="event.preventDefault();anChoose('${id}',${a.id})"><span>${esc(a.name)}</span><span class="g">${esc(a.plan || '')}</span></div>`).join('')
    : '';
  if (raw && !exact) html += `<div class="new" onmousedown="event.preventDefault();anCreate('${id}')"><span>＋ Create "${esc(raw)}" in Odoo</span><span class="g">pick a plan</span></div>`;
  if (!html) html = '<div class="none">no analytic account matches</div>';
  box.innerHTML = html;
  box.className = 'pick-list on' + (list.length || raw ? '' : ' empty');
}
function anKey(e, id) {
  const box = document.getElementById(id + '-list');
  if (e.key === 'Escape') { if (box.className.includes('on')) e.stopPropagation(); box.className = 'pick-list'; return; }
  if (e.key === 'ArrowDown' && !box.className.includes('on')) { e.preventDefault(); anFilter(id); return; }
  const st = P[id]; if (!st) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!st.list.length) return;
    e.preventDefault();
    st.hi = Math.min(st.list.length - 1, Math.max(0, st.hi + (e.key === 'ArrowDown' ? 1 : -1)));
    [...box.children].forEach((c, i) => c.className = i === st.hi ? 'hi' : (c.className.includes('new') ? 'new' : ''));
    const hi = box.querySelector('.hi'); if (hi) hi.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!box.className.includes('on')) return;

}
function anChoose(id, analyticId) {
  const a = analytic.find(x => x.id === analyticId); if (!a) return;
  const hidden = document.getElementById(id), txt = document.getElementById(id + '-txt');
  hidden.value = a.id; txt.value = a.name; P[id] = null;
  document.getElementById(id + '-list').className = 'pick-list';
  const pl = document.getElementById(id + '-plan'); if (pl) pl.textContent = a.plan || '';
  saveAnalytic(hidden.dataset.row, a, txt);
}
function anBlur(id) {
  setTimeout(() => {
    const txt = document.getElementById(id + '-txt'), hidden = document.getElementById(id); if (!txt || !hidden) return;
    document.getElementById(id + '-list').className = 'pick-list';
    const row = tx.find(x => x.id === hidden.dataset.row); if (!row) return;
    if (!txt.value.trim()) { if (row.analyticName) saveAnalytic(row.id, null, txt); return; }
    const exact = analytic.find(a => norm(a.name) === norm(txt.value));
    if (exact) { if (exact.id !== row.analyticId) anChoose(id, exact.id); return; }
    txt.value = row.analyticName || '';   // no such account: snap back
  }, 160);
}

function pickChoose(id, partnerId) {
  const p = partners.find(x => x.id === partnerId); if (!p) return;
  const hidden = document.getElementById(id), txt = document.getElementById(id + '-txt');
  hidden.value = p.id; txt.value = p.name; P[id] = null;
  document.getElementById(id + '-list').className = 'pick-list';

}
function pickBlur(id) {
  setTimeout(() => {
    const txt = document.getElementById(id + '-txt'), hidden = document.getElementById(id); if (!txt || !hidden) return;
    document.getElementById(id + '-list').className = 'pick-list';
    const row = tx.find(x => x.id === hidden.dataset.row); if (!row) return;
    if (!txt.value.trim()) { if (row.partnerName) savePartner(row.id, null, '', txt); return; }
    const exact = partners.find(p => norm(p.name) === norm(txt.value));
    if (exact) { if (exact.id !== row.partnerId) { hidden.value = exact.id; txt.value = exact.name; savePartner(row.id, exact, 'manual', txt); } return; }
    txt.value = row.partnerName || '';   // no such partner: snap back
  }, 160);
}

// ── Saving ──
function flash(el, ok) { el.classList.remove('dirty'); el.classList.toggle('saved', ok); el.classList.toggle('dirty', !ok); setTimeout(() => el.classList.remove('saved'), 1200); }
function mark(el, src) { const td = el.closest('td'); td.classList.remove('src-auto', 'src-manual', 'src-odoo'); if (src) td.classList.add(srcClass(src)); }
async function patch(id, data) { return Admin.api('PATCH', `/api/accounting/accounts/${acc}/tx/${id}`, data); }
async function saveField(id, field, value, el) {
  el.classList.add('dirty');
  const t = tx.find(x => x.id === id); if (t) { t[field] = value; t[field + 'Src'] = value ? 'manual' : ''; }
  mark(el, value ? 'manual' : '');
  try { await patch(id, { [field]: value, [field + 'Src']: value ? 'manual' : '' }); flash(el, true); }
  catch (e) { flash(el, false); say('Could not save: ' + e.message, 'err'); }
}
// An analytic account has to be one Odoo really has, or the booking later cannot use it.
// Anything else snaps back to what was there before.
// the type of a row decides what booking does with it; a transfer drops its project and sits in S LB
async function saveType(id, v, el) {
  const t = tx.find(x => x.id === id); if (!t) return;
  const data = { nature: v, natureSrc: 'manual', partnerKind: v === 'transfer' ? 'cash' : 'partner', retype: !!t.bookedMove };
  if (v === 'transfer') Object.assign(data, { analyticId: null, analyticName: '', analyticSrc: '', analyticFrom: '', projectFrom: '', company: 'S LB', companySrc: 'excel' });
  try { await patch(id, data); Object.assign(t, data); render(); say(`Type: ${v}${data.retype ? ' — press Rewrite on its month in Book months' : ''}`); }
  catch (e) { flash(el, false); say('Could not save: ' + e.message, 'err'); }
}
// an inherited analytic: keep it as a choice, or clear it so a person picks one
async function confirmAnalytic(id, keep) {
  const t = tx.find(x => x.id === id); if (!t) return;
  const data = keep ? { analyticSrc: 'manual', projectFrom: '' } : { analyticId: null, analyticName: '', analyticSrc: '', analyticFrom: '', projectFrom: '' };
  try { await patch(id, data); Object.assign(t, data); render(); say(keep ? 'Analytic kept' : 'Analytic cleared — pick one on the row'); }
  catch (e) { say('Could not save: ' + e.message, 'err'); }
}
async function saveAnalytic(id, a, el) {

// ── Upload ──
// The PDF is read here in the browser with pdf.js and only its text goes to
// the server (a 25-page statement is 5 MB as PDF, ~60 KB as text — the host
// rejects bodies over ~4.5 MB). Lines are rebuilt the way pdf-parse does it
// server-side: items on the same baseline are glued, a new baseline = new line.
async function pdfText(buf) {
  if (!window.pdfjsLib) throw new Error('pdf.js did not load');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    let lastY = null;
    for (const it of tc.items) {
      if (!('str' in it)) continue;
      const y = Math.round(it.transform[5] * 10);
      if (lastY !== null && y !== lastY) out += '\n';
      out += it.str;
      lastY = y;
    }
    out += '\n\n';
  }
  return out;
}
function upload(file) {
  if (!file) return;
  say('Reading ' + file.name + '…');
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      let payload;
      try { payload = { filename: file.name, text: await pdfText(rd.result) }; }
      catch (e) {
        console.warn('pdf.js extraction failed, sending the file instead:', e);
        if (file.size > 4 * 1024 * 1024) throw new Error('could not read the PDF in the browser and it is too large to send (' + (file.size / 1048576).toFixed(1) + ' MB)');
        payload = { filename: file.name, pdfBase64: btoa(String.fromCharCode(...new Uint8Array(rd.result))) };
      }
      const r = await Admin.api('POST', '/api/accounting/whish/upload', payload);
      say(`${file.name}: ${r.head.from} → ${r.head.till}, ${r.lines} lines (${r.added} new, ${r.updated} already known)` + (r.warnings.length ? ' · ' + r.warnings.length + ' warning(s), see console' : ''));
      if (r.warnings.length) console.warn(r.warnings);
      await loadAccounts();
      await selectAccount(r.account);
    } catch (e) { say('Upload failed: ' + e.message, 'err'); }
    document.getElementById('file').value = '';
  };
  rd.readAsArrayBuffer(file);
}

// ── Google contacts → phone/name map ──
// Asks Google for the contacts scope in a popup (a fresh token each time),
// reads the People API directly from the browser and stores only phone+name.
async function importContacts() {
  const digits = s => String(s || '').replace(/\D/g, '');
  say('Opening Google…');
  let token;
  try {
    const r = await Admin.signIn(['https://www.googleapis.com/auth/contacts.readonly', 'https://www.googleapis.com/auth/contacts.other.readonly']);
    token = r.accessToken;
  } catch (e) { say('Google sign-in cancelled: ' + e.message, 'err'); return; }
  if (!token) { say('Google did not return an access token', 'err'); return; }
  const items = [];
  // connections takes personFields, otherContacts takes readMask — same fields, different name
  const pull = async (base, key, fieldsParam) => {
    let pageToken = '';
    do {
      const u = `${base}?pageSize=1000&${fieldsParam}=names,phoneNumbers${pageToken ? '&pageToken=' + pageToken : ''}`;
      const r = await fetch(u, { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error(`People API ${r.status}: ${(await r.text()).slice(0, 200)}`);
      const j = await r.json();
      for (const p of (j[key] || [])) {
        const name = p.names && p.names[0] && p.names[0].displayName;
        for (const ph of (p.phoneNumbers || [])) { const d = digits(ph.canonicalForm || ph.value); if (name && d) items.push({ phone: d, name, source: 'google' }); }
      }
      pageToken = j.nextPageToken || '';
    } while (pageToken);
  };
  try {
    say('Reading Google contacts…');
    await pull('https://people.googleapis.com/v1/people/me/connections', 'connections', 'personFields');
    await pull('https://people.googleapis.com/v1/otherContacts', 'otherContacts', 'readMask').catch(e => console.warn('otherContacts skipped:', e.message));
    const r = await Admin.api('POST', '/api/accounting/whish/contacts', { items });
    await loadContacts(); render();
    say(`Google contacts: ${items.length} numbers read, ${r.saved} saved (${r.skipped} kept your manual names)`);
  } catch (e) { say('Contacts import failed: ' + e.message, 'err'); }
}

    <table class="months" style="width:100%;border-collapse:collapse"><thead><tr><th>Month</th><th>Labour bill — his days</th><th></th><th>Expenses bill — benzine, misc</th><th></th></tr></thead><tbody>${mrows || '<tr><td colspan="5" class="hint">No labour or expense rows to book.</td></tr>'}</tbody></table>
    <h4 style="margin:16px 0 4px">Projects → analytic accounts ${unmapped.length ? `<span class="odoo-warn">${unmapped.length} still to map</span>` : '<span class="hint">all mapped</span>'}</h4>
    <p class="hint">The sheet's project names, matched to Odoo's analytic accounts. Fix any of them here; the choice holds for every import and every bill after.</p>

// Book one line: create the bill if needed, post it, pay it from the cash journal, then
// let the matcher see the new payment so the Odoo cell turns green.
async function bookLine(id) {
  const r = await Admin.api('POST', `/api/accounting/accounts/${acc}/book`, { ids: [id], post: true });

  const out = t.debit > 0;
  const body = { date: t.date, amount: t.debit || t.credit, currency: account.currency, note: document.getElementById('tf-note').value.trim(),
    fromId: out ? acc : other, toId: out ? other : acc, fromTxId: out ? t.id : '', toTxId: out ? '' : t.id };
  try {
    const r = await Admin.api('POST', '/api/accounting/transfers', body);
    closeSheet('trform');
    tx = await Admin.api('GET', `/api/accounting/accounts/${acc}/tx`); computeBalances(); render();
    say(`Transfer saved: ${fmt(r.amount)} ${esc(r.fromName)} → ${esc(r.toName)}`);
  } catch (e) { document.getElementById('trform-msg').textContent = 'Could not save: ' + e.message; }
}
</script>
