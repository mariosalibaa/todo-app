<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <style>
    :root {
      --base:     #1e1e2e;
      --mantle:   #181825;
      --crust:    #11111b;
      --surface0: #313244;
      --surface1: #45475a;
      --surface2: #585b70;
      --overlay0: #6c7086;
      --overlay1: #7f849c;
      --text:     #cdd6f4;
      --subtext0: #a6adc8;
      --subtext1: #bac2de;
      --blue:     #89b4fa;
      --accent:   #1e66f5;
      --red:      #f38ba8;
      --yellow:   #f9e2af;
      --green:    #a6e3a1;
      --peach:    #fab387;
      --mauve:    #cba6f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      background: var(--base); color: var(--text); overflow: hidden;
    }

    /* ── App shell ── */
    .app { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--mantle);
      border-right: 1px solid var(--surface0);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 16px; font-size: 1rem; font-weight: 700;
      border-bottom: 1px solid var(--surface0);
      color: var(--text); letter-spacing: 0.01em;
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-header .logo { color: var(--accent); font-size: 1.1rem; }
    .projects-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .project-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; cursor: pointer;
      font-size: 0.84rem; color: var(--subtext1);
      transition: background 0.1s;
    }
    .project-item:hover { background: var(--surface0); color: var(--text); }
    .project-item.active { background: var(--surface0); color: var(--text); font-weight: 600; }
    .proj-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--surface2); flex-shrink: 0; transition: background 0.15s;
    }
    .project-item.active .proj-dot { background: var(--accent); }
    /* Project status */
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      cursor: pointer; border: 1.5px solid transparent;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .status-dot:hover { transform: scale(1.35); box-shadow: 0 0 0 2px rgba(255,255,255,0.12); }
    .status-lead    { background: #f9e2af; border-color: #f9e2af; }
    .status-active  { background: #a6e3a1; border-color: #a6e3a1; }
    .status-on-hold { background: #fab387; border-color: #fab387; }
    .status-done-p  { background: #585b70; border-color: #585b70; }
    .status-none    { background: transparent; border-color: var(--surface2); }

    .status-badge {
      font-size: 0.62rem; font-weight: 700; padding: 1px 6px;
      border-radius: 8px; letter-spacing: 0.04em; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }
    .sbadge-lead    { background: rgba(249,226,175,0.18); color: #f9e2af; }
    .sbadge-active  { background: rgba(166,227,161,0.18); color: #a6e3a1; }
    .sbadge-on-hold { background: rgba(250,179,135,0.18); color: #fab387; }
    .sbadge-done-p  { background: rgba(88,91,112,0.25);  color: #7f849c; }

    .status-filter-row { display: flex; gap: 5px; align-items: center; }
    .sf-btn {
      font-size: 0.72rem; font-weight: 600; padding: 3px 9px;
      border-radius: 10px; border: 1.5px solid var(--surface1);
      background: none; cursor: pointer; color: var(--subtext0); transition: all 0.12s;
    }
    .sf-btn:hover { border-color: var(--surface2); color: var(--text); }
    .sf-btn.sf-active-lead    { background: rgba(249,226,175,0.18); color: #f9e2af; border-color: #f9e2af; }
    .sf-btn.sf-active-active  { background: rgba(166,227,161,0.18); color: #a6e3a1; border-color: #a6e3a1; }
    .sf-btn.sf-active-on-hold { background: rgba(250,179,135,0.18); color: #fab387; border-color: #fab387; }
    .sf-btn.sf-active-done-p  { background: rgba(88,91,112,0.25);  color: #7f849c; border-color: #585b70; }

    .proj-drag-handle {
      font-size: 0.75rem; color: var(--surface2); cursor: grab;
      flex-shrink: 0; line-height: 1; opacity: 0;
      transition: opacity 0.1s;
    }
    .project-item:hover .proj-drag-handle { opacity: 1; }
    .project-item.drag-over-proj { background: var(--surface0); border-left: 2px solid var(--accent); }
    .project-item.is-dragging-proj { opacity: 0.4; }
    .proj-edit-btn {
      background: none; border: none; color: var(--overlay0); cursor: pointer;
      font-size: 0.75rem; padding: 0 2px; opacity: 0; transition: opacity 0.1s;
      flex-shrink: 0; line-height: 1;
    }
    .project-item:hover .proj-edit-btn { opacity: 1; }
    .proj-edit-btn:hover { color: var(--text); }
    .settings-tab {
      flex: 1; background: none; border: none; color: var(--subtext0);
      padding: 10px 14px; cursor: pointer; font-size: 0.82rem; font-weight: 500;
      border-bottom: 2px solid transparent; transition: color 0.1s, border-color 0.1s;
    }
    .settings-tab:hover { color: var(--text); }
    .settings-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .settings-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; border-bottom: 1px solid var(--surface0);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-name { flex: 1; font-size: 0.85rem; }
    .settings-rename-input {
      flex: 1; background: var(--surface0); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text); font-size: 0.85rem; padding: 2px 7px; outline: none;
    }
    .settings-act-btn {
      background: none; border: none; cursor: pointer; font-size: 0.78rem;
      color: var(--overlay0); padding: 2px 5px; border-radius: 4px;
      transition: color 0.1s, background 0.1s;
    }
    .settings-act-btn:hover { color: var(--text); background: var(--surface1); }
    .settings-act-btn.del:hover { color: var(--red); background: transparent; }

    .sidebar-group-header {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em;
      color: var(--overlay0); text-transform: uppercase;
      padding: 10px 14px 3px; margin-top: 2px;
    }
    .sidebar-company-header {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
      color: var(--subtext1); padding: 10px 14px 2px;
      border-top: 1px solid var(--surface0); margin-top: 4px;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .sidebar-company-header:first-child { border-top: none; margin-top: 0; }
    .sidebar-company-header.active { color: var(--accent); }
    .dept-badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      padding: 1px 6px; border-radius: 8px; flex-shrink: 0;
    }
    .dept-filter-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .dept-filter-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 12px;
      background: var(--surface0); border: 1px solid var(--surface1);
      font-size: 0.72rem; color: var(--subtext1); cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    .dept-filter-chip.active { color: #111; border-color: transparent; font-weight: 600; }
    .company-filter-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .company-filter-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 12px;
      background: var(--surface0); border: 1px solid var(--surface1);
      font-size: 0.72rem; color: var(--subtext1); cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    .company-filter-chip.active { background: var(--blue); color: #111; border-color: var(--blue); font-weight: 600; }
    .proj-label { flex: 1; }
    .proj-count {
      font-size: 0.7rem; color: var(--overlay1);
      background: var(--surface1); border-radius: 10px;
      padding: 1px 7px; min-width: 22px; text-align: center;
    }
    .sidebar-footer { padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .add-project-btn {
      width: 100%; background: none;
      border: 1px dashed var(--surface1); color: var(--overlay0);
      border-radius: 6px; padding: 7px 12px; cursor: pointer;
      font-size: 0.8rem; text-align: left; transition: all 0.15s;
    }
    .add-project-btn:hover { border-color: var(--surface2); color: var(--subtext1); }

    /* Views section */
    .sidebar-section-label {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--overlay0); padding: 10px 14px 4px;
    }
    .view-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; cursor: pointer;
      font-size: 0.82rem; color: var(--subtext1); transition: background 0.1s;
      position: relative;
    }
    .view-item:hover { background: var(--surface0); color: var(--text); }
    .view-item.active { background: var(--surface0); color: var(--text); font-weight: 600; }
    .view-item-icon { font-size: 0.8rem; flex-shrink: 0; opacity: 0.7; }
    .view-item-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .view-item-rename-input {
      flex: 1; background: var(--surface0); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text); font-size: 0.82rem;
      padding: 1px 5px; outline: none;
    }
    .view-actions {
      display: flex; gap: 2px; opacity: 0; transition: opacity 0.1s; flex-shrink: 0;
    }
    .view-item:hover .view-actions { opacity: 1; }
    .view-act-btn {
      background: none; border: none; color: var(--overlay0);
      cursor: pointer; font-size: 0.75rem; padding: 1px 3px; line-height: 1;
      border-radius: 3px; transition: color 0.1s, background 0.1s;
    }
    .view-act-btn:hover { color: var(--text); background: var(--surface1); }
    .view-act-btn.del:hover { color: var(--red); background: transparent; }
    .sidebar-divider { height: 1px; background: var(--surface0); margin: 4px 0; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Toolbar ── */
    .toolbar {
      background: var(--base); border-bottom: 1px solid var(--surface0);
      padding: 10px 16px; display: flex; align-items: center;
      gap: 9px; flex-shrink: 0; flex-wrap: wrap;
    }
    .toolbar-title { font-size: 1rem; font-weight: 600; min-width: 90px; }
    .task-count { font-size: 0.75rem; color: var(--overlay0); }
    .search-input {
      background: var(--surface0); border: 1px solid var(--surface1);
      color: var(--text); border-radius: 6px; padding: 5px 10px;
      font-size: 0.81rem; width: 155px;
    }
    .search-input::placeholder { color: var(--overlay0); }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .search-input.filter-active { border-color: var(--accent); background: rgba(30,102,245,0.12); color: var(--text); }
    .filter-select {
      background: transparent; border: 1px solid var(--surface1);
      color: var(--overlay0); border-radius: 6px; padding: 5px 8px;
      font-size: 0.81rem; cursor: pointer; transition: all 0.15s;
    }
    .filter-select:focus { outline: none; }
    .filter-select:hover { border-color: var(--surface2); color: var(--subtext1); }
    .filter-select.filter-active {
      background: var(--accent); color: #fff;
      border-color: var(--accent); font-weight: 600;
    }
    .filter-group {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface0); border: 1px solid var(--surface1);
      border-radius: 8px; padding: 4px 8px;
    }
    .filter-group-label {
      font-size: 0.72rem; font-weight: 600; color: var(--overlay0);
      letter-spacing: 0.05em; white-space: nowrap; padding-right: 4px;
      border-right: 1px solid var(--surface1); margin-right: 2px;
    }
    .filter-group .filter-select {
      border: none; background: transparent; padding: 4px 6px;
    }
    .filter-group .filter-select:hover { background: var(--surface1); border-radius: 5px; }
    .filter-group .filter-select.filter-active {
      background: var(--accent); color: #fff; border-radius: 5px;
    }
    .active-filters-bar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 5px 16px 4px; background: var(--mantle);
      border-bottom: 1px solid var(--surface0);
    }
    .active-filters-bar-label {
      font-size: 0.72rem; color: var(--overlay0); font-weight: 600;
      letter-spacing: 0.05em; margin-right: 2px;
    }
    .filter-chip-active {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(30,102,245,0.18); color: var(--accent);
      border: 1px solid rgba(30,102,245,0.35);
      border-radius: 20px; padding: 2px 8px 2px 10px;
      font-size: 0.76rem; font-weight: 600; cursor: default;
    }
    .filter-chip-active .chip-x {
      cursor: pointer; font-size: 0.8rem; opacity: 0.7;
      margin-left: 2px; line-height: 1;
    }
    .filter-chip-active .chip-x:hover { opacity: 1; }
    .filter-chip-clear {
      font-size: 0.72rem; color: var(--overlay0); cursor: pointer;
      margin-left: 4px; text-decoration: underline;
    }
    .filter-chip-clear:hover { color: var(--text); }
    .tb-btn {
      background: transparent; border: 1px solid var(--surface1);
      color: var(--overlay0); border-radius: 6px; padding: 5px 12px;
      cursor: pointer; font-size: 0.8rem; white-space: nowrap; transition: all 0.15s;
    }
    .tb-btn:hover { background: var(--surface0); color: var(--subtext1); border-color: var(--surface2); }
    .tb-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .add-btn {
      background: var(--accent); border: none; color: #fff;
      border-radius: 6px; padding: 6px 18px; cursor: pointer;
      font-size: 0.82rem; font-weight: 600; margin-left: auto;
      white-space: nowrap; transition: background 0.1s;
    }
    .add-btn:hover { background: #2577ff; }

    /* ── Task list ── */
    .task-list { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 7px; }
    .empty-state { margin: 50px auto; text-align: center; color: var(--overlay0); font-size: 0.9rem; }
    .empty-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .empty-hint { font-size: 0.78rem; margin-top: 5px; color: var(--surface2); }
    .group-header {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--overlay0);
      padding: 8px 2px 4px; margin-top: 4px;
      border-bottom: 1px solid var(--surface0);
    }
    .group-header:first-child { margin-top: 0; }

    /* ── Task card ── */
    .task-card {
      background: var(--surface0); border: 1px solid var(--surface1);
      border-radius: 8px; padding: 10px 13px;
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; transition: border-color 0.12s, background 0.12s;
    }
    .task-card:hover { border-color: var(--surface2); background: #36374a; }
    .task-card.done { opacity: 0.5; }
    .task-card.overdue .task-due { color: var(--red); }

    .task-checkbox {
      margin-top: 3px; flex-shrink: 0;
      width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
    }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 0.875rem; font-weight: 500; color: var(--text); line-height: 1.4; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--overlay1); }
    .task-notes {
      font-size: 0.77rem; color: var(--subtext0); margin-top: 3px; line-height: 1.4;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .subtask-progress {
      display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 0.72rem; color: var(--overlay0);
    }
    .sub-bar { height: 3px; background: var(--surface1); border-radius: 2px; width: 55px; overflow: hidden; }
    .sub-bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.2s; }

    .task-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .badge {
      font-size: 0.63rem; font-weight: 700; padding: 2px 7px;
      border-radius: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .badge-high   { background: rgba(243,139,168,0.18); color: var(--red); }
    .badge-medium { background: rgba(250,179,135,0.18); color: var(--peach); }
    .badge-low    { background: rgba(166,227,161,0.18); color: var(--green); }
    .task-due { font-size: 0.71rem; color: var(--overlay1); }
    .task-proj-tag {
      font-size: 0.68rem; color: var(--blue);
      background: rgba(137,180,250,0.12); border-radius: 4px; padding: 1px 6px;
    }

    /* ── Modal overlay ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--mantle); border: 1px solid var(--surface1);
      border-radius: 12px; width: 520px; max-width: 96vw; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--surface0);
    }
    .modal-title { font-size: 0.95rem; font-weight: 600; }
    .modal-close {
      background: rgba(255,255,255,0.07); border: none; color: var(--text);
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: rgba(255,255,255,0.15); }

    .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label {
      font-size: 0.72rem; font-weight: 700; color: var(--subtext0);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .form-input, .form-textarea, .form-select {
      background: var(--surface0); border: 1px solid var(--surface1);
      color: var(--text); border-radius: 6px; padding: 8px 12px;
      font-size: 0.875rem; font-family: inherit; transition: border-color 0.15s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--accent); }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--overlay0); }
    .form-textarea { resize: vertical; min-height: 76px; }
    .form-select { cursor: pointer; }
    input[type=date] { color-scheme: dark; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Priority picker */
    .priority-row { display: flex; gap: 7px; }
    .prio-opt {
      flex: 1; padding: 7px 8px; border-radius: 6px;
      border: 2px solid var(--surface1); cursor: pointer;
      text-align: center; font-size: 0.77rem; font-weight: 600;
      transition: all 0.15s; color: var(--subtext0); user-select: none;
    }
    .prio-opt:hover { border-color: var(--surface2); color: var(--text); }
    .prio-opt.sel-high   { border-color: var(--red);   background: rgba(243,139,168,0.14); color: var(--red); }
    .prio-opt.sel-medium { border-color: var(--peach); background: rgba(250,179,135,0.14); color: var(--peach); }
    .prio-opt.sel-low    { border-color: var(--green); background: rgba(166,227,161,0.14); color: var(--green); }

    /* Subtasks */
    .subtask-list { display: flex; flex-direction: column; gap: 5px; }
    .subtask-item {
      display: flex; align-items: center; gap: 7px;
      background: var(--surface0); border-radius: 5px; padding: 6px 10px;
    }
    .sub-check { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .sub-text-input {
      flex: 1; background: none; border: none; color: var(--text);
      font-family: inherit; font-size: 0.85rem; outline: none;
    }
    .subtask-item.done-sub .sub-text-input { text-decoration: line-through; color: var(--overlay1); }
    .sub-del {
      background: none; border: none; color: var(--overlay0);
      cursor: pointer; font-size: 1.05rem; padding: 0 2px; line-height: 1;
    }
    .sub-del:hover { color: var(--red); }
    .add-sub-row { display: flex; gap: 6px; margin-top: 4px; }
    .add-sub-input {
      flex: 1; background: var(--surface0);
      border: 1px dashed var(--surface1); color: var(--text);
      border-radius: 5px; padding: 6px 10px;
      font-size: 0.84rem; font-family: inherit;
    }
    .add-sub-input::placeholder { color: var(--overlay0); }
    .add-sub-input:focus { outline: none; border-color: var(--accent); border-style: solid; }
    .add-sub-btn {
      background: var(--surface1); border: none; color: var(--text);
      border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 0.81rem;
    }
    .add-sub-btn:hover { background: var(--surface2); }

    /* Modal footer */
    .modal-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-top: 1px solid var(--surface0); gap: 10px;
    }
    .delete-btn {
      background: rgba(243,139,168,0.1); border: 1px solid rgba(243,139,168,0.3);
      color: var(--red); border-radius: 6px; padding: 7px 14px;
      cursor: pointer; font-size: 0.81rem; transition: all 0.15s;
    }
    .delete-btn:hover { background: rgba(243,139,168,0.22); }
    .footer-right { display: flex; gap: 8px; }
    .cancel-btn {
      background: var(--surface1); border: none; color: var(--text);
      border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 0.81rem;
    }
    .cancel-btn:hover { background: var(--surface2); }
    .save-btn {
      background: var(--accent); border: none; color: #fff;
      border-radius: 6px; padding: 7px 22px; cursor: pointer;
      font-size: 0.82rem; font-weight: 600;
    }
    .save-btn:hover { background: #2577ff; }

    /* View toggle */
    .view-toggle { display: flex; border: 1px solid var(--surface1); border-radius: 6px; overflow: hidden; }
    .view-btn {
      background: var(--surface0); border: none; color: var(--overlay0);
      padding: 5px 12px; cursor: pointer; font-size: 0.8rem; white-space: nowrap;
      transition: all 0.15s;
    }
    .view-btn + .view-btn { border-left: 1px solid var(--surface1); }
    .view-btn:hover { background: var(--surface1); color: var(--text); }
    .view-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

    /* Kanban board */
    .kanban-board {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 14px 16px;
      display: flex; flex-wrap: wrap;
      gap: 14px;
      align-content: start;
    }
    .kanban-col { flex-shrink: 0; }

    /* ── Projects board ── */
    .projects-board {
      flex: 1; display: flex; gap: 14px;
      padding: 14px 16px; overflow-x: auto; overflow-y: hidden;
    }
    .pb-col {
      flex: 0 0 220px; display: flex; flex-direction: column;
      background: var(--mantle); border-radius: 10px;
      border: 2px solid var(--surface0); overflow: hidden;
    }
    .pb-col.drag-over-pb { border-color: var(--accent); background: var(--surface0); }
    .pb-col-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--surface0);
    }
    .pb-col-count {
      margin-left: auto; font-size: 0.7rem; font-weight: 400;
      color: var(--overlay0); background: var(--surface0);
      border-radius: 8px; padding: 1px 7px;
    }
    .pb-col-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .pb-proj-card {
      background: var(--surface0); border-radius: 8px; padding: 10px 12px;
      cursor: pointer; border: 1.5px solid transparent;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .pb-proj-card:hover { border-color: var(--accent); background: var(--surface1); }
    .pb-proj-card.is-dragging-pb { opacity: 0.4; }
    .pb-proj-name {
      font-size: 0.85rem; font-weight: 600; color: var(--text);
      margin-bottom: 8px; word-break: break-word;
    }
    .pb-stats { display: flex; flex-wrap: wrap; gap: 6px; }
    .pb-stat {
      font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 500;
    }
    .pb-stat.open   { background: rgba(137,180,250,0.15); color: var(--blue); }
    .pb-stat.done   { background: rgba(166,227,161,0.15); color: var(--green); }
    .pb-stat.overdue { background: rgba(243,139,168,0.15); color: var(--red); }
    .projects-list-table {
      width: 100%; border-collapse: collapse; border: 1px solid var(--surface0);
      border-radius: 8px; overflow: hidden; background: var(--base);
    }
    .projects-list-table th {
      background: var(--surface0); color: var(--text); font-weight: 600;
      padding: 10px 12px; text-align: left; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .projects-list-table td {
      padding: 10px 12px; border-top: 1px solid var(--surface0);
      font-size: 0.81rem; color: var(--text);
    }
    .projects-list-table tr:hover { background: var(--surface0); }
    .plist-name {
      font-weight: 600; cursor: pointer; color: var(--accent);
    }
    .plist-name:hover { text-decoration: underline; }
    .plist-actions {
      display: flex; gap: 6px; justify-content: flex-end;
    }
    .plist-btn {
      background: transparent; border: 1px solid var(--surface1);
      color: var(--overlay0); border-radius: 4px; padding: 4px 8px;
      cursor: pointer; font-size: 0.7rem; transition: all 0.1s;
    }
    .plist-btn:hover { border-color: var(--accent); color: var(--accent); }
    .plist-name-cell, .plist-company-cell, .plist-status-cell { cursor: pointer; transition: background 0.1s; }
    .plist-name-cell:hover, .plist-company-cell:hover, .plist-status-cell:hover { background: var(--surface0); }
    .plist-edit-input {
      background: var(--surface1); border: 1px solid var(--accent); border-radius: 4px;
      color: var(--text); padding: 4px 6px; font-size: 0.81rem; outline: none;
    }
    .plist-edit-select {
      background: var(--surface1); border: 1px solid var(--accent); border-radius: 4px;
      color: var(--text); padding: 4px 6px; font-size: 0.81rem; cursor: pointer;
    }
    .kanban-col {
      background: var(--mantle); border: 2px solid var(--surface0);
      border-radius: 10px; display: flex; flex-direction: column;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .kanban-col.is-dragging { opacity: 0.45; }
    .kanban-col.drag-over   { border-color: var(--accent); border-style: dashed; }
    .kanban-col.task-drag-over { border-color: var(--green); background: rgba(166,227,161,0.06); }
    .kanban-card.is-dragging-task { opacity: 0.4; }
    .kanban-col-header {
      padding: 11px 14px 10px; cursor: grab;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--surface0); flex-shrink: 0;
      user-select: none;
    }
    .kanban-col-header:active { cursor: grabbing; }
    .kanban-col-title { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.03em; cursor: pointer; }
    .kanban-col-title:hover { color: var(--accent); }
    .kanban-col-rename-input {
      font-size: 0.82rem; font-weight: 700; background: var(--surface1);
      border: 1px solid var(--accent); border-radius: 4px; color: var(--text);
      padding: 1px 6px; outline: none; width: 120px;
    }
    .kanban-col-count {
      font-size: 0.7rem; color: var(--overlay1);
      background: var(--surface0); border-radius: 10px; padding: 1px 8px;
    }
    .kanban-cards {
      overflow-y: auto; padding: 10px 10px; display: flex;
      flex-direction: column; gap: 7px; flex: 1;
    }
    .kanban-card {
      background: var(--surface0); border: 1px solid var(--surface1);
      border-radius: 7px; padding: 10px 12px;
      cursor: pointer; transition: border-color 0.12s, background 0.12s;
    }
    .kanban-card:hover { border-color: var(--surface2); background: #36374a; }
    .kanban-card.done { opacity: 0.5; }
    .kanban-card.overdue .kc-due { color: var(--red); }
    .kc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
    .kc-checkbox { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; margin-top: 2px; }
    .kc-title { font-size: 0.85rem; font-weight: 500; flex: 1; line-height: 1.4; }
    .kanban-card.done .kc-title { text-decoration: line-through; color: var(--overlay1); }
    .kc-notes { font-size: 0.75rem; color: var(--subtext0); margin-bottom: 6px; line-height: 1.4; }
    .kc-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .kc-due { font-size: 0.7rem; color: var(--overlay1); }
    .cal-btn {
      background: none; border: none; cursor: pointer; padding: 0 2px;
      font-size: 0.78rem; color: var(--overlay0); line-height: 1;
      transition: color 0.12s; flex-shrink: 0;
    }
    .cal-btn:hover { color: #4285f4; }

    /* ── User avatars ── */
    .user-avatar {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 0.6rem; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; letter-spacing: 0;
    }
    .user-avatar.sm { width: 16px; height: 16px; font-size: 0.55rem; }
    .assignee-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .assignee-chip {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface0); border-radius: 10px;
      padding: 2px 7px 2px 3px; font-size: 0.72rem; color: var(--subtext1);
      cursor: pointer; border: 1px solid transparent; transition: border-color 0.1s;
    }
    .assignee-chip.selected { border-color: var(--accent); color: var(--text); }
    .assignee-new-btn {
      background: transparent; border: 1px dashed var(--surface1);
      color: var(--overlay0); border-radius: 6px; padding: 4px 10px;
      cursor: pointer; font-size: 0.72rem; transition: all 0.1s;
    }
    .assignee-new-btn:hover { border-color: var(--accent); color: var(--accent); }
    .user-filter-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px 3px 6px; border-radius: 12px;
      background: var(--surface0); border: 1px solid var(--surface1);
      font-size: 0.75rem; color: var(--subtext1); cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    .user-filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .user-filter-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

    /* ── Accounting ── */
    .acct-badge {
      font-size: 0.65rem; font-weight: 700; padding: 1px 6px;
      border-radius: 8px; background: rgba(166,227,161,0.15);
      color: var(--green); flex-shrink: 0;
    }
    .acct-balance {
      font-size: 0.72rem; color: var(--green); font-weight: 600;
    }
    .odoo-link-btn {
      background: none; border: 1px solid var(--surface1); cursor: pointer;
      padding: 2px 7px; border-radius: 5px; font-size: 0.7rem;
      color: var(--blue); transition: background 0.1s;
    }
    .odoo-link-btn:hover { background: var(--surface0); }

    /* Archive */
    .archived-ribbon {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--overlay0);
      background: var(--surface1); border-radius: 4px; padding: 1px 6px;
    }
    .task-card.is-archived, .kanban-card.is-archived {
      opacity: 0.45; border-style: dashed;
    }
    .kc-sub { font-size: 0.7rem; color: var(--overlay0); display: flex; align-items: center; gap: 5px; }
    .kc-sub-bar { height: 3px; background: var(--surface1); border-radius: 2px; width: 40px; overflow: hidden; }
    .kc-sub-fill { height: 100%; background: var(--green); border-radius: 2px; }
    .kc-timestamps {
      margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--surface0);
      display: flex; flex-direction: column; gap: 2px;
    }
    .kc-ts { font-size: 0.67rem; color: var(--overlay0); display: flex; align-items: center; gap: 4px; }
    .kc-ts.done-ts { color: var(--green); opacity: 0.8; }
    .task-timestamps {
      margin-top: 4px; display: flex; flex-direction: column; gap: 1px;
    }
    .task-ts { font-size: 0.67rem; color: var(--overlay0); }
    .task-ts.done-ts { color: var(--green); opacity: 0.8; }
    .kanban-add-btn {
      margin: 0 10px 10px; background: none;
      border: 1px dashed var(--surface1); color: var(--overlay0);
      border-radius: 6px; padding: 7px 12px; cursor: pointer;
      font-size: 0.79rem; text-align: left; transition: all 0.15s; flex-shrink: 0;
    }
    .kanban-add-btn:hover { border-color: var(--surface2); color: var(--subtext1); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--surface2); }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">✓</span> To-Do
      <span style="display:flex;flex-direction:column;margin-left:6px;align-self:flex-end;padding-bottom:1px;line-height:1.3;">
        <span style="font-size:0.6rem;font-weight:400;color:var(--overlay0);letter-spacing:0.08em;">BY SHIFT</span>
        <span id="last-updated" style="font-size:0.58rem;font-weight:400;color:var(--surface2);letter-spacing:0.02em;"></span>
      </span>
    </div>
    <div class="projects-list" id="projects-list"></div>
    <div class="sidebar-divider"></div>
    <div id="views-section"></div>
    <div class="sidebar-footer">
      <button class="add-btn" onclick="openAddModal()" style="width:100%;margin-bottom:2px;">+ Add task</button>
      <button class="add-project-btn" onclick="openNewProjectModal()">+ New project</button>
      <button class="add-project-btn" onclick="openSaveViewModal()">⊞ Save view</button>
      <button class="add-project-btn" onclick="openUsersModal()">👤 Manage users</button>
      <button class="add-project-btn" onclick="openSettingsModal()">⚙ Settings</button>
      <button class="add-project-btn" onclick="openChangelogModal()">📋 Changelog</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <div class="toolbar">
      <span class="toolbar-title" id="toolbar-title" onclick="selectProject('All')" style="cursor:pointer;" title="Show all tasks">All Tasks</span>
      <span class="task-count" id="task-count"></span>
      <input class="search-input" type="text" placeholder="Search…" id="search-input" oninput="onSearch(this.value)">
      <div class="filter-group">
        <span class="filter-group-label">⧩ Filters</span>
        <select class="filter-select" id="priority-filter" onchange="onPriorityFilter(this.value)">
          <option value="All">Priority</option>
        </select>
        <select class="filter-select" id="status-filter" onchange="onStatusFilter(this.value)">
          <option value="">Status</option>
        </select>
        <select class="filter-select" id="company-filter" onchange="onCompanyFilter(this.value)">
          <option value="">Company</option>
        </select>
        <select class="filter-select" id="dept-filter" onchange="onDeptFilter(this.value)">
          <option value="">Department</option>
        </select>
        <select class="filter-select" id="user-filter" onchange="onUserFilter(this.value)">
          <option value="">User</option>
        </select>
      </div>
      <button class="tb-btn active" id="show-done-btn" onclick="toggleShowDone()">Show done</button>
      <button class="tb-btn" id="show-archived-btn" onclick="toggleShowArchived()">Archived</button>
      <button class="tb-btn active" id="show-subs-btn" onclick="toggleShowSubs()">Subtasks</button>
      <select class="filter-select" id="group-select" onchange="onGroupByChange(this.value)" style="min-width:130px;display:none;">
        <option value="">No grouping</option>
        <option value="project">Group by project</option>
        <option value="status">Group by status</option>
        <option value="dept">Group by department</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn" id="view-list-btn" onclick="setView('list')" title="List view">&#9776; List</button>
        <button class="view-btn active" id="view-kanban-btn" onclick="setView('kanban')" title="Kanban view">&#9646;&#9646; Kanban</button>
        <button class="view-btn" id="view-projects-btn" onclick="setView('projects')" title="Projects board">&#9632; Projects</button>
        <button class="view-btn" id="view-projects-list-btn" onclick="setView('projects-list')" title="Projects list">📋 All projects</button>
      </div>
    </div>
    <div class="active-filters-bar" id="active-filters-bar" style="display:none;"></div>
    <div class="task-list" id="task-list" style="display:none"></div>
    <div class="kanban-board" id="kanban-board"></div>
    <div class="projects-board" id="projects-board" style="display:none"></div>
    <div class="projects-list-view" id="projects-list-view" style="display:none;flex:1;overflow-y:auto;padding:14px 16px;"></div>
  </div>
</div>

<!-- ── Task Modal ── -->
<div class="modal-overlay" id="task-modal" onclick="onOverlayClick(event,'task-modal')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Task</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-input" type="text" id="m-title" placeholder="What needs to be done?"
          onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)) saveTask()">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Project</label>
          <input class="form-input" type="text" id="m-project" placeholder="Project name" list="proj-datalist">
          <datalist id="proj-datalist"></datalist>
        </div>
        <div class="form-group">
          <label class="form-label">Due date</label>
          <input class="form-input" type="date" id="m-due">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <div class="priority-row" id="priority-row"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="m-notes" placeholder="Add notes…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Assign to</label>
        <div class="assignee-row" id="m-assignees"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Department</label>
        <div id="m-dept-row" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;"></div>
      </div>
      <div id="acct-fields" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Partner name (Odoo)</label>
            <input class="form-input" type="text" id="m-partner" placeholder="e.g. Charbel Kiki">
          </div>
          <div class="form-group">
            <label class="form-label">Balance (USD)</label>
            <input class="form-input" type="number" id="m-balance" placeholder="0.00" step="0.01">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Odoo Partner ID <span style="color:var(--overlay0);font-weight:400">(optional — for direct link)</span></label>
          <input class="form-input" type="text" id="m-partner-id" placeholder="e.g. 42">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Subtasks</label>
        <div class="subtask-list" id="subtask-list"></div>
        <div class="add-sub-row">
          <input class="add-sub-input" type="text" id="new-sub-input" placeholder="Add subtask…"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addSubtask();}">
          <button class="add-sub-btn" onclick="addSubtask()">Add</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="delete-btn" id="delete-btn" onclick="deleteTask()" style="display:none">Delete task</button>
      <button class="tb-btn" id="archive-btn" onclick="archiveTask()" style="display:none;margin-left:4px;font-size:0.78rem;padding:5px 12px;">Archive</button>
      <div class="footer-right">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" onclick="saveTask()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Project Popover ── -->
<div id="proj-popover" style="display:none;position:fixed;z-index:900;background:var(--mantle);border:1px solid var(--surface1);border-radius:10px;padding:14px;min-width:240px;box-shadow:0 8px 32px #0008;">
  <div style="font-size:0.75rem;font-weight:700;color:var(--overlay0);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;" id="pop-proj-title">Project</div>
  <div style="margin-bottom:10px;">
    <label class="form-label" style="font-size:0.72rem;">Status</label>
    <input class="form-input" id="pop-status-input" list="pop-status-list" placeholder="Type or choose status…" autocomplete="off" oninput="onPopStatusInput()" style="margin-top:3px;">
    <datalist id="pop-status-list"></datalist>
  </div>
  <div style="margin-bottom:12px;">
    <label class="form-label" style="font-size:0.72rem;">Company</label>
    <input class="form-input" id="pop-company-input" list="pop-company-list" placeholder="Type or choose company…" autocomplete="off" style="margin-top:3px;">
    <datalist id="pop-company-list"></datalist>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="save-btn" style="flex:1;padding:6px;" onclick="saveProjectPopover()">Save</button>
    <button class="cancel-btn" onclick="closeProjectPopover()">Cancel</button>
    <button class="delete-btn" style="padding:6px 10px;" onclick="deleteProject()" title="Delete project">🗑</button>
  </div>
</div>
<div id="proj-popover-backdrop" style="display:none;position:fixed;inset:0;z-index:899;" onclick="closeProjectPopover()"></div>

<!-- ── Settings Modal ── -->
<div class="modal-overlay" id="settings-modal" onclick="onOverlayClick(event,'settings-modal')">
  <div class="modal" style="width:500px;max-height:80vh;display:flex;flex-direction:column;">
    <div class="modal-header">
      <span class="modal-title">⚙ Settings</span>
      <button class="modal-close" onclick="closeModalById('settings-modal')">×</button>
    </div>
    <div style="display:flex;border-bottom:1px solid var(--surface0);">
      <button class="settings-tab active" id="stab-statuses" onclick="switchSettingsTab('statuses')">Project Statuses</button>
      <button class="settings-tab" id="stab-companies" onclick="switchSettingsTab('companies')">Companies</button>
      <button class="settings-tab" id="stab-depts" onclick="switchSettingsTab('depts')">Departments</button>
      <button class="settings-tab" id="stab-priorities" onclick="switchSettingsTab('priorities')">Priorities</button>
    </div>
    <div class="modal-body" style="flex:1;overflow-y:auto;">
      <!-- Statuses tab -->
      <div id="stab-content-statuses">
        <div id="settings-statuses-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;"></div>
        <div style="display:flex;gap:8px;align-items:center;">

// ── Project metadata (status) ─────────────────────────────────────────────
async function loadProjectMeta() {

  catch { projectMeta = {}; }
}
async function saveProjectMeta() {
  try {
    await fetch('/api/projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(projectMeta)
    });
  } catch {}
}

function cycleProjectStatus(e, projName) {
  e.stopPropagation();
  const cur = projectMeta[projName]?.status || null;
  const ids = statuses.map(s => s.id);
  const idx = cur ? ids.indexOf(cur) : -1;
  const next = idx < ids.length - 1 ? ids[idx + 1] : null;
  if (!projectMeta[projName]) projectMeta[projName] = {};
  projectMeta[projName].status = next;
  saveProjectMeta();
  renderAll();
}

function renderStatusFilterRow() {
  const el = document.getElementById('status-filter');
  if (!el) return;
  const cur = filterStatus || '';
  el.innerHTML = `<option value="">All statuses</option>` +
    statuses.map(s => `<option value="${s.id}" ${cur === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  el.classList.toggle('filter-active', !!filterStatus);
}

function onStatusFilter(val) {
  filterStatus = val || null;
  markSelectActive('status-filter', !!val);
  renderAll();
}

function toggleStatusFilter(status) { // kept for back-compat
  filterStatus = filterStatus === status ? null : status;
  renderStatusFilterRow();
  renderAll();
}

function projStatus(name) {

}

// ── Users ─────────────────────────────────────────────────────────────────
const USER_COLORS = ['#89b4fa','#cba6f7','#f38ba8','#fab387','#a6e3a1','#f9e2af','#94e2d5','#89dceb'];

async function loadUsers() {
  try { const r = await fetch('/api/users'); users = await r.json(); }
  catch { users = []; }
}
async function saveUsers() {
  try {
    await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(users)
    });
  } catch {}
}

function userById(id) { return users.find(u => u.id === id); }

function userAvatarHtml(u, cls = '') {
  if (!u) return '';
  return `<span class="user-avatar ${cls}" style="background:${u.color}" title="${esc(u.name)}">${esc(u.initials)}</span>`;
}

function renderUserFilter() {
  const el = document.getElementById('user-filter');
  if (!el) return;
  const cur = filterUser || '';
  el.innerHTML = `<option value="">All users</option>` +
    users.map(u => `<option value="${u.id}" ${cur === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
  el.classList.toggle('filter-active', !!filterUser);
  el.style.display = users.length ? '' : 'none';
}

function onUserFilter(val) {
  filterUser = val || null;
  markSelectActive('user-filter', !!val);
  renderAll();
}

function toggleUserFilter(id) {
  filterUser = filterUser === id ? null : id;
  renderUserFilter();
  renderAll();
}

function openUsersModal() {
  renderUsersList();
  openModal('users-modal');
}

function getUniqueInitials(proposed) {
  if (!users.find(u => u.initials === proposed)) return proposed;
  if (proposed.length < 3 && !users.find(u => u.initials === proposed + '2')) return proposed + '2';
  for (let i = 2; i <= 99; i++) {
    const candidate = proposed[0] + i;
    if (!users.find(u => u.initials === candidate)) return candidate;
  }
  return proposed;
}

function renderUsersList() {
  const el = document.getElementById('users-list');
  if (!users.length) { el.innerHTML = '<div style="color:var(--overlay0);font-size:0.8rem;">No users yet — add one below.</div>'; return; }
  el.innerHTML = users.map(u => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--surface0);">
      ${userAvatarHtml(u)}
      <span style="flex:1;font-size:0.85rem;">${esc(u.name)}</span>
      <span style="font-size:0.7rem;color:var(--overlay0);">${esc(u.initials)}</span>
      <button onclick="removeUser('${u.id}')" style="background:none;border:none;color:var(--overlay0);cursor:pointer;font-size:0.9rem;" title="Remove">✕</button>
    </div>`).join('');
}

function addUser() {
  const name = document.getElementById('new-user-name').value.trim();
  if (!name) { document.getElementById('new-user-name').focus(); return; }
  if (users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
    alert(`User '${name}' already exists`);
    return;
  }
  let initials = document.getElementById('new-user-initials').value.trim().toUpperCase().slice(0, 2);
  if (!initials) initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  initials = getUniqueInitials(initials);
  const color = USER_COLORS[users.length % USER_COLORS.length];
  users.push({ id: uid(), name, initials, color });
  saveUsers();
  document.getElementById('new-user-name').value = '';
  document.getElementById('new-user-initials').value = '';
  renderUsersList();
  renderUserFilter();
}

function removeUser(id) {
  users = users.filter(u => u.id !== id);
  // Remove from tasks
  tasks.forEach(t => {
    if (t.assignees) t.assignees = t.assignees.filter(a => a !== id);
  });
  if (filterUser === id) filterUser = null;
  saveUsers();
  scheduleSave();
  renderUsersList();
  renderUserFilter();
  renderAll();
}

function renderModalAssignees() {
  const el = document.getElementById('m-assignees');
  let html = users.map(u => `
    <div class="assignee-chip ${editingAssignees.includes(u.id) ? 'selected' : ''}"
         onclick="toggleAssignee('${u.id}')">
      ${userAvatarHtml(u, 'sm')} ${esc(u.name)}
    </div>`).join('');
  html += `<button class="assignee-new-btn" onclick="toggleAddUserForm()" style="flex-shrink:0;">+ New</button>`;
  if (window._showAddUserForm) {
    html += `
      <div class="add-user-form" style="flex-basis:100%;display:flex;gap:6px;align-items:flex-end;margin-top:4px;">
        <input class="form-input" type="text" id="new-user-name-modal" placeholder="Full name" style="flex:1;font-size:0.75rem;padding:4px 8px;height:28px;">
        <input class="form-input" type="text" id="new-user-initials-modal" placeholder="AB" style="width:45px;font-size:0.75rem;padding:4px 6px;height:28px;text-align:center;" maxlength="2">
        <button class="save-btn" onclick="addUserFromModal()" style="padding:4px 10px;font-size:0.75rem;height:28px;">Add</button>
        <button class="cancel-btn" onclick="toggleAddUserForm()" style="padding:4px 10px;font-size:0.75rem;height:28px;">Cancel</button>
      </div>`;
  }
  if (!html.includes('assignee-chip')) html = `<span style="color:var(--overlay0);font-size:0.75rem;">No users yet — add one below</span>` + html;
  el.innerHTML = html;
  if (window._showAddUserForm) {
    setTimeout(() => document.getElementById('new-user-name-modal')?.focus(), 60);
  }
}

function toggleAssignee(id) {
  if (editingAssignees.includes(id)) editingAssignees = editingAssignees.filter(x => x !== id);
  else editingAssignees.push(id);
  renderModalAssignees();
}

function toggleAddUserForm() {
  window._showAddUserForm = !window._showAddUserForm;
  renderModalAssignees();
}

function addUserFromModal() {
  const nameEl = document.getElementById('new-user-name-modal');
  const initEl = document.getElementById('new-user-initials-modal');
  const name = nameEl?.value.trim() || '';
  let initials = initEl?.value.trim().toUpperCase().slice(0, 2) || '';
  if (!name || !initials) { alert('Enter name and initials'); return; }
  if (users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
    alert(`User '${name}' already exists`);
    return;
  }
  initials = getUniqueInitials(initials);

  const id = 'u-' + Date.now();
  const color = USER_COLORS[users.length % USER_COLORS.length];
  users.push({ id, name, initials, color });
  editingAssignees.push(id);
  saveUsers();
  window._showAddUserForm = false;
  renderModalAssignees();
}

  renderChangelogList();

function renderChangelogList() {
  const el = document.getElementById('changelog-list');
  if (!changelog.length) {
    el.innerHTML = '<div style="color:var(--overlay0);font-size:0.8rem;text-align:center;padding:20px 0;">No entries yet — push your first one above.</div>';
    return;
  }
  el.innerHTML = [...changelog].reverse().map((entry, i) => `
    <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface0);">

      <div style="flex:1;">
        <div style="font-size:0.78rem;font-weight:700;color:var(--text);">${esc(formatDateTime(entry.date))}</div>
        ${entry.note ? `<div style="font-size:0.8rem;color:var(--subtext0);margin-top:2px;">${esc(entry.note)}</div>` : ''}
      </div>
      <button onclick="deleteChangelogEntry(${changelog.length - 1 - i})" style="background:none;border:none;color:var(--overlay0);cursor:pointer;font-size:0.85rem;" title="Delete">✕</button>

}

function pushChangelog() {
  const note = document.getElementById('changelog-note').value.trim();
  changelog.push({ date: new Date().toISOString(), note });
  document.getElementById('changelog-note').value = '';
  saveChangelog();
  renderChangelogList();
  updateLastSaved();
}

function deleteChangelogEntry(idx) {
  changelog.splice(idx, 1);
  saveChangelog();
  renderChangelogList();
}

function switchSettingsTab(tab) {
  _settingsTab = tab;
  ['statuses','companies','depts','priorities'].forEach(t => {
    document.getElementById(`stab-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`stab-content-${t}`).style.display = t === tab ? '' : 'none';
  });

function makeSettingsRow(id, name, color, onRename, onDelete, onColorChange) {
  return `
    <div class="settings-row" id="srow-${id}">
      ${color !== undefined ? `<input type="color" value="${color}" style="width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0;flex-shrink:0;"
        onchange="${onColorChange}(event,'${id}')">` : ''}
      <span class="settings-row-name">${esc(name)}</span>
      <button class="settings-act-btn" onclick="startSettingsRename('${id}','${esc(name)}','${onRename}')" title="Rename">✎</button>
      <button class="settings-act-btn del" onclick="${onDelete}('${id}')" title="Delete">✕</button>
    </div>`;
}

function startSettingsRename(id, current, saveFn) {
  const row = document.getElementById(`srow-${id}`);
  if (!row) return;
  const nameEl = row.querySelector('.settings-row-name');
  nameEl.outerHTML = `<input class="settings-rename-input" id="srename-${id}"
    value="${esc(current)}"
    onblur="confirmSettingsRename('${id}','${saveFn}',this.value,this)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.dataset.cancel=1;this.blur();}">`;
  const inp = document.getElementById(`srename-${id}`);
  inp.focus(); inp.select();
}

function confirmSettingsRename(id, saveFn, val, inp) {
  if (inp.dataset.cancel) { window[`renderSettings${saveFn}`](); return; }
  const trimmed = val.trim();
  if (trimmed) window[`_rename_${saveFn}`](id, trimmed);
  window[`renderSettings${saveFn}`]();
}

let _popoverProj = null;

function openProjectPopover(e, projName) {
  e.stopPropagation();
  _popoverProj = projName;
  const pop = document.getElementById('proj-popover');
  const bd  = document.getElementById('proj-popover-backdrop');

  document.getElementById('pop-proj-title').textContent = projName;

  // Populate datalists
  document.getElementById('pop-status-list').innerHTML =
    statuses.map(s => `<option value="${esc(s.name)}">`).join('');
  document.getElementById('pop-company-list').innerHTML =
    companies.map(c => `<option value="${esc(c.name)}">`).join('');

  // Set current values
  const curStatus  = projStatus(projName);
  const curCompany = projCompany(projName);
  document.getElementById('pop-status-input').value  = curStatus  ? statusLabel(curStatus)  : '';
  document.getElementById('pop-company-input').value = curCompany ? (companyById(curCompany)?.name || '') : '';

  // Position near click
  const rect = e.target.getBoundingClientRect();
  pop.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px';
  pop.style.top  = (rect.bottom + 6) + 'px';
  pop.style.display = '';
  bd.style.display  = '';
}

function onPopStatusInput() {
  // live color preview on dot when typing
}

function saveProjectPopover() {
  if (!_popoverProj) return;
  if (!projectMeta[_popoverProj]) projectMeta[_popoverProj] = {};

  const statusName  = document.getElementById('pop-status-input').value.trim();
  const companyName = document.getElementById('pop-company-input').value.trim();

  // Match by name (case-insensitive)
  const matchedStatus  = statuses.find(s => s.name.toLowerCase() === statusName.toLowerCase());
  const matchedCompany = companies.find(c => c.name.toLowerCase() === companyName.toLowerCase());

  projectMeta[_popoverProj].status  = matchedStatus  ? matchedStatus.id  : (statusName ? statusName : null);
  projectMeta[_popoverProj].company = matchedCompany ? matchedCompany.id : (companyName ? companyName : null);

  saveProjectMeta();
  closeProjectPopover();
  renderAll();
}

function closeProjectPopover() {
  document.getElementById('proj-popover').style.display  = 'none';
  document.getElementById('proj-popover-backdrop').style.display = 'none';
  _popoverProj = null;
}

function deleteProject() {
  if (!_popoverProj) return;
  const taskCount = tasks.filter(t => t.project === _popoverProj).length;
  const msg = taskCount
    ? `Delete project "${_popoverProj}"?\n\nThis will also delete its ${taskCount} task${taskCount > 1 ? 's' : ''}. This cannot be undone.`
    : `Delete project "${_popoverProj}"?`;
  if (!confirm(msg)) return;
  tasks = tasks.filter(t => t.project !== _popoverProj);
  delete projectMeta[_popoverProj];
  if (filterProject === _popoverProj) filterProject = 'All';
  colOrder = colOrder.filter(p => p !== _popoverProj);
  saveColOrder();
  saveProjectMeta();
  scheduleSave();
  closeProjectPopover();
  renderAll();
}
