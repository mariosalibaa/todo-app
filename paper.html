<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Daily Paper · Shift Hub</title>
<link rel="icon" href="/icons/hub-192.png">
<link rel="manifest" href="/hub-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/hub-apple.png">
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--red:#f38ba8;--green:#a6e3a1;
    --paper:#fbfaf6;--ink:#23262b;--pen:#2f3b52;--rule:#e3e7ee;--margin:#f0b8b8;--faint:#8b8f97;--hly:rgba(222,245,70,.6);--hlo:rgba(255,150,60,.5);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--surface0);position:sticky;top:0;z-index:50;background:var(--base);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1.05rem;}
  .wordmark span{color:var(--amber);}
  .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  .hleft{display:flex;align-items:center;gap:16px;min-width:0;}
  .who{font-size:.78rem;color:var(--sub);display:flex;gap:12px;align-items:center;}
  .who a{color:var(--overlay0);text-decoration:none;} .who a:hover{color:var(--text);}
  main{max-width:760px;margin:0 auto;padding:22px 16px 80px;}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .bar .day{display:flex;align-items:center;gap:6px;margin-right:auto;}
  .bar .day b{font-size:1.02rem;font-weight:600;}
  .btn{background:var(--amber);color:#1e1e2e;border:0;border-radius:9px;padding:8px 13px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--surface1);font-weight:500;}
  .btn.ghost:hover{border-color:var(--amber);}
  .btn.sm{padding:5px 9px;font-size:.78rem;}
  .btn:disabled{opacity:.4;cursor:default;}
  .seg{display:inline-flex;border:1px solid var(--surface1);border-radius:9px;overflow:hidden;}
  .seg button{background:transparent;color:var(--sub);border:0;padding:7px 11px;font:inherit;font-size:.8rem;cursor:pointer;}
  .seg button.on{background:var(--surface0);color:var(--text);}
  .note{color:var(--sub);font-size:.8rem;margin:0 0 12px;}
  .note.live{color:var(--amber);}

  /* the sheet */
  .sheet{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:22px 18px 26px 54px;position:relative;min-height:420px;
    background-image:linear-gradient(to right,transparent 42px,var(--margin) 42px,var(--margin) 43px,transparent 43px);}
  .sheet .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 10px -10px;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;}
  .sheet .head .date{font-size:1.05rem;color:var(--pen);text-decoration:underline;text-underline-offset:4px;}
  .sheet .path{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--faint);margin:-2px 0 10px -10px;}
  .sheet .path a{color:var(--pen);text-decoration:none;font-weight:600;} .sheet .path a:hover{text-decoration:underline;}
  .add{display:flex;gap:8px;margin:0 0 8px -10px;}
  .add input{flex:1;border:0;border-bottom:1.5px dashed #c9ccd3;background:transparent;font:inherit;font-size:1rem;color:var(--ink);padding:8px 4px;}
  .add input:focus{outline:none;border-bottom-color:var(--amber);}
  ol.lines{list-style:none;margin:0;padding:0;}
  li.ln{position:relative;border-bottom:1px solid var(--rule);padding:7px 0 7px;}
  li.ln .row{display:flex;align-items:center;gap:8px;min-height:30px;}
  li.ln .grip{position:absolute;left:-50px;top:9px;width:22px;text-align:center;color:#b9bcc4;cursor:grab;touch-action:none;user-select:none;font-size:1rem;line-height:1.4;}
  li.ln .num{position:absolute;left:-28px;top:10px;width:20px;text-align:right;color:var(--faint);font-size:.75rem;font-variant-numeric:tabular-nums;}
  li.ln .ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #9aa0aa;background:transparent;cursor:pointer;padding:0;color:#fff;font-size:.7rem;line-height:1;}
  li.ln.done .ck{background:#6f9b6a;border-color:#6f9b6a;}
  li.ln .tx{flex:1;min-width:0;font-size:1rem;line-height:1.45;cursor:pointer;word-break:break-word;}
  li.ln .tx span{padding:1px 3px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  li.ln.hl-y .tx span{background:linear-gradient(transparent 18%,var(--hly) 18%,var(--hly) 88%,transparent 88%);}
  li.ln.hl-o .tx span{background:linear-gradient(transparent 18%,var(--hlo) 18%,var(--hlo) 88%,transparent 88%);}
  li.ln.done .tx{color:#9aa0aa;text-decoration:line-through;}
  li.ln .meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .chip{font-size:.7rem;border-radius:20px;padding:2px 8px;background:#eef0f4;color:#4b5263;white-space:nowrap;border:0;font-family:inherit;cursor:pointer;}
  .chip.due.late{background:#fde2e4;color:#b42335;} .chip.due.today{background:#fdefd6;color:#9a5b00;}
  .chip.sub{background:#e7ecfb;color:#2f4aa8;font-weight:600;}
  .chip.task{background:#e3f3e1;color:#2f6b2a;}
  li.ln.drag{opacity:.55;background:#f3f0e6;}
  .acts{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px 28px;font-size:.8rem;}
  li.ln.open .acts{display:flex;}
  .acts .a{border:1px solid #d6d9e0;background:#fff;color:#3a3f4a;border-radius:8px;padding:5px 9px;font:inherit;font-size:.78rem;cursor:pointer;}
  .acts .a:hover{border-color:var(--amber);}
  .acts .a.del{color:#b42335;}
  .acts .sw{width:24px;height:24px;border-radius:6px;border:1px solid #d6d9e0;cursor:pointer;padding:0;}
  .acts .sw.on{outline:2px solid var(--pen);outline-offset:1px;}
  .acts input[type=date]{border:1px solid #d6d9e0;border-radius:8px;padding:4px 6px;font:inherit;font-size:.78rem;color:#3a3f4a;background:#fff;}
  .acts .proj{min-width:200px;}
  .acts .proj .hub-pick{width:220px;} .acts .proj .hub-pick input{background-color:#fff;color:#23262b;border-color:#d6d9e0;}
  .acts .proj .hub-pick .hp-list{background:#fff;border-color:#d6d9e0;} .acts .proj .hub-pick .hp-list div{color:#23262b;}
  .acts .proj .hub-pick .hp-list div.hi{background:#f1ead8;}
  li.ln input.edit{width:100%;font:inherit;font-size:1rem;border:0;border-bottom:1.5px solid var(--amber);background:transparent;color:var(--ink);padding:2px 0;}
  li.ln input.edit:focus{outline:none;}
  .sec{margin:22px 0 6px -10px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);cursor:pointer;user-select:none;}
  .empty{color:var(--faint);font-size:.9rem;padding:18px 0;}
  ol.kids{list-style:none;margin:2px 0 0 26px;padding:0;}
  ol.kids li.ln{border-bottom:0;padding:2px 0;}
  ol.kids li.ln .tx{font-size:.9rem;color:#4a4f5a;cursor:default;}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0 -10px;}
  .photos a img{height:86px;border-radius:5px;border:1px solid #d6d9e0;display:block;}

  /* photo → lines */
  #rd{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 12px;overflow:auto;}
  #rd.on{display:flex;}
  #rd .card{background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;max-width:560px;width:100%;padding:18px;}
  #rd h2{font-size:1.05rem;margin:0 0 4px;} #rd p{color:var(--sub);font-size:.82rem;margin:0 0 12px;}
  #rd .it{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--surface0);}
  #rd .it input[type=text]{flex:1;background:var(--base);border:1px solid var(--surface0);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit;font-size:.9rem;}
  #rd .it .tag{font-size:.68rem;color:var(--overlay0);white-space:nowrap;}
  #rd .it .tag.q{color:var(--amber);}
  #rd .it .h{width:12px;height:22px;border-radius:3px;flex:none;}
  #rd select{background:var(--base);color:var(--text);border:1px solid var(--surface1);border-radius:8px;padding:6px 8px;font:inherit;font-size:.85rem;}
  #rd .foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap;}
  #rd .err{color:var(--red);font-size:.8rem;margin-right:auto;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface0);color:var(--text);padding:9px 16px;border-radius:10px;font-size:.85rem;display:none;z-index:120;}
  @media (max-width:600px){
    header{padding:14px 12px;} main{padding:14px 8px 80px;}
    .sheet{padding:16px 10px 22px 46px;background-image:linear-gradient(to right,transparent 36px,var(--margin) 36px,var(--margin) 37px,transparent 37px);}
    li.ln .grip{left:-44px;} li.ln .num{left:-24px;}
    li.ln .row{flex-wrap:wrap;} li.ln .meta{width:100%;justify-content:flex-start;padding-left:28px;}
    li.ln .meta:empty{display:none;}
    .acts{margin-left:0;} .acts .proj,.acts .proj .hub-pick{width:100%;min-width:0;}
    .add input{font-size:16px;}
  }
</style>
</head>
<body>
<header>
  <div class="hleft">
    <span id="crumbs"></span>
    <div class="wordmark">SHIFT <span>GROUP</span><small>DAILY PAPER</small></div><script>document.addEventListener("DOMContentLoaded", () => Admin.crumbs([['Daily Paper']]));</script>
  </div>
  <div class="who" id="who"></div>
</header>
<main>
  <div class="bar">
    <div class="day">
      <button class="btn ghost sm" id="prev" title="The page of an earlier day">‹</button>
      <b id="dayname"></b>
      <button class="btn ghost sm" id="next" title="A later day">›</button>
    </div>
    <div class="seg" id="sort"><button data-s="mine" class="on" title="Your order — drag ⠿ to change">Priority</button><button data-s="due" title="Earliest due date first">Due date</button></div>
    <button class="btn" id="photo-btn" title="Take or pick a photo of your paper — it is kept on today's page and read into lines you tick">📷 Read my paper</button>
    <input type="file" id="photo" accept="image/*" style="display:none">
  </div>
  <p class="note" id="note"></p>
  <div class="sheet" id="sheet"></div>
</main>

<div id="rd" onclick="if(event.target===this)closeRead()">
  <div class="card">
    <h2>From your paper</h2>
    <p id="rd-sub">Reading the handwriting…</p>
    <div id="rd-list"></div>
    <div class="foot">
      <span class="err" id="rd-err"></span>
      <label style="font-size:.8rem;color:var(--sub)">Add under <select id="rd-under"></select></label>
      <button class="btn ghost" onclick="closeRead()">Cancel</button>
      <button class="btn" id="rd-add" disabled>Add ticked lines</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/admin-shared.js"></script>
<script src="/phone-preview.js"></script>
<script>
const esc = Admin.esc;
const $ = id => document.getElementById(id);
let LINES = [], PROJECTS = [], DAYS = [], TODAY = '', SORT = 'mine', OPEN = null, EDIT = null, SHOW_DONE = false;
const Q = new URLSearchParams(location.search);
let CUR = Q.get('in') || null;          // the sheet open: null = the paper, else a line's own sheet
let DAY = Q.get('day') || null;         // a past day's copy (read-only), null = today's living page
try { SORT = localStorage.getItem('paper.sort') || 'mine'; } catch (e) {}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const dObj = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd); };
const longDay = d => { const x = dObj(d); return `${DOW[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const shortDay = d => { const x = dObj(d); return `${x.getDate()} ${MONTHS[x.getMonth()]}` + (x.getFullYear() !== dObj(TODAY).getFullYear() ? ' ' + x.getFullYear() : ''); };
const toast = t => { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); };

Admin.require(null, async me => {   // admin only — the server refuses /api/paper to anyone else
  $('who').innerHTML = `${esc(me.email)} <a href="#" onclick="Admin.signOut();return false;">Sign out</a>`;
  await load();
});

async function load() {
  const r = await Admin.api('GET', '/api/paper');
  LINES = r.lines; PROJECTS = r.projects; DAYS = r.days; TODAY = r.today;
  render();
}
function go(params) {
  CUR = params.in || null; DAY = params.day || null; OPEN = null; EDIT = null;
  const q = new URLSearchParams(); if (CUR) q.set('in', CUR); if (DAY) q.set('day', DAY);
  history.pushState(null, '', '/paper' + (q.toString() ? '?' + q : ''));
  render();
}
window.addEventListener('popstate', () => { const q = new URLSearchParams(location.search); CUR = q.get('in'); DAY = q.get('day'); OPEN = null; render(); });

const byId = id => LINES.find(l => l.id === id);
const kids = (id, list) => (list || LINES).filter(l => (l.parent || null) === (id || null));
const openCount = id => kids(id).filter(l => !l.done).length;
function sorted(list) {
  const a = list.slice();
  if (SORT === 'due') a.sort((x, y) => (x.due || '9999') .localeCompare(y.due || '9999') || (x.order || 0) - (y.order || 0));
  else a.sort((x, y) => (x.order || 0) - (y.order || 0));
  return a;
}

// ── the bar: day ‹ › and the sort
function renderBar() {
  const all = [...new Set([...DAYS.map(d => d.day), TODAY])].sort();
  const d = DAY || TODAY, i = all.indexOf(d);
  $('dayname').textContent = (DAY ? '' : 'Today · ') + longDay(d);
  $('prev').disabled = i <= 0; $('next').disabled = !DAY;
  $('prev').onclick = () => i > 0 && go({ day: all[i - 1] });
  $('next').onclick = () => { const n = all[i + 1]; go(!n || n === TODAY ? {} : { day: n }); };
  document.querySelectorAll('#sort button').forEach(b => { b.classList.toggle('on', b.dataset.s === SORT); b.onclick = () => { SORT = b.dataset.s; try { localStorage.setItem('paper.sort', SORT); } catch (e) {} render(); }; });
  $('sort').style.display = DAY ? 'none' : ''; $('photo-btn').style.display = DAY ? 'none' : '';
  $('note').className = 'note' + (DAY ? ' live' : '');
  $('note').innerHTML = DAY ? `The page as it stood at the end of ${esc(longDay(DAY))} — read-only. <a href="#" style="color:var(--amber)" onclick="go({});return false;">Back to today ›</a>`
    : 'Type and Enter to write a line. Drag ⠿ for priority, tap a line for the highlighter, a due date, the project, its own sheet or ➜ To-Do.';
}

function render() {
  renderBar();
  if (DAY) return renderDay();
  if (CUR && !byId(CUR)) CUR = null;
  const sheet = $('sheet');
  const path = []; for (let p = CUR; p; p = (byId(p) || {}).parent) { const l = byId(p); if (!l) break; path.unshift(l); }
  const mine = kids(CUR), active = sorted(mine.filter(l => !l.done)), done = mine.filter(l => l.done).sort((a, b) => String(b.doneAt || '').localeCompare(String(a.doneAt || '')));
  const doneToday = done.filter(l => l.doneAt === TODAY);
  const todayPh = (DAYS.find(d => d.day === TODAY) || {}).photos || 0;
  sheet.innerHTML = `
    <div class="head"><span class="date">${esc(shortDay(TODAY))} ${dObj(TODAY).getFullYear()}</span>${path.length ? `<span style="font-size:1.15rem;color:var(--pen)"> · ${esc(path[path.length - 1].text)}</span>` : ''}</div>
    ${path.length ? `<div class="path"><a href="#" onclick="go({});return false;">Paper</a>${path.map((l, i) => i < path.length - 1 ? ` › <a href="#" onclick="go({in:'${l.id}'});return false;">${esc(l.text)}</a>` : ` › ${esc(l.text)}`).join('')}</div>` : ''}
    <div class="add"><input id="new" placeholder="${path.length ? 'Add to ' + esc(path[path.length - 1].text) + '…' : 'A project or an idea…'}" autocomplete="off" enterkeyhint="done"></div>
    <ol class="lines" id="active">${active.map((l, i) => lineHtml(l, i + 1)).join('') || `<li class="empty">Nothing on this ${path.length ? 'sheet' : 'paper'} yet.</li>`}</ol>
    ${done.length ? `<div class="sec" onclick="SHOW_DONE=!SHOW_DONE;render()">${SHOW_DONE ? '▾' : '▸'} Done (${done.length})${doneToday.length ? ` · ${doneToday.length} today` : ''}</div>
      ${SHOW_DONE ? `<ol class="lines">${done.map(l => lineHtml(l, '')).join('')}</ol>` : ''}` : ''}
    ${todayPh && !CUR ? `<div class="photos" id="ph"></div>` : ''}`;
  const inp = $('new');
  inp.onkeydown = async e => {
    if (e.key !== 'Enter' || !inp.value.trim()) return;
    const text = inp.value.trim(); inp.value = '';
    try { const l = await Admin.api('POST', '/api/paper/line', { text, parent: CUR }); LINES.push(l); bumpToday(); render(); $('new').focus(); }
    catch (er) { toast('Not saved: ' + er.message); inp.value = text; }
  };
  sheet.querySelectorAll('li.ln[data-id]').forEach(wire);
  if (todayPh && !CUR) photosInto($('ph'), TODAY);
  if (EDIT) { const el = sheet.querySelector('input.edit'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}

function lineHtml(l, n) {
  const sub = openCount(l.id), allSub = kids(l.id).length;
  const due = l.due ? `<button class="chip due ${l.due < TODAY ? 'late' : l.due === TODAY ? 'today' : ''}" data-act="open">📅 ${esc(shortDay(l.due))}</button>` : '';
  const meta = [
    l.project ? `<button class="chip" data-act="open">${esc(l.project)}</button>` : '',
    due,
    allSub ? `<button class="chip sub" data-act="sheet" title="Open its sheet">▸ ${sub}${sub !== allSub ? '/' + allSub : ''}</button>` : '',
    l.taskId ? `<a class="chip task" href="/todo" title="In the To-Do">✓ To-Do</a>` : '',
  ].join('');
  const hl = l.hl === 'y' || l.hl === 'o';
  return `<li class="ln${l.hl ? ' hl-' + l.hl : ''}${l.done ? ' done' : ''}${OPEN === l.id ? ' open' : ''}" data-id="${l.id}">
    ${l.done ? '' : `<span class="grip" title="Drag to change the priority">⠿</span><span class="num">${n}</span>`}
    <div class="row">
      <button class="ck" data-act="done" title="${l.done ? 'Not done' : 'Done'}">${l.done ? '✓' : ''}</button>
      <div class="tx" data-act="open">${EDIT === l.id ? `<input class="edit" value="${esc(l.text)}">` : `<span>${esc(l.text)}</span>`}</div>
      <div class="meta">${meta}</div>
    </div>
    ${OPEN === l.id ? `<div class="acts">
      <button class="sw${!hl ? ' on' : ''}" data-hl="" title="No highlight" style="background:#fff"></button>
      <button class="sw${l.hl === 'y' ? ' on' : ''}" data-hl="y" title="Yellow highlighter" style="background:#e6f55a"></button>
      <button class="sw${l.hl === 'o' ? ' on' : ''}" data-hl="o" title="Orange highlighter" style="background:#ffad66"></button>
      <input type="date" data-due value="${esc(l.due || '')}" title="Due date">
      <span class="proj" data-proj></span>
      <button class="a" data-act="sheet">▸ Its own sheet${allSub ? ' (' + allSub + ')' : ''}</button>
      <button class="a" data-act="edit">✎ Edit</button>
      ${l.taskId ? '' : `<button class="a" data-act="todo" title="Make it a task in the To-Do, under its project">➜ To-Do</button>`}
      <button class="a del" data-act="del">Delete</button>
    </div>` : ''}
  </li>`;
}

async function save(l, patch) {
  Object.assign(l, patch);
  try { const r = await Admin.api('POST', '/api/paper/line', { id: l.id, ...patch }); Object.assign(l, r); bumpToday(); }
  catch (e) { toast('Not saved: ' + e.message); await load(); }
}
const bumpToday = () => { if (!DAYS.find(d => d.day === TODAY)) DAYS.push({ day: TODAY, photos: 0 }); };

function wire(li) {
  const l = byId(li.dataset.id); if (!l) return;
  li.addEventListener('click', async e => {
    const t = e.target.closest('[data-act],[data-hl]'); if (!t || t.tagName === 'A') return;
    const act = t.dataset.act;
    if (t.dataset.hl !== undefined) { await save(l, { hl: t.dataset.hl }); render(); return; }
    if (act === 'open') { if (EDIT === l.id) return; OPEN = OPEN === l.id ? null : l.id; render(); return; }
    if (act === 'done') { await save(l, { done: !l.done }); if (l.done) toast('Done — under “Done” at the bottom'); render(); return; }
    if (act === 'sheet') { go({ in: l.id }); return; }
    if (act === 'edit') { EDIT = l.id; render(); return; }
    if (act === 'todo') {
      try { Object.assign(l, await Admin.api('POST', `/api/paper/line/${l.id}/todo`)); toast('Added to the To-Do' + (l.project ? ' under ' + l.project : '')); render(); }
      catch (er) { toast('Not added: ' + er.message); }
      return;
    }
    if (act === 'del') {
      const n = kids(l.id).length;
      if (!confirm(`Delete “${l.text}”${n ? ' and the ' + n + ' line(s) on its sheet' : ''}?`)) return;
      try { const r = await Admin.api('DELETE', '/api/paper/line/' + l.id); LINES = LINES.filter(x => !r.deleted.includes(x.id)); OPEN = null; render(); }
      catch (er) { toast('Not deleted: ' + er.message); }
    }
  });
  const ed = li.querySelector('input.edit');
  if (ed) {
    const done = async keep => { const v = ed.value.trim(); EDIT = null; if (keep && v && v !== l.text) await save(l, { text: v }); render(); };
    ed.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
    ed.onblur = () => EDIT === l.id && done(true);
  }
  const due = li.querySelector('[data-due]');
  if (due) due.onchange = async () => { await save(l, { due: due.value }); render(); };
  const ph = li.querySelector('[data-proj]');
  if (ph) {
    const order = { active: 0, lead: 1, 'on-hold': 2, '': 3 };
    const items = [{ id: '', label: '— no project —' }].concat(PROJECTS.slice().sort((a, b) => (order[a.status] ?? 4) - (order[b.status] ?? 4) || a.name.localeCompare(b.name))
      .map(p => ({ id: p.name, label: p.name, group: p.status === 'active' ? 'Running' : p.status === 'lead' ? 'Leads' : p.status === 'on-hold' ? 'On hold' : 'Other' })));
    Admin.pick(ph, { items, value: l.project || '', placeholder: 'Project (To-Do)…', onPick: async id => { await save(l, { project: id }); render(); } });
  }
  const grip = li.querySelector('.grip'); if (grip) dragFrom(grip, li);
}

// ── drag ⠿ to reorder (mouse and finger alike)
function dragFrom(grip, li) {
  grip.addEventListener('pointerdown', e => {
    if (SORT !== 'mine') { toast('Switch to “Priority” to drag'); return; }
    e.preventDefault(); grip.setPointerCapture(e.pointerId);
    const list = li.parentElement; li.classList.add('drag');
    const move = ev => {
      const sibs = [...list.querySelectorAll(':scope > li.ln')].filter(x => x !== li);
      const after = sibs.find(x => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
      if (after) list.insertBefore(li, after); else list.appendChild(li);
    };
    const up = async () => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      li.classList.remove('drag');
      const ids = [...list.querySelectorAll(':scope > li.ln')].map(x => x.dataset.id);
      ids.forEach((id, i) => { const x = byId(id); if (x) x.order = i + 1; });
      render();
      try { await Admin.api('POST', '/api/paper/order', { ids }); } catch (er) { toast('Order not saved: ' + er.message); await load(); }
    };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
}

// ── a past day's copy, read-only: the paper with each sheet written under its line
async function renderDay() {
  const sheet = $('sheet');
  sheet.innerHTML = '<div class="empty">Opening ' + esc(longDay(DAY)) + '…</div>';
  let d; try { d = await Admin.api('GET', '/api/paper/day/' + DAY); } catch (e) { sheet.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const lines = d.lines || [];
  const tree = (pid, deep) => {
    const k = lines.filter(l => (l.parent || null) === pid).sort((a, b) => (a.done - b.done) || (a.order || 0) - (b.order || 0));
    if (!k.length) return '';
    return `<ol class="${deep ? 'kids' : 'lines'}">${k.map((l, i) => `<li class="ln${l.hl ? ' hl-' + l.hl : ''}${l.done ? ' done' : ''}">
      ${!deep && !l.done ? `<span class="num">${i + 1}</span>` : ''}
      <div class="row"><span class="ck" style="display:inline-block">${l.done ? '✓' : ''}</span><div class="tx" style="cursor:default"><span>${esc(l.text)}</span></div>
      <div class="meta">${l.project ? `<span class="chip">${esc(l.project)}</span>` : ''}${l.due ? `<span class="chip due">📅 ${esc(shortDay(l.due))}</span>` : ''}</div></div>
      ${tree(l.id, true)}</li>`).join('')}</ol>`;
  };
  sheet.innerHTML = `<div class="head"><span class="date">${esc(shortDay(DAY))} ${dObj(DAY).getFullYear()}</span></div>
    ${tree(null, false) || '<div class="empty">No lines kept for this day.</div>'}
    ${(d.photos || []).length ? '<div class="photos" id="ph"></div>' : ''}`;
  if ((d.photos || []).length) photosInto($('ph'), DAY, d.photos);
}

async function photosInto(host, day, photos) {
  if (!host) return;
  if (!photos) { try { photos = (await Admin.api('GET', '/api/paper/day/' + day)).photos || []; } catch (e) { return; } }
  const list = photos.map(p => ({ url: `/api/paper/day/${day}/photo/${p.id}`, name: p.name || 'Paper ' + day }));
  host.innerHTML = list.map((p, i) => `<a href="${p.url}" data-i="${i}" title="The paper itself"><img src="${p.url}" alt="paper photo" loading="lazy"></a>`).join('');
  host.querySelectorAll('a').forEach(a => a.onclick = e => { if (!window.HubViewer) return; e.preventDefault(); HubViewer.open(a.href, { name: list[a.dataset.i].name, kind: 'image', list }); });
}

// ── 📷 a photo of the real paper → kept on today, read into lines to tick
$('photo-btn').onclick = () => $('photo').click();
$('photo').onchange = async () => {
  const f = $('photo').files[0]; $('photo').value = ''; if (!f) return;
  $('rd').classList.add('on'); $('rd-list').innerHTML = ''; $('rd-err').textContent = ''; $('rd-add').disabled = true;
  $('rd-sub').textContent = 'Reading the handwriting… (about 10 seconds)';
  try {
    const dataBase64 = await shrink(f);
    const r = await Admin.api('POST', '/api/paper/photo', { dataBase64, mime: 'image/jpeg', name: f.name });
    const ph = DAYS.find(d => d.day === r.day); if (ph) ph.photos++; else DAYS.push({ day: r.day, photos: 1 });
    showRead(r);
  } catch (e) { $('rd-sub').textContent = ''; $('rd-err').textContent = 'Could not read it: ' + e.message; }
};
function shrink(file) {   // phone photos → 2000 px JPEG, small enough to send, sharp enough to read
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.85));
    }; img.onerror = () => rej(new Error('not an image')); img.src = URL.createObjectURL(file);
  });
}
function showRead(r) {
  const rd = r.read || {}, got = rd.lines || [];
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g, ' ').trim();
  const roots = kids(null).filter(l => !l.done);
  const titleLine = rd.title ? roots.find(l => norm(l.text) === norm(rd.title) || norm(l.text).includes(norm(rd.title)) || norm(rd.title).includes(norm(l.text))) : null;
  const under = $('rd-under');
  under.innerHTML = `<option value="">The paper</option>` + (CUR ? `<option value="${CUR}">${esc(byId(CUR).text)}</option>` : '')
    + roots.filter(l => l.id !== CUR).map(l => `<option value="${l.id}">${esc(l.text)}</option>`).join('');
  under.value = titleLine ? titleLine.id : (CUR || '');
  const paint = () => {
    const have = new Set(kids(under.value || null).map(l => norm(l.text)));
    $('rd-list').innerHTML = got.map((x, i) => {
      const dup = have.has(norm(x.text));
      return `<div class="it"><input type="checkbox" data-i="${i}" ${dup ? '' : 'checked'}><span class="h" style="background:${x.hl === 'y' ? '#e6f55a' : x.hl === 'o' ? '#ffad66' : 'transparent'}"></span>
        <input type="text" data-t="${i}" value="${esc(x.text)}">${x.unsure ? '<span class="tag q" title="Check the spelling">? unsure</span>' : ''}${dup ? '<span class="tag">already there</span>' : ''}</div>`;
    }).join('') || '<p>No lines found on the photo.</p>';
  };
  under.onchange = paint; paint();
  $('rd-sub').textContent = (r.error ? 'The photo is kept on ' + shortDay(r.day) + ', but it could not be read (' + r.error + ').' :
    `${got.length} line(s)${rd.date ? ' · paper of ' + shortDay(rd.date) : ''}${rd.title ? ' · “' + rd.title + '”' : ''}. Fix any word, untick what you don't want, then Add. The photo stays on ${shortDay(r.day)}'s page.`);
  $('rd-add').disabled = !got.length;
  $('rd-add').onclick = async () => {
    const lines = [...$('rd-list').querySelectorAll('input[type=checkbox]:checked')].map(c => { const i = +c.dataset.i; return { text: $('rd-list').querySelector(`[data-t="${i}"]`).value, hl: got[i].hl || '' }; }).filter(x => x.text.trim());
    if (!lines.length) return closeRead();
    $('rd-add').disabled = true;
    try { const add = await Admin.api('POST', '/api/paper/lines', { parent: under.value || null, lines }); LINES.push(...add); closeRead(); toast(add.length + ' line(s) added'); if ((under.value || null) !== CUR) go(under.value ? { in: under.value } : {}); else render(); }
    catch (e) { $('rd-err').textContent = e.message; $('rd-add').disabled = false; }
  };
}
function closeRead() { $('rd').classList.remove('on'); }
</script>
