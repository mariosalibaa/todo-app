<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Bonvin · Shift Hub</title>
<link rel="icon" href="/icons/hub-192.png">
<link rel="manifest" href="/hub-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/hub-apple.png">
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--red:#f38ba8;--green:#a6e3a1;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--surface0);position:sticky;top:0;z-index:50;background:var(--base);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1.05rem;}
  .wordmark span{color:var(--amber);}
  .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  .hleft{display:flex;align-items:center;gap:16px;}
  .who{font-size:.78rem;color:var(--sub);display:flex;gap:12px;align-items:center;}
  .who a{color:var(--overlay0);text-decoration:none;} .who a:hover{color:var(--text);}
  main{max-width:1000px;margin:0 auto;padding:30px 20px 60px;}
  h1{font-size:1.4rem;font-weight:600;margin:0 0 6px;}
  .lead{color:var(--sub);font-size:.9rem;line-height:1.55;margin:0 0 22px;}
  h2{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--overlay0);margin:28px 0 10px;font-weight:600;}
  .empty{color:var(--overlay0);font-size:.88rem;}
  .rtl{direction:rtl;text-align:right;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--surface0);margin:0 0 22px;overflow-x:auto;}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);font-size:.88rem;font-weight:500;padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px;}
  .tabs button:hover{color:var(--text);}
  .tabs button.on{color:var(--amber);border-bottom-color:var(--amber);font-weight:600;}
  .tabs button .n{font-size:.68rem;color:var(--overlay0);margin-left:6px;}
  .panel{display:none;} .panel.on{display:block;}
  /* overview */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;padding:14px;}
  .kpi .v{font-size:1.3rem;font-weight:600;color:var(--amber);letter-spacing:-.01em;}
  .kpi .l{font-size:.74rem;color:var(--sub);margin-top:4px;line-height:1.35;}
  .sec{background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
  .sec h3{margin:0 0 4px;font-size:1.02rem;font-weight:600;}
  .sec .sub{font-size:.8rem;color:var(--sub);margin:0 0 14px;line-height:1.5;}
  .rows{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:7px 16px;font-size:.86rem;line-height:1.45;}
  .rows .k{color:var(--overlay0);} .rows .v{white-space:pre-wrap;text-align:start;}
  .bullets{margin:0;padding-left:18px;font-size:.86rem;line-height:1.6;color:var(--text);}
  .tbl{width:100%;border-collapse:collapse;font-size:.83rem;margin:4px 0 4px;}
  .tbl th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--overlay0);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--surface0);white-space:nowrap;}
  .tbl td{padding:8px 8px;border-bottom:1px solid var(--surface0);vertical-align:top;line-height:1.4;}
  .tbl td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tbl tr.hi td{background:rgba(242,169,59,.10);}
  .tbl .dim{color:var(--overlay0);font-size:.76rem;display:block;margin-top:2px;}
  .tbl a{color:var(--amber);text-decoration:none;} .tbl a:hover{text-decoration:underline;}
  .tag{display:inline-block;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--surface0);color:var(--sub);white-space:nowrap;}
  .tag.cur{background:var(--amber);color:var(--base);font-weight:600;}
  .figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px;}
  .fig{background:var(--base);border:1px solid var(--surface0);border-radius:10px;overflow:hidden;cursor:zoom-in;margin:0;}
  .fig img{display:block;width:100%;height:180px;object-fit:cover;background:#fff;}
  .fig.wide{grid-column:1/-1;} .fig.wide img{height:auto;max-height:520px;object-fit:contain;}
  .fig figcaption{font-size:.74rem;color:var(--sub);padding:7px 10px;line-height:1.35;}
  /* photos */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .gal .fig img{height:150px;}
  /* documents */
  .files{display:flex;flex-direction:column;gap:6px;}
  .file{display:flex;align-items:center;gap:12px;background:var(--mantle);border:1px solid var(--surface0);border-radius:10px;padding:10px 14px;transition:border-color .15s;}
  .file:hover{border-color:var(--amber);}
  .file .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:var(--text);}
  .file .ico{font-size:1.2rem;width:26px;text-align:center;flex:none;}
  .file .name{font-weight:500;font-size:.9rem;line-height:1.3;word-break:break-word;}
  .file .meta{font-size:.7rem;color:var(--overlay0);margin-top:2px;}
  .file .dl{flex:none;font-size:.72rem;color:var(--overlay0);border:1px solid var(--surface0);border-radius:6px;padding:4px 9px;text-decoration:none;}
  .file .dl:hover{color:var(--text);border-color:var(--surface1);}
  .search{width:100%;background:var(--mantle);border:1px solid var(--surface0);color:var(--text);border-radius:10px;padding:10px 14px;font-size:.92rem;margin-bottom:6px;}
  .search:focus{outline:none;border-color:var(--amber);}
  /* viewer */
  #viewer{position:fixed;inset:0;background:#0f0f17;z-index:500;display:none;flex-direction:column;}
  #viewer.on{display:flex;}
  .vbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--mantle);border-bottom:1px solid var(--surface0);flex:none;}
  .vbar .vback{color:var(--amber);text-decoration:none;font-size:.9rem;font-weight:600;white-space:nowrap;padding:6px 8px;border-radius:8px;}
  .vbar .vback:hover{background:var(--surface0);}
  .vbar .vtitle{flex:1;min-width:0;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vbar .vbtn{color:var(--sub);text-decoration:none;font-size:.78rem;border:1px solid var(--surface0);border-radius:6px;padding:5px 10px;white-space:nowrap;background:none;cursor:pointer;}
  .vbar .vbtn:hover{color:var(--text);border-color:var(--surface1);}
  .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;}
  .vbody canvas{display:block;margin:0 auto 12px;max-width:100%;height:auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);}
  .vbody > img{display:block;margin:0 auto;max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;}
  .vcard{max-width:420px;margin:60px auto;background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;padding:28px;text-align:center;}
  .vcard .big{font-size:2.4rem;margin-bottom:10px;}
  .vcard p{color:var(--sub);font-size:.88rem;line-height:1.5;}
  .vcard a{display:inline-block;background:var(--amber);color:var(--base);text-decoration:none;font-weight:600;border-radius:8px;padding:10px 20px;margin:8px 4px 0;}
  .vstatus{color:var(--overlay0);font-size:.85rem;text-align:center;padding:40px 0;}
  .vdoc{max-width:800px;margin:12px auto;background:#fff;color:#222;padding:48px 56px;border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.5);font-family:Georgia,"Times New Roman",serif;font-size:.98rem;line-height:1.6;}
  .vdoc.rtl{font-family:"Segoe UI",Tahoma,sans-serif;}
  .vdoc table{border-collapse:collapse;width:100%;} .vdoc td,.vdoc th{border:1px solid #bbb;padding:4px 8px;vertical-align:top;} .vdoc img{max-width:100%;}
  .vsheet{background:#fff;color:#222;border-collapse:collapse;font-size:.8rem;margin:0 auto;} .vsheet td{border:1px solid #ccc;padding:3px 7px;white-space:nowrap;}
  @media (max-width:640px){
    header{padding:14px 16px;} main{padding:22px 16px 50px;}
    .rows{grid-template-columns:1fr;gap:2px 0;} .rows .k{margin-top:8px;font-size:.72rem;}
    .sec{padding:14px;} .tblwrap{overflow-x:auto;}
    .vdoc{padding:22px 18px;font-size:.92rem;} .vbar .vhide{display:none;} .vbody{padding:6px;}
  }
</style>
</head>
<body>
<header>
  <div class="hleft">
    <span id="crumbs"></span>
    <div class="wordmark">SHIFT <span>GROUP</span><small>BONVIN · SIN EL FIL 2292</small></div><script>document.addEventListener("DOMContentLoaded", () => Admin.crumbs([['Bonvin']]));</script>
  </div>
  <div class="who" id="who"></div>
</header>
<main>
  <h1 id="title">Bonvin · Sin El Fil 2292 / A5</h1>
  <p class="lead" id="lead"></p>
  <div class="tabs" id="tabs">
    <button data-tab="over" onclick="setTab('over')">Overview</button>
    <button data-tab="lease" onclick="setTab('lease')">Tenants &amp; rent<span class="n" id="n-lease"></span></button>
    <button data-tab="office" onclick="setTab('office')">Office plan</button>
    <button data-tab="photos" onclick="setTab('photos')">Photos<span class="n" id="n-photos"></span></button>
    <button data-tab="docs" onclick="setTab('docs')">Documents<span class="n" id="n-docs"></span></button>
  </div>
  <div class="panel" id="panel-over"><p class="empty">Loading…</p></div>
  <div class="panel" id="panel-lease"></div>
  <div class="panel" id="panel-office"></div>
  <div class="panel" id="panel-photos"></div>
  <div class="panel" id="panel-docs">
    <input type="search" class="search" id="q" placeholder="Search the documents — tenant, year, receipt, صك…" autocomplete="off">
    <div id="groups"></div>
  </div>
</main>
<div id="viewer">
  <div class="vbar">
    <a class="vback" href="#" onclick="closeViewer();return false;">&lsaquo; Back</a>
    <div class="vtitle" id="vtitle"></div>
    <button class="vbtn" id="vprev" onclick="step(-1)" title="Previous (←)">‹</button>
    <button class="vbtn" id="vnext" onclick="step(1)" title="Next (→)">›</button>
    <a class="vbtn vhide" id="vtab" href="#" target="_blank" rel="noopener">Open in new tab</a>
    <a class="vbtn" id="vdl" href="#">↓ Download</a>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/admin-shared.js"></script>
<script src="/phone-preview.js"></script>
<script>
// Everything shown here comes from two reads: /api/bonvin/meta (the dossier written in bonvin-data.json
// on the laptop) and /api/bonvin/files (the Dropbox folder, synced by bonvin-sync.mjs). Admins only.
const esc = Admin.esc;
const ICON = m => /pdf/.test(m) ? '📄' : /word|officedocument.wordprocessing|msword/.test(m) ? '📝' : /sheet|excel/.test(m) ? '📊' : /image/.test(m) ? '🖼️' : /acad|sketchup/.test(m) ? '📐' : '📎';
const kb = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
const isAr = s => /[؀-ۿ]/.test(s);
const isImg = f => /^image\//.test(f.mime);
const fileUrl = (f, extra) => '/api/bonvin/files/' + encodeURIComponent(f.id) + '?v=' + (f.sha1 || '').slice(0, 8) + (extra || '');
const thumb = f => fileUrl(f, f.previewKey ? '&p=1' : '');
let FILES = [], META = null, LIST = [];   // LIST = what ‹ › steps through in the viewer
const byPath = p => FILES.find(f => f.path.toLowerCase() === String(p).toLowerCase());

Admin.require(null, async me => {
  document.getElementById('who').innerHTML = `${esc(me.email)} <a href="#" onclick="Admin.signOut();return false;">Sign out</a>`;
  if (!me.admin) { document.querySelector('main').innerHTML = '<p class="empty">This page is for Mario only. <a href="/admin" style="color:var(--amber)">← Back to the hub</a></p>'; return; }
  try { [META, FILES] = await Promise.all([Admin.api('GET', '/api/bonvin/meta'), Admin.api('GET', '/api/bonvin/files')]); }
  catch (e) { document.getElementById('panel-over').innerHTML = `<p class="empty" style="color:var(--red)">Could not load: ${esc(e.message)}</p>`; return; }
  META = META || {};
  renderAll();
  document.getElementById('q').addEventListener('input', renderDocs);
  if (location.hash.length > 1) openViewer(location.hash.slice(1), true);
});

// ── Tabs ────────────────────────────────────────────────────────────────────
let TAB = 'over';
try { TAB = ['over', 'lease', 'office', 'photos', 'docs'].includes(localStorage.getItem('bonvin_tab')) ? localStorage.getItem('bonvin_tab') : 'over'; } catch {}
function setTab(k) {
  TAB = k; try { localStorage.setItem('bonvin_tab', k); } catch {}
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + k));
}
setTab(TAB);

// ── Building blocks of the dossier ──────────────────────────────────────────
// a figure: { file: "<path in the folder>", caption, wide }
function figs(list) {
  const items = (list || []).map(x => typeof x === 'string' ? { file: x } : x).map(x => ({ ...x, f: byPath(x.file) })).filter(x => x.f);
  if (!items.length) return '';
  return `<div class="figs">${items.map(x => `<figure class="fig${x.wide ? ' wide' : ''}" onclick="openViewer('${x.f.id}', false, ${esc(JSON.stringify(items.map(i => i.f.id)))})">
    <img loading="lazy" src="${thumb(x.f)}" alt=""><figcaption class="${isAr(x.caption || '') ? 'rtl' : ''}">${esc(x.caption || x.f.name)}</figcaption></figure>`).join('')}</div>`;
}
function section(s) {
  return `<section class="sec">
    ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ''}
    ${s.kpis ? `<div class="kpis">${s.kpis.map(k => `<div class="kpi"><div class="v">${esc(k.v)}</div><div class="l">${esc(k.l)}</div></div>`).join('')}</div>` : ''}
    ${s.rows ? `<div class="rows">${s.rows.map(r => `<div class="k">${esc(r.k)}</div><div class="v" dir="auto">${esc(r.v)}</div>`).join('')}</div>` : ''}
    ${s.bullets ? `<ul class="bullets">${s.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
    ${s.table ? `<div class="tblwrap"><table class="tbl"><thead><tr>${s.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${s.table.rows.map(r => `<tr${r.hi ? ' class="hi"' : ''}>${(r.cells || r).map((c, i) => `<td class="${s.table.num && s.table.num.includes(i) ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
    ${figs(s.figs)}
  </section>`;
}

function renderAll() {
  if (META.title) document.getElementById('title').textContent = META.title;
  document.getElementById('lead').textContent = META.lead || '';
  // Overview
  document.getElementById('panel-over').innerHTML =
    (META.kpis ? `<div class="kpis">${META.kpis.map(k => `<div class="kpi"><div class="v">${esc(k.v)}</div><div class="l">${esc(k.l)}</div></div>`).join('')}</div>` : '') +
    (META.overview || []).map(section).join('') +
    (META.updated ? `<p class="empty" style="font-size:.74rem">Dossier written ${esc(META.updated)} from the folder <code>0. MS\\0000. sin el fil 2292 bonvin</code>.</p>` : '');
  // Tenants & rent
  const T = META.tenancies || [];
  document.getElementById('n-lease').textContent = T.length || '';
  const groupOf = t => { const g = FILES.find(f => t.folder && f.path.startsWith('CONTRACTS/' + t.folder + '/')); return g ? g.group : null; };
  document.getElementById('panel-lease').innerHTML =
    (META.leaseIntro || []).map(section).join('') +
    `<section class="sec"><h3>Every tenancy</h3><p class="sub">Oldest first. The folder link opens that lease's papers under Documents.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Period</th><th>Tenant · use</th><th>Rent</th><th>Terms</th><th>Notes</th></tr></thead><tbody>
      ${T.map(t => { const g = groupOf(t); return `<tr class="${t.current ? 'hi' : ''}">
        <td style="white-space:nowrap">${esc(t.start || '?')}<span class="dim">→ ${esc(t.end || (t.current ? 'now' : '?'))}</span></td>
        <td><b>${esc(t.tenant)}</b> ${t.current ? '<span class="tag cur">current</span>' : t.status && /proposal/i.test(t.status) ? '<span class="tag">proposal</span>' : ''}<span class="dim">${esc(t.use || '')}</span>
          ${g ? `<span class="dim"><a href="#" onclick="filterDocs(${esc(JSON.stringify(g))});return false;">📁 papers</a></span>` : ''}</td>
        <td style="white-space:nowrap">${esc(t.rent || '—')}</td>
        <td>${esc([t.payment, t.increase, t.deposit && 'deposit ' + t.deposit, t.equipment].filter(Boolean).join(' · '))}<span class="dim">${esc(t.status || '')}</span></td>
        <td>${esc(t.notes || '')}</td></tr>`; }).join('')}
      </tbody></table></div></section>` +
    (META.statement ? section({ title: META.statement.title, sub: [META.statement.period, META.statement.summary].filter(Boolean).join(' — '),
      table: META.statement.lines && META.statement.lines.length ? { head: ['Date', 'Label', 'Amount', 'Balance'], num: [2, 3], rows: META.statement.lines.map(l => [l.date, l.label, l.amount, l.balance]) } : null }) : '') +
    (META.leaseOutro || []).map(section).join('');
  // Office plan
  document.getElementById('panel-office').innerHTML = (META.office || []).map(section).join('') || '<p class="empty">No office plan.</p>';
  // Photos — every image in the folder, newest folder first, as a wall
  const imgs = FILES.filter(isImg).filter(f => /photos/i.test(f.group));
  document.getElementById('n-photos').textContent = imgs.length || '';
  const pg = []; for (const f of imgs) { let g = pg.find(x => x.name === f.group); if (!g) pg.push(g = { name: f.group, files: [] }); g.files.push(f); }
  pg.sort((a, b) => b.name.localeCompare(a.name));
  document.getElementById('panel-photos').innerHTML = pg.map(g => `<h2>${esc(g.name)}</h2><div class="gal">${g.files.map(f =>
    `<figure class="fig" onclick="openViewer('${f.id}', false, ${esc(JSON.stringify(g.files.map(x => x.id)))})"><img loading="lazy" src="${thumb(f)}" alt=""></figure>`).join('')}</div>`).join('') || '<p class="empty">No photos.</p>';
  renderDocs();
}

// ── Documents ───────────────────────────────────────────────────────────────
function filterDocs(group) { document.getElementById('q').value = group; setTab('docs'); renderDocs(); window.scrollTo({ top: 0 }); }
function renderDocs() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  const shown = FILES.filter(f => terms.every(t => (f.path + ' ' + f.group).toLowerCase().includes(t)));
  document.getElementById('n-docs').textContent = FILES.length || '';
  const groups = []; for (const f of shown) { let g = groups.find(x => x.name === f.group); if (!g) groups.push(g = { name: f.group, files: [] }); g.files.push(f); }
  const card = (f, g) => {
    const sub = f.path.split('/').slice(1, -1).join(' / ');   // the folder under the group, when it has one
    return `<div class="file">
      <a class="open" href="#${esc(f.id)}" onclick="openViewer('${esc(f.id)}', false, ${esc(JSON.stringify(g.files.map(x => x.id)))});return false;">
        <div class="ico">${ICON(f.mime)}</div>
        <div style="flex:1;min-width:0">
          <div class="name ${isAr(f.name) ? 'rtl' : ''}">${esc(f.name.replace(/\.[a-z0-9]+$/i, ''))}</div>
          <div class="meta">${esc(f.name.split('.').pop().toUpperCase())} · ${kb(f.size)} · ${esc((f.mtime || '').slice(0, 10))}${sub ? ' · ' + esc(sub) : ''}</div>
        </div>
      </a>
      <a class="dl" href="${fileUrl(f, '&dl=1')}" title="Download">↓</a>
    </div>`; };
  document.getElementById('groups').innerHTML = groups.map(g => `<h2>${esc(g.name)} <span style="letter-spacing:0">· ${g.files.length}</span></h2><div class="files">${g.files.map(f => card(f, g)).join('')}</div>`).join('')
    || '<p class="empty">Nothing matches.</p>';
}

// ── Viewer: photos, PDFs, Word, Excel in the page; the rest downloads ──────
window.addEventListener('hashchange', () => { if (location.hash.length > 1) openViewer(location.hash.slice(1), true); else closeViewer(true); });
window.addEventListener('keydown', e => { if (!document.getElementById('viewer').classList.contains('on')) return;
  if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
const authed = url => fetch(url, { headers: { Authorization: 'Bearer ' + (Admin.session || '') } }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
const loadScript = (src, glob) => window[glob] ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('could not load ' + glob)); document.head.appendChild(s); });
let CUR = null;
function step(d) { const i = LIST.indexOf(CUR); if (i < 0) return; const n = LIST[(i + d + LIST.length) % LIST.length]; if (n) openViewer(n, false, LIST, true); }

async function openViewer(id, fromHash, list, replace) {
  const f = FILES.find(x => x.id === id);
  if (!f) return;
  if (list) LIST = list; else if (!LIST.includes(id)) LIST = [id];
  CUR = id;
  if (!fromHash) history[replace || document.getElementById('viewer').classList.contains('on') ? 'replaceState' : 'pushState'](null, '', '#' + id);
  const v = document.getElementById('viewer'), body = document.getElementById('vbody');
  const url = fileUrl(f);
  document.getElementById('vtitle').textContent = f.path.replace(/\//g, ' / ');
  document.getElementById('vtab').href = url;
  document.getElementById('vdl').href = url + '&dl=1';
  document.getElementById('vprev').style.display = document.getElementById('vnext').style.display = LIST.length > 1 ? '' : 'none';
  v.classList.add('on'); document.body.style.overflow = 'hidden';
  body.innerHTML = '<div class="vstatus">Loading…</div>';
  const fallback = (e, why) => { body.innerHTML = `<div class="vcard"><div class="big">${ICON(f.mime)}</div><div style="font-weight:600">${esc(f.name)}</div>
      <p>${why || 'This file cannot be shown here' + (e ? ' (' + esc(e.message) + ')' : '') + ' — download it and open it on the laptop.'}</p>
      <a href="${url}" target="_blank" rel="noopener">Open</a><a href="${url}&dl=1">↓ Download (${kb(f.size)})</a></div>`; };
  try {
    if (isImg(f)) {
      // the full photo (big ones come by a short signed link) — the preview shows at once while it loads
      body.innerHTML = `<img src="${thumb(f)}" alt="">`;
      if (f.previewKey) { const big = new Image(); big.onload = () => { if (CUR === id) body.querySelector('img').src = big.src; }; big.src = url; }
    } else if (/pdf/.test(f.mime)) {
      if (f.size > 4e6) return fallback(null, `A ${kb(f.size)} scan — too big to draw here; Open shows it in the browser's own PDF viewer.`);
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: await authed(url) }).promise;
      if (CUR !== id) return;
      body.innerHTML = '';
      const width = Math.min(body.clientWidth - 24, 900);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const scale = width / page.getViewport({ scale: 1 }).width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: scale * dpr });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height; c.style.width = width + 'px';
        if (CUR !== id) return;
        body.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    } else if (/wordprocessingml/.test(f.mime)) {
      if (f.size > 4e6) return fallback(null, `A ${kb(f.size)} Word file (mostly pictures) — download it to open in Word.`);
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', 'mammoth');
      const out = await mammoth.convertToHtml({ arrayBuffer: await authed(url) });
      if (CUR !== id) return;
      const ar = isAr(out.value.replace(/<[^>]+>/g, '').slice(0, 400));
      body.innerHTML = `<div class="vdoc${ar ? ' rtl' : ''}">${out.value || '<p><i>No text in this file (pictures only).</i></p>'}</div>
        <p class="vstatus">Shown as text. <a href="${url}&dl=1" style="color:var(--amber)">Download the Word file</a> for the exact layout.</p>`;
    } else if (/spreadsheetml/.test(f.mime)) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'XLSX');
      const wb = XLSX.read(await authed(url), { type: 'array' });
      if (CUR !== id) return;
      body.innerHTML = wb.SheetNames.map(n => `<h2 style="text-align:center">${esc(n)}</h2>` + XLSX.utils.sheet_to_html(wb.Sheets[n], { header: '', footer: '' })
        .replace(/<table/, '<table class="vsheet"')).join('');
    } else fallback();
  } catch (e) { fallback(e); }
}
function closeViewer(fromHash) {
  CUR = null;
  document.getElementById('viewer').classList.remove('on'); document.body.style.overflow = '';
  document.getElementById('vbody').innerHTML = '';
  if (!fromHash && location.hash) history.replaceState(null, '', location.pathname + location.search);
}
</script>
</body>
</html>
