<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Decisions · Shift Hub</title>
<link rel="icon" href="/icons/hub-192.png">
<link rel="manifest" href="/hub-manifest.json">
<link rel="apple-touch-icon" href="/icons/hub-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--green:#a6e3a1;--red:#f38ba8;}
  *{box-sizing:border-box;} body{margin:0;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--surface0);gap:12px;}
  .hleft{display:flex;align-items:center;gap:16px;min-width:0;} .wordmark{font-family:"Century Gothic","URW Gothic",sans-serif;letter-spacing:.28em;font-weight:600;font-size:.95rem;white-space:nowrap;} .wordmark span{color:var(--amber);}
  .who{font-size:.78rem;color:var(--sub);white-space:nowrap;} .who a{color:var(--overlay0);text-decoration:none;margin-left:10px;}
  main{max-width:760px;margin:0 auto;padding:22px 18px 60px;}
  h1{font-size:1.3rem;margin:0 0 4px;} .muted{color:var(--sub);font-size:.9rem;} .small{font-size:.8rem;color:var(--overlay0);}
  a.card{display:block;background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;padding:16px 18px;margin:12px 0;text-decoration:none;color:var(--text);}
  a.card:hover{border-color:var(--amber);} .t{font-weight:600;font-size:1.02rem;} .amt{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;}
  .st{margin-top:6px;font-size:.86rem;} .st.open{color:var(--amber);} .st.ok{color:var(--green);} .st.held{color:var(--red);}
</style>
</head>
<body>
<header><div class="hleft" style="flex-direction:column;align-items:flex-start;gap:6px"><div class="wordmark">SHIFT <span>GROUP</span></div><span id="crumbs"></span></div><div class="who" id="who"></div></header>
<main>
  <h1>Decisions</h1>
  <p class="muted">Questions Mario put to you. Open one, read it, tap Approve or Hold — he gets your answer on Telegram at once.</p>
  <div id="list"><p class="muted">Loading…</p></div>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/admin-shared.js"></script>
<script src="/phone-preview.js"></script>
<script>
const esc = Admin.esc;
const money = (v, c) => (c === 'USD' ? '$ ' : c + ' ') + (+v || 0).toLocaleString('en-US');
const when = at => at ? new Date(at).toLocaleString('en-GB', { timeZone: 'Asia/Beirut', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
Admin.require(null, async me => {
  Admin.crumbs([['Decisions']]);
  document.getElementById('who').innerHTML = `<span>${esc(me.name || me.email)}</span>` + (me.local ? '' : '<a href="#" onclick="Admin.signOut();return false;">Sign out</a>');
  try {
    const list = await Admin.api('GET', '/api/decisions');
    const open = list.filter(d => d.status === 'open'), done = list.filter(d => d.status !== 'open');
    const card = d => { const dec = d.decision || {}; return `<a class="card" href="/decide/${esc(d.id)}"><div class="t">${esc(d.title)}${d.amount ? ` <span class="amt">· ${money(d.amount, d.currency)}</span>` : ''}</div>
      ${d.lines && d.lines.length ? `<div class="small" style="margin-top:4px">${esc(d.lines.join(' · '))}</div>` : ''}
      <div class="st ${d.status === 'open' ? 'open' : dec.ok ? 'ok' : 'held'}">${d.status === 'open' ? '⏳ waiting for your answer · asked ' + when(d.createdAt) : (dec.ok ? '✅ approved' : '⏸ on hold') + ' · ' + when(dec.at) + (dec.note ? ' · “' + esc(dec.note) + '”' : '')}</div></a>`; };
    document.getElementById('list').innerHTML = (open.length ? `<h2 class="small" style="letter-spacing:.14em;text-transform:uppercase;margin:18px 0 4px">Waiting for you</h2>` + open.map(card).join('') : '<p class="muted">Nothing waiting for you right now.</p>')
      + (done.length ? `<h2 class="small" style="letter-spacing:.14em;text-transform:uppercase;margin:22px 0 4px">Answered</h2>` + done.map(card).join('') : '');
  } catch (e) { document.getElementById('list').innerHTML = `<p class="muted">Could not load: ${esc(e.message)}</p>`; }
});
</script>
</body>
</html>
