<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<title>Solar Plants · Shift Group</title>
<link rel="icon" href="/icons/hub-192.png">
<style>
  :root{--base:#1e1e2e;--mantle:#181825;--surface0:#313244;--surface1:#45475a;--text:#cdd6f4;--sub:#a6adc8;--overlay0:#6c7086;--amber:#F2A93B;--green:#a6e3a1;--blue:#89b4fa;--red:#f38ba8;--peach:#fab387;}
  *{box-sizing:border-box;}
  html,body{background:var(--base);}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--surface0);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1.05rem;}
  .wordmark span{color:var(--amber);} .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  .hback{color:var(--amber);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border:1px solid var(--surface0);border-radius:8px;}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:1.25rem;font-weight:600;margin:0 0 4px;} .lead{color:var(--sub);font-size:.82rem;margin:0 0 12px;line-height:1.5;}
  .src{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{font-size:.74rem;padding:5px 10px;border-radius:999px;border:1px solid var(--surface0);background:var(--mantle);color:var(--sub);}
  .chip.ok{border-color:rgba(166,227,161,.4);color:var(--green);} .chip.no{border-color:rgba(243,139,168,.4);color:var(--red);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;padding:11px 13px;}
  .kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;} .kpi span{font-size:.66rem;color:var(--overlay0);text-transform:uppercase;letter-spacing:.06em;}
  .kpi small{display:block;color:var(--sub);font-size:.68rem;margin-top:2px;}
  .kpi.g b{color:var(--green);} .kpi.r b{color:var(--red);} .kpi.p b{color:var(--peach);} .kpi.a b{color:var(--amber);}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .bar button,.bar input{background:var(--mantle);color:var(--text);border:1px solid var(--surface0);border-radius:999px;padding:6px 12px;font-size:.78rem;font-family:inherit;cursor:pointer;}
  .bar input{border-radius:8px;cursor:text;flex:1;min-width:140px;max-width:260px;}
  .bar button.on{background:var(--amber);color:#1e1e2e;border-color:var(--amber);font-weight:600;}
  .bar .sp{flex:1;}
  .card{background:var(--mantle);border:1px solid var(--surface0);border-radius:14px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.8rem;}
  th{font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--overlay0);font-weight:600;text-align:right;padding:8px;border-bottom:1px solid var(--surface0);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  td{padding:8px;border-bottom:1px solid var(--surface0);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  td small{display:block;color:var(--overlay0);font-size:.64rem;}
  td.name{white-space:normal;min-width:180px;}
  tr.row{cursor:pointer;} tr.row:hover td{background:var(--surface0);}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;}
  .st i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--overlay0);}
  .st.online i{background:var(--green);} .st.partial i{background:var(--peach);} .st.offline i,.st.alarm i{background:var(--red);}
  .st.partial{color:var(--peach);} .st.offline,.st.alarm{color:var(--red);}
  tr.det>td{background:rgba(49,50,68,.35);padding:10px 12px;white-space:normal;}
  .dev{width:100%;font-size:.76rem;} .dev td,.dev th{padding:6px;border-bottom:1px solid var(--surface0);}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .links a,.links button{color:var(--amber);background:none;border:1px solid var(--surface0);border-radius:8px;padding:5px 10px;font-size:.74rem;text-decoration:none;cursor:pointer;font-family:inherit;}
  .tag{font-size:.6rem;padding:1px 6px;border-radius:999px;border:1px solid var(--surface1);color:var(--sub);margin-left:4px;vertical-align:middle;}
  .note{background:var(--mantle);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.78rem;color:var(--sub);line-height:1.55;margin-top:14px;}
  .note b{color:var(--text);font-weight:600;}
  .err{color:var(--red);font-size:.85rem;margin:14px 0;}
  .muted{color:var(--overlay0);}
  @media (max-width:640px){
    header{padding:12px 16px;} main{padding:14px 12px 40px;}
    h1{font-size:1.05rem;} .lead{font-size:.76rem;}
    .kpis{grid-template-columns:1fr 1fr 1fr;gap:6px;} .kpi{padding:8px 10px;} .kpi b{font-size:1.05rem;} .kpi small{display:none;}
    table{font-size:.74rem;} th{padding:7px 4px;font-size:.54rem;} td{padding:8px 4px;} td.name{min-width:0;}
    td:first-child,th:first-child{padding-left:10px;} td:last-child,th:last-child{padding-right:10px;}
    .hide-sm{display:none;} .st b{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">SHIFT <span>GROUP</span><small>SOLAR · PLANTS</small></div>
  <a class="hback" href="/" id="hubLink">Hub</a>
</header>
<main>
  <h1 id="title">Solar plants</h1>
  <p class="lead" id="lead">Every plant on DeyeCloud and Solarman, read live (refreshed every 2 minutes).</p>
  <div class="src" id="src"></div>
  <div class="err" id="err"></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar" id="bar" hidden>
    <button data-f="all" class="on">All</button><button data-f="bad">Problems</button><button data-f="online">Online</button><button data-f="nodevice">No device</button>
    <input id="q" type="search" placeholder="Search a plant…"><span class="sp"></span><button id="refresh">↻ Refresh</button>
  </div>
  <div class="card"><table id="tbl"></table></div>
  <div class="note" id="note" hidden></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.search);
  const SHARE = P.get('k') ? { src: P.get('src') || 'deye', id: P.get('id'), k: P.get('k') } : null;
  const LABEL = { online: 'Online', partial: 'Partly offline', offline: 'Offline', alarm: 'Alarm', nodevice: 'No device' };
  const RANK = { offline: 0, alarm: 0, partial: 1, online: 2, nodevice: 3 };
  const DETAIL = { 'deye:61244864': '/cpr', 'deye:62112463': '/mahab' };   // plants with their own hub page
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f0 = v => v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString('en-US');
  const f1 = v => v == null || isNaN(v) ? '—' : (Math.round(v * 10) / 10).toLocaleString('en-US');
  const ago = iso => {
    if (!iso) return '—';
    const m = (Date.now() - new Date(iso)) / 60000;
    if (m < 15) return 'now';
    if (m < 60) return Math.round(m) + ' min ago';
    if (m < 48 * 60) return Math.round(m / 60) + ' h ago';
    return Math.round(m / 1440) + ' days ago';
  };
  const when = iso => iso ? new Date(iso).toLocaleString('en-GB', { timeZone: 'Asia/Beirut', day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
  let D = null, filter = 'all', open = {}, DEV = {};
  // a plant silent for over 2 h keeps its last power and its last day's kWh on DeyeCloud — not shown as now / today
  const live = p => !!p.last && Date.now() - new Date(p.last) < 2 * 3600e3;

  async function load(fresh) {
    $('err').textContent = '';
    const qs = SHARE ? `?src=${encodeURIComponent(SHARE.src)}&id=${encodeURIComponent(SHARE.id)}&k=${encodeURIComponent(SHARE.k)}` : (fresh ? '?fresh=1' : '');
    const r = await fetch('/api/plants' + qs, { credentials: 'same-origin' });
    if (r.status === 401) { $('err').textContent = SHARE ? 'This link is not valid.' : 'Sign in to the Shift Hub first (admins only).'; return; }
    D = await r.json();
    if (D.error) { $('err').textContent = D.error; return; }
    if (SHARE) return shareView();
    $('bar').hidden = false; $('note').hidden = false;
    const S = D.sources || {};
    const chip = (n, s) => !s ? '' : s.ok ? `<span class="chip ok">✓ ${n} · ${s.n} plants${s.mode ? ' · ' + (s.mode === 'api' ? 'OpenAPI' : 'web sign-in') : ''}</span>`
      : `<span class="chip no">✗ ${n} · ${esc(s.connected === false ? 'not connected' : s.error)}</span>`;
    $('src').innerHTML = chip('DeyeCloud', S.deye) + chip('Solarman', S.solarman) + `<span class="chip">read ${when(D.at)}</span>`;
    const ps = D.plants, by = s => ps.filter(p => p.status === s).length;
    const sum = k => ps.reduce((a, p) => a + (p.status !== 'nodevice' && p[k] != null && (k === 'kwp' || k === 'month' || k === 'year' || live(p)) ? +p[k] : 0), 0);
    $('kpis').innerHTML =
      `<div class="kpi"><span>Plants</span><b>${ps.length}</b><small>${f1(sum('kwp'))} kWp</small></div>` +
      `<div class="kpi g"><span>Online</span><b>${by('online')}</b></div>` +
      `<div class="kpi p"><span>Partly offline</span><b>${by('partial')}</b></div>` +
      `<div class="kpi r"><span>Offline</span><b>${by('offline') + by('alarm')}</b><small>${by('nodevice')} without a device</small></div>` +
      `<div class="kpi a"><span>Power now</span><b>${f0(sum('nowKw'))} kW</b></div>` +
      `<div class="kpi"><span>Today</span><b>${f0(sum('today'))} kWh</b><small>month ${f0(sum('month'))} · year ${f0(sum('year'))}</small></div>`;
    render();
    $('note').innerHTML = `<b>Sign-ins</b> stay on the hub's server (Vercel): DeyeCloud = DEYE_USER / DEYE_PASS, Solarman = SOLARMAN_USER / SOLARMAN_PASS (+ SOLARMAN_APP_ID / SOLARMAN_APP_SECRET for Solarman's official API). ` +
      `<b>Alerts</b>: a plant that stays partly or fully offline for an hour sends a Telegram message, and another when it is back. ` +
      `<b>Share</b>: tap a plant → "Copy client link" gives a read-only page for that plant alone.`;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    let ps = D.plants.filter(p => (!q || p.name.toLowerCase().includes(q) || p.id.includes(q)) &&
      (filter === 'all' ? true : filter === 'bad' ? RANK[p.status] <= 1 : p.status === filter));
    ps = ps.slice().sort((a, b) => (RANK[a.status] ?? 4) - (RANK[b.status] ?? 4) || (b.kwp || 0) - (a.kwp || 0));
    let h = `<tr><th>Plant</th><th class="hide-sm">kWp</th><th>Status</th><th>Now<small class="hide-sm">kW</small></th><th>Today<small class="hide-sm">kWh</small></th><th class="hide-sm">Month</th><th class="hide-sm">Year</th><th class="hide-sm">Last data</th></tr>`;
    for (const p of ps) {
      const k = p.src + ':' + p.id;
      h += `<tr class="row" data-k="${k}"><td class="name">${esc(p.name)}${p.src === 'solarman' ? '<span class="tag">Solarman</span>' : ''}<small>${p.status === 'online' ? '' : 'last data ' + ago(p.last) + ' · '}${f1(p.kwp)} kWp</small></td>` +
        `<td class="hide-sm">${f1(p.kwp)}</td><td><span class="st ${p.status}"><i></i><b>${LABEL[p.status] || esc(p.status)}</b></span></td>` +
        `<td>${live(p) ? f1(p.nowKw) : '—'}</td><td>${live(p) ? f1(p.today) : '—'}</td><td class="hide-sm">${f0(p.month)}</td><td class="hide-sm">${f0(p.year)}</td><td class="hide-sm">${ago(p.last)}</td></tr>`;
      if (open[k]) h += `<tr class="det"><td colspan="8">${devHtml(p)}</td></tr>`;
    }
    if (!ps.length) h += `<tr><td colspan="8" class="muted">No plant matches.</td></tr>`;
    $('tbl').innerHTML = h;
  }

  function devHtml(p, share) {
    const k = p.src + ':' + p.id, d = DEV[k];
    let h = '';
    if (!d) h = '<span class="muted">Reading the devices…</span>';
    else if (d.error) h = `<span class="err">${esc(d.error)}</span>`;
    else if (!d.length) h = '<span class="muted">No devices on this plant.</span>';
    else h = `<table class="dev"><tr><th>Device</th><th>Serial</th><th>Status</th><th>Now kW</th><th class="hide-sm">Today kWh</th><th>Last data</th></tr>` +
      d.map(x => `<tr><td>${esc(x.type)}${x.role ? ' · ' + esc(x.role) : ''}${x.ratedKw ? ' <small>' + f0(x.ratedKw) + ' kW</small>' : ''}</td><td>${esc(x.sn)}${x.logger ? '<small>logger ' + esc(x.logger) + '</small>' : ''}</td>` +
        `<td><span class="st ${x.online ? 'online' : 'offline'}"><i></i>${x.online ? 'online' : 'offline'}</span></td><td>${x.kw != null ? f1(x.kw) : ''}</td><td class="hide-sm">${x.today != null ? f1(x.today) : ''}</td>` +
        `<td>${when(x.last)}${!x.online && x.last ? '<small>' + ago(x.last) + '</small>' : ''}</td></tr>`).join('') + `</table>`;
    if (!share) {
      const url = `${location.origin}/plants?src=${p.src}&id=${p.id}&k=${p.share}`;
      h += `<div class="links">${DETAIL[k] ? `<a href="${DETAIL[k]}">Open its page →</a>` : ''}<button data-copy="${esc(url)}">Copy client link</button></div>`;
    }
    return h;
  }

  async function devices(p, rerender) {
    const k = p.src + ':' + p.id;
    try {
      const qs = `?src=${p.src}&id=${p.id}` + (SHARE ? `&k=${encodeURIComponent(SHARE.k)}` : '');
      const r = await fetch('/api/plants/devices' + qs, { credentials: 'same-origin' }); const j = await r.json();
      DEV[k] = j.error ? { error: j.error } : j.devices;
    } catch (e) { DEV[k] = { error: String(e.message || e) }; }
    rerender();
  }

  // a client's read-only page: their plant and its devices, nothing else
  function shareView() {
    $('hubLink').hidden = true;
    const p = D.plants[0];
    if (!p) { $('err').textContent = 'Plant not found.'; return; }
    $('title').textContent = p.name;
    $('lead').textContent = `${f1(p.kwp)} kWp · read live from ${p.src === 'solarman' ? 'Solarman' : 'DeyeCloud'} · ${when(D.at)}`;
    $('kpis').innerHTML =
      `<div class="kpi ${p.status === 'online' ? 'g' : p.status === 'partial' ? 'p' : 'r'}"><span>Status</span><b>${LABEL[p.status] || esc(p.status)}</b><small>last data ${ago(p.last)}</small></div>` +
      `<div class="kpi a"><span>Power now</span><b>${f1(p.nowKw)} kW</b></div>` +
      `<div class="kpi"><span>Today</span><b>${f1(p.today)} kWh</b></div>` +
      `<div class="kpi"><span>This month</span><b>${f0(p.month)} kWh</b></div>` +
      `<div class="kpi"><span>This year</span><b>${f0(p.year)} kWh</b></div>` +
      `<div class="kpi"><span>Since the start</span><b>${f0(p.total)} kWh</b></div>`;
    const draw = () => { $('tbl').innerHTML = `<tr><td style="white-space:normal">${devHtml(p, true)}</td></tr>`; };
    draw(); devices(p, draw);
  }

  $('bar').addEventListener('click', e => {
    const b = e.target.closest('button[data-f]'); if (!b) return;
    filter = b.dataset.f; [...$('bar').querySelectorAll('button[data-f]')].forEach(x => x.classList.toggle('on', x === b)); render();
  });
  $('q').addEventListener('input', () => render());
  $('refresh').addEventListener('click', () => { DEV = {}; load(true); });
  $('tbl').addEventListener('click', e => {
    const c = e.target.closest('button[data-copy]');
    if (c) { navigator.clipboard.writeText(c.dataset.copy).then(() => { c.textContent = 'Copied ✓'; setTimeout(() => { c.textContent = 'Copy client link'; }, 1500); }); return; }
    const tr = e.target.closest('tr.row'); if (!tr || SHARE) return;
    const k = tr.dataset.k; open[k] = !open[k]; render();
    if (open[k] && !DEV[k]) devices(D.plants.find(p => p.src + ':' + p.id === k), render);
  });
  load().catch(e => { $('err').textContent = String(e.message || e); });
  setInterval(() => { if (!document.hidden && !SHARE) load(); }, 2 * 60000);
})();
</script>
<script src="/phone-preview.js"></script>
</body>
</html>
