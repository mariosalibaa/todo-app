<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0f2f5"><title>Shift WhatsApp · Shift Hub</title>
<link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.json">
<style>
  /* Light, WhatsApp-like palette (Mario, 2026-09-12): the site chat replaces the WhatsApp groups, so it should feel like them */
  :root{--base:#efeae2;--mantle:#ffffff;--crust:#ffffff;--surface0:#e2ddd5;--surface1:#cfc9bf;--text:#111b21;--sub:#54656f;--overlay0:#8696a0;--amber:#c47f0a;--green:#1f7a3a;--red:#c0392b;--blue:#027eb5;--bar:#f0f2f5;--me:#d9fdd3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--surface0);position:sticky;top:0;z-index:50;background:var(--bar);}
  .hleft{display:flex;align-items:center;gap:16px;}
  .hback{color:var(--amber);text-decoration:none;font-size:.9rem;font-weight:600;white-space:nowrap;padding:7px 12px;border:1px solid var(--surface0);border-radius:8px;}
  .hback:hover{background:var(--surface0);}
  .wordmark{font-family:"Century Gothic",CenturyGothic,AppleGothic,system-ui,sans-serif;letter-spacing:.2em;font-size:1rem;}
  .wordmark span{color:var(--amber);}
  a.wordmark{color:inherit;text-decoration:none;}
  .wordmark small{display:block;letter-spacing:.3em;font-size:.55rem;color:var(--overlay0);margin-top:2px;}
  .whofoot{display:none;text-align:center;font-size:.74rem;color:var(--overlay0);padding:24px 16px 8px;} .whofoot a{color:var(--sub);margin-left:10px;}
  /* phone: wordmark on top, ‹ Back + path under it; the e-mail moves to the bottom of the page */
  @media (max-width:640px){
    header{padding:10px 14px;} .hleft{flex-direction:column;align-items:flex-start;gap:8px;} #crumbs{order:2;} .wordmark{order:1;}
    header .who{display:none;} .whofoot{display:block;}
  }
  .who{font-size:.78rem;color:var(--sub);display:flex;gap:12px;align-items:center;}
  .who a{color:var(--overlay0);text-decoration:none;} .who a:hover{color:var(--text);}
  main{display:flex;height:calc(100vh - var(--hdr,61px));overflow:hidden;}
  .pane{display:flex;flex-direction:column;min-width:0;}
  .pane.list{width:360px;flex:none;background:var(--mantle);border-right:1px solid var(--surface0);overflow-y:auto;}
  .pane.chat{flex:1;overflow-y:auto;padding-bottom:90px;}
  .pane.list h1{font-size:1.6rem;margin:14px 16px 8px;}
  .search{padding:0 12px 8px;} .search input{width:100%;box-sizing:border-box;background:var(--bar);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:.95rem;color:var(--text);outline:none;}
  .chats{flex:1;}
  .chat-row{display:grid;grid-template-columns:50px 1fr auto;column-gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--surface0);}
  .chat-row:hover,.chat-row.on{background:var(--base);}
  .chat-row .av{width:50px;height:50px;border-radius:50%;background:#dfe5e7;color:#54656f;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.15rem;}
  .chat-row .av.me{background:#c47f0a;color:#fff;}
  .chat-row > div:nth-child(2){min-width:0;}
  .chat-row .n{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-row .p{font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .chat-row .t{font-size:.72rem;color:var(--overlay0);align-self:start;margin-top:3px;text-align:right;} .chat-row .t .pin{display:block;margin-top:8px;}
  .chatbar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--surface0);position:sticky;top:0;z-index:5;}
  .chatbar .back{display:none;color:var(--blue);text-decoration:none;font-size:1.3rem;padding:0 4px;}
  .chatbar .av{width:38px;height:38px;border-radius:50%;background:#dfe5e7;color:#54656f;display:flex;align-items:center;justify-content:center;font-weight:600;} .chatbar .av.me{background:#c47f0a;color:#fff;}
  .chatbar .n{font-weight:600;} .chatbar .s{font-size:.72rem;color:var(--sub);}
  .composer{left:360px;}
  @media (max-width:800px){
    main{display:block;height:auto;overflow:visible;}
    .pane.list{width:auto;border:0;} .pane.chat{padding-bottom:110px;}
    body.in-chat .pane.list{display:none;} body:not(.in-chat) .pane.chat{display:none;} body:not(.in-chat) .composer{display:none;}
    .chatbar .back{display:inline;} .composer{left:0;} .pull{display:block;}
    body.in-chat header{display:none;}   /* inside a chat the phone shows only the chat bar, like WhatsApp; ‹ goes back to the list */
  }
  .threads{position:relative;padding:12px 16px;border-bottom:1px solid var(--surface0);}
  .threads .pick{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--mantle);border:1px solid var(--amber);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;}
  .threads .pick small{color:var(--overlay0);font-weight:400;font-size:.8rem;}
  .threads .menu{position:absolute;left:16px;right:16px;top:calc(100% - 6px);z-index:60;background:var(--mantle);border:1px solid var(--surface0);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;}
  .threads .menu input{width:100%;box-sizing:border-box;background:var(--base);border:0;border-bottom:1px solid var(--surface0);color:var(--text);padding:10px 14px;font-size:.95rem;font-family:inherit;outline:none;}
  .threads .menu ul{list-style:none;margin:0;padding:6px 0;max-height:50vh;overflow-y:auto;}
  .threads .menu li{padding:9px 14px;cursor:pointer;font-size:.9rem;} .threads .menu li:hover,.threads .menu li.hi{background:var(--surface0);} .threads .menu li.on{color:var(--amber);}
  .feed{padding:12px 16px;display:flex;flex-direction:column;gap:10px;overflow-x:hidden;}
  .post{max-width:88%;background:var(--mantle);border:0;border-radius:12px;padding:8px 10px;font-size:.9rem;box-shadow:0 1px .5px rgba(11,20,26,.13);}
  .post.me{align-self:flex-end;background:var(--me);}
  .post .meta{font-size:.68rem;color:var(--overlay0);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
  .post img,.post video{max-width:100%;border-radius:10px;display:block;}
  .post .line{font-size:.72rem;margin-top:6px;padding:4px 8px;border-radius:8px;background:#fff3d6;color:#8a5a00;}
  .post .line.accepted{background:#dcf8c6;color:#0b6b2c;} .post .line.dismissed{background:#fde2e4;color:#b3261e;}
  .post .line a{color:inherit;}
  .post .err{font-size:.72rem;color:var(--red);margin-top:4px;}
  .day{align-self:center;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--overlay0);margin:8px 0 2px;}
  .composer{position:fixed;bottom:0;left:0;right:0;z-index:890;background:var(--bar);border-top:1px solid var(--surface0);padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
  /* Mario, 2026-09-12: the composer sits below the phone-preview button (z-index 900);
     at narrow widths the button would land on top of the composer row, so push it up instead. */
  body.has-composer .pp-btn{ bottom: 84px; }
  .composer .row{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;}
  .composer textarea{flex:1;min-height:42px;max-height:140px;resize:none;background:var(--mantle);color:var(--text);border:1px solid var(--surface0);border-radius:12px;padding:10px 12px;font:inherit;}
  .composer textarea:disabled{opacity:.5;}
  .composer button{background:var(--surface0);border:0;color:var(--text);border-radius:12px;width:42px;height:42px;font-size:1.15rem;cursor:pointer;flex:none;}
  .composer button:disabled{opacity:.4;cursor:default;}
  .composer button.send{background:#00a884;color:#fff;}
  .composer button.rec{background:var(--red);color:#fff;}
  .empty{color:var(--overlay0);text-align:center;padding:60px 20px;font-size:.9rem;}
  .post.gone{font-style:italic;color:var(--overlay0);}
  .post{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;} .post.gone,.post .line{user-select:text;}
  .sheet{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;}
  .sheet .card{width:min(520px,100%);background:var(--mantle);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
  .sheet .t{font-size:.78rem;color:var(--sub);text-align:center;padding:4px 8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sheet button{border:0;border-radius:12px;padding:13px;font:inherit;font-size:1rem;background:var(--base);color:var(--text);cursor:pointer;}
  .sheet button.del{color:var(--red);font-weight:600;}
  /* attendance card (worker chat): Start / Finish with the phone's location */
  .att{margin:10px 12px 0;background:var(--mantle);border-radius:14px;padding:10px 12px;box-shadow:0 1px .5px rgba(11,20,26,.13);}
  .att .row{display:flex;gap:10px;} .att .big{flex:1;border:0;border-radius:12px;padding:14px 8px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;color:#fff;}
  .att .big.start{background:#00a884;} .att .big.finish{background:#c0392b;} .att .big:disabled{opacity:.35;cursor:default;}
  .att .st{font-size:.8rem;color:var(--sub);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .att .st a{color:var(--blue);text-decoration:none;font-size:.78rem;}
  .att .lineState{font-size:.72rem;padding:2px 8px;border-radius:8px;background:#fff3d6;color:#8a5a00;} .att .lineState.accepted{background:#dcf8c6;color:#0b6b2c;} .att .lineState.dismissed{background:#fde2e4;color:#b3261e;}
  .post.tap{align-self:center;background:#fff;color:var(--sub);font-size:.8rem;padding:6px 12px;border-radius:10px;max-width:96%;text-align:center;} .post.tap b{color:var(--text);}
  .sheet .frm{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0 8px;} .sheet .frm label{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--sub);} .sheet .frm input,.sheet .frm select{font:inherit;font-size:.95rem;padding:8px;border:1px solid var(--surface0);border-radius:8px;background:var(--base);color:var(--text);}
  .sheet .frm label.w{grid-column:1/-1;}
  .sheet .list{max-height:40vh;overflow:auto;} .sheet .list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--surface0);font-size:.86rem;} .sheet .list .it small{display:block;color:var(--sub);}
  .pull{display:none;height:0;overflow:hidden;text-align:center;font-size:.74rem;color:var(--sub);line-height:48px;transition:height .15s;}
</style></head>
<body>
<header><div class="hleft"><span id="crumbs"></span><a class="wordmark" href="/" title="Back to the hub">SHIFT <span>GROUP</span><small>WHATSAPP</small></a><script>document.addEventListener("DOMContentLoaded", () => Admin.crumbs([['Shift WhatsApp']]));</script></div><div class="who" id="who"></div></header>
<main>
  <section class="pane list" id="listpane">
    <h1>Chats</h1>
    <div class="search"><input id="q" placeholder="Search" autocomplete="off" oninput="drawList()"></div>
    <div class="chats" id="chats"><div class="empty">Loading…</div></div>
    <div class="whofoot" id="whofoot"></div>
  </section>
  <section class="pane chat" id="chatpane">
    <div class="chatbar" id="chatbar"></div>
    <div class="att" id="att" hidden></div>
    <div class="feed" id="feed"><div class="empty">Pick a chat</div></div>
  </section>
</main>
<div class="composer"><div class="row">
  <button id="btnphoto" disabled onclick="pick('image/*','photo')" title="Photo">📷</button>
  <button id="btnvideo" disabled onclick="pick('video/*','video')" title="Video">🎬</button>
  <button id="recbtn" disabled onclick="toggleRec()" title="Voice note">🎤</button>
  <textarea id="text" disabled placeholder="Write, or talk with Flow" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText();}"></textarea>
  <button id="btnsend" disabled class="send" onclick="sendText()" title="Send">➤</button>
</div></div>
<input type="file" id="file" hidden>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/admin-shared.js"></script><script src="/phone-preview.js"></script>
<script>
// Mario, 2026-09-12: no background digest on the server any more — the page awaits
// POST .../digest right after a successful post (Vercel can freeze a function right
// after the reply), and again once at load for any post whose digest never ran.
const esc = Admin.esc, el = id => document.getElementById(id);
let threads = [], cur = '', posts = [], me = null;
const hhmm = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Beirut' });
const dayLabel = ymd => new Date(ymd + 'T12:00:00+03:00').toLocaleDateString('en-GB', { timeZone: 'Asia/Beirut', weekday: 'long', day: 'numeric', month: 'long' });

function setComposerEnabled(on) {
  ['text', 'btnsend', 'btnphoto', 'btnvideo', 'recbtn'].forEach(id => el(id).disabled = !on);
}
const ONE_DAY = 864e5;
function whenLabel(iso) {
  if (!iso) return ''; const d = new Date(iso), now = new Date();
  const dd = Math.floor((now.setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / ONE_DAY);
  return dd <= 0 ? hhmm(iso) : dd === 1 ? 'Yesterday' : dd < 7 ? d.toLocaleDateString('en-GB', { weekday: 'long' }) : d.toLocaleDateString('en-GB');
}
const initial = t => t.kind === 'general' ? 'M' : (t.name || '?').trim().charAt(0).toUpperCase();
function previewText(t) {
  const p = t.preview; if (!p) return '<span style="color:var(--overlay0)">No messages yet</span>';
  const who = p.by === me.email ? '' : esc((p.by || '').split('@')[0]) + ': ';
  const icon = p.kind === 'voice' ? '🎤 ' : p.kind === 'photo' ? '📷 ' : p.kind === 'video' ? '🎬 ' : '';
  const body = p.kind === 'deleted' ? '🚫 This message was deleted' : icon + (esc(p.text) || (p.kind === 'voice' ? 'Voice message' : p.kind === 'photo' ? 'Photo' : p.kind === 'video' ? 'Video' : ''));
  return who + body;
}
async function loadThreads() {
  threads = await Admin.api('GET', '/api/site/threads');
  // Mario's own chat (id general) stays pinned on top; the rest by last message
  threads.sort((a, b) => (a.kind === 'general' ? -1 : b.kind === 'general' ? 1 : (b.last || '').localeCompare(a.last || '')));
  drawList();
  setComposerEnabled(!!cur);
}
function drawList() {
  const q = (el('q').value || '').trim().toLowerCase();
  const L = threads.filter(t => !q || t.name.toLowerCase().includes(q));
  el('chats').innerHTML = L.map(t => `<div class="chat-row ${t.id === cur ? 'on' : ''}" onclick="open_('${esc(t.id)}')">
      <div class="av ${t.kind === 'general' ? 'me' : ''}">${initial(t)}</div>
      <div><div class="n">${esc(t.name)}</div><div class="p">${previewText(t)}</div></div>
      <div class="t">${whenLabel(t.last)}${t.kind === 'general' ? '<span class="pin">📌</span>' : ''}</div>
    </div>`).join('') || '<div class="empty">No chat matches</div>';
}
function drawChatBar() {
  const t = threads.find(x => x.id === cur); if (!t) { el('chatbar').innerHTML = ''; return; }
  el('chatbar').innerHTML = `<a class="back" href="#" onclick="showList();return false;">‹</a><div class="av ${t.kind === 'general' ? 'me' : ''}">${initial(t)}</div><div><div class="n">${esc(t.name)}</div><div class="s">${t.kind === 'general' ? 'Mario · site notes and receipts' : 'worker chat'}</div></div>`;
}
function showList() { document.body.classList.remove('in-chat'); history.replaceState(null, '', location.pathname); }
function open_(id) { cur = id; history.replaceState(null, '', '#' + id); document.body.classList.add('in-chat'); drawList(); drawChatBar(); setComposerEnabled(true); loadPosts(); loadDay(); }

// ── attendance: Start / Finish with location (part 2) ─────────────────────────
let day = null;
const isWorkerChat = () => { const t = threads.find(x => x.id === cur); return !!(t && t.kind === 'worker'); };
async function loadDay() {
  if (!isWorkerChat()) { el('att').hidden = true; return; }
  try { day = await Admin.api('GET', `/api/site/${cur}/day`); } catch { day = null; }
  drawDay();
}
function drawDay() {
  const a = el('att'); if (!isWorkerChat() || !day) { a.hidden = true; return; }
  a.hidden = false;
  const started = !!day.start, finished = !!day.finish;
  a.innerHTML = `<div class="row">
      <button class="big start" ${started ? 'disabled' : ''} onclick="tap('start')">▶ Start${started ? ' ' + esc(day.arrived) : ''}</button>
      <button class="big finish" ${finished ? 'disabled' : ''} onclick="tap('finish')">■ Finish${finished ? ' ' + esc(day.finished) : ''}</button></div>
    <div class="st"><span>${started ? (day.start.siteName ? '📍 ' + esc(day.start.siteName) : '📍 no site') + (day.hours ? ' · ' + day.hours + ' h' : '') : 'Tap Start when you arrive on site'}</span>
      <span>${day.line ? `<span class="lineState ${esc(day.line.state)}" title="${esc(day.line.description || '')}">day ${day.line.state === 'waiting' ? 'sent — waiting for Mario’s ✓' : day.line.state}</span> ` : ''}<a href="#" onclick="forgotTap();return false;">forgot a tap?</a>${me.admin ? ' · <a href="#" onclick="sitesSheet();return false;">sites</a>' : ''}</span></div>`;
}
function getLoc() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), () => res(null), { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  });
}
async function tap(kind, extra = {}) {
  const btn = document.querySelector('.att .big.' + kind); if (btn) { btn.disabled = true; btn.textContent = '📍 locating…'; }
  const loc = extra.manual ? null : await getLoc();
  try {
    const r = await Admin.api('POST', `/api/site/${cur}/tap`, { kind, loc, ...extra });
    replacePost(r.post); draw(); await loadDay(); loadThreads();
  } catch (e) {
    if (e.data && e.data.pick) return pickSite(kind, e.data.sites, e.data.error, extra);
    alert(e.message); drawDay();
  }
}
function pickSite(kind, sites, why, extra) {
  closeSheet();
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet';
  sh.innerHTML = `<div class="card"><div class="t">${esc(why || 'Which site?')}</div>${sites.map(s => `<button onclick="closeSheet();tap('${esc(kind)}', ${esc(JSON.stringify({ ...extra, siteId: s.id }))})">📍 ${esc(s.name)}</button>`).join('')}<button onclick="closeSheet();drawDay()">Cancel</button></div>`;
  sh.onclick = e => { if (e.target === sh) { closeSheet(); drawDay(); } };
  document.body.appendChild(sh);
}
// a tap he forgot: today or yesterday with the time he types (Mario: any day). It is marked "entered by hand".
function forgotTap() {
  closeSheet();
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Beirut' }), yest = new Date(Date.now() - 864e5).toLocaleDateString('en-CA', { timeZone: 'Asia/Beirut' });
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet';
  sh.innerHTML = `<div class="card"><div class="t">Enter a tap by hand — it will show as “entered by hand”</div>
    <div class="frm"><label>Which<select id="ft-kind"><option value="start">Start</option><option value="finish">Finish</option></select></label>
      <label>Day${me.admin ? `<input id="ft-date" type="date" value="${today}">` : `<select id="ft-date"><option value="${today}">Today</option><option value="${yest}">Yesterday</option></select>`}</label>
      <label class="w">Time<input id="ft-time" type="time" required></label></div>
    <button class="del" style="color:var(--green)" onclick="submitForgot()">Save</button><button onclick="closeSheet()">Cancel</button></div>`;
  sh.onclick = e => { if (e.target === sh) closeSheet(); };
  document.body.appendChild(sh);
}
async function submitForgot() {
  const kind = el('ft-kind').value, date = el('ft-date').value, time = el('ft-time').value;
  if (!date || !time) return alert('day and time');
  closeSheet(); await tap(kind, { manual: { date, time } });
}
// Mario: the sites and their radius; the analytic account is the project the day is charged to
async function sitesSheet() {
  closeSheet();
  const [sites, analytics] = await Promise.all([Admin.api('GET', '/api/site/sites'), Admin.api('GET', '/api/site/analytics')]);
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet';
  sh.innerHTML = `<div class="card"><div class="t">Sites — a Start inside the circle sets the day’s project</div>
    <div class="list">${sites.map(s => `<div class="it"><div><b>${esc(s.name)}</b><small>${esc(s.analyticName || 'no project')} · ${s.radiusM} m · ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</small></div><a href="#" style="color:var(--red)" onclick="delSite('${esc(s.id)}');return false;">remove</a></div>`).join('') || '<div class="it" style="color:var(--overlay0)">No site yet</div>'}</div>
    <div class="frm"><label class="w">Name<input id="s-name" placeholder="Ajaltoun 4193"></label>
      <label class="w">Project (Odoo analytic)<select id="s-an"><option value="">—</option>${analytics.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
      <label>Latitude<input id="s-lat" type="number" step="any"></label><label>Longitude<input id="s-lng" type="number" step="any"></label>
      <label>Radius (m)<input id="s-r" type="number" value="150"></label><label>&nbsp;<button onclick="useHere()" style="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--surface0);background:var(--base)">📍 use my position</button></label></div>
    <button class="del" style="color:var(--green)" onclick="saveSite()">Add site</button><button onclick="closeSheet()">Close</button></div>`;
  sh.onclick = e => { if (e.target === sh) closeSheet(); };
  document.body.appendChild(sh);
}
async function useHere() { const l = await getLoc(); if (!l) return alert('no location from this browser'); el('s-lat').value = l.lat.toFixed(6); el('s-lng').value = l.lng.toFixed(6); }
async function saveSite() {
  const an = el('s-an'); const body = { name: el('s-name').value, analyticId: an.value || null, analyticName: an.value ? an.options[an.selectedIndex].text : '', lat: el('s-lat').value, lng: el('s-lng').value, radiusM: el('s-r').value };
  try { await Admin.api('POST', '/api/site/sites', body); sitesSheet(); } catch (e) { alert(e.message); }
}
async function delSite(id) { if (!confirm('Remove this site?')) return; await Admin.api('DELETE', '/api/site/sites/' + id); sitesSheet(); }
function replacePost(d) { const i = posts.findIndex(p => p.id === d.id); if (i >= 0) posts[i] = d; else posts.push(d); }
async function digestOne(thread, id) {
  try { const d = await Admin.api('POST', `/api/site/${thread}/posts/${id}/digest`, {}); if (thread === cur) { replacePost(d); draw(); } }
  catch (e) {
    console.error('digest', id, e.message);
    // Mario, 2026-09-12: don't swallow this — the post needs a visible retry, not a silent stall
    if (thread === cur) { const p = posts.find(p => p.id === id); if (p) { p.error = 'could not read this post: ' + e.message; draw(); } }
  }
}
async function retry(id) {
  const p = posts.find(p => p.id === id); if (!p) return;
  const prevError = p.error;
  p.error = null; p.digesting = true; draw();
  try {
    const d = await Admin.api('POST', `/api/site/${cur}/posts/${id}/digest`, { force: true });
    replacePost(d); draw();
  } catch (e) {
    alert('Could not read this post: ' + e.message);
    p.digesting = false; p.error = prevError; draw();
  }
}
// pull down at the top of the feed to refresh (phone), like WhatsApp; the browser's own reload is a long way up
(function () {
  let y0 = null, pulled = 0; const hint = document.createElement('div'); hint.className = 'pull'; hint.textContent = '↓ pull to refresh';
  document.querySelector('main').prepend(hint);
  addEventListener('touchstart', e => { y0 = scrollY <= 0 ? e.touches[0].clientY : null; pulled = 0; }, { passive: true });
  addEventListener('touchmove', e => { if (y0 == null) return; pulled = e.touches[0].clientY - y0; hint.style.height = Math.min(48, Math.max(0, pulled / 2)) + 'px'; hint.textContent = pulled > 90 ? '↻ release to refresh' : '↓ pull to refresh'; }, { passive: true });
  addEventListener('touchend', async () => { const go = pulled > 90; y0 = null; pulled = 0; hint.style.height = go ? '48px' : '0'; if (go) { hint.textContent = 'refreshing…'; await Promise.all([loadThreads(), loadPosts(), loadDay()]); } hint.style.height = '0'; });
})();
async function loadPosts() {
  if (!cur) { el('feed').innerHTML = '<div class="empty">No thread is open to your account yet. Ask Mario.</div>'; setComposerEnabled(false); return; }
  const r = await Admin.api('GET', `/api/site/${cur}/posts?limit=100`);
  posts = r.posts; draw();
  // a digest that never ran (e.g. the phone lost signal), or one that hung mid-way, gets one chance to run now
  posts.filter(p => !p.error && (!p.digestedAt && !p.digesting || (p.digesting && p.digestingAt && Date.now() - Date.parse(p.digestingAt) > 120e3))).forEach(p => digestOne(cur, p.id));
}
function lineTag(p) {
  if (p.error) return `<div class="err">${esc(p.error)} · <a href="#" onclick="retry('${esc(p.id)}');return false;">retry</a></div>`;
  // Mario, 2026-09-12: a digest that hung (Vercel froze the function, no error ever came back)
  // shouldn't sit on "reading…" forever — offer the same retry after 2 minutes
  if (p.digesting && p.digestingAt && Date.now() - Date.parse(p.digestingAt) > 120e3) return `<div class="line">reading took too long · <a href="#" onclick="retry('${esc(p.id)}');return false;">retry</a></div>`;
  if (!p.digestedAt) return `<div class="line">reading…</div>`;
  if (!p.line) return p.parsed && p.parsed.receipt === false && (p.kind === 'photo' || p.kind === 'video') ? `<div class="line" style="background:#26352a;color:var(--green)">progress photo · <a href="#" onclick="flip('${esc(p.id)}');return false;">this is a receipt</a></div>` : '';
  const amt = p.parsed && (p.parsed.amount || 0);
  return `<div class="line ${esc(p.line.state || 'waiting')}">${amt ? amt.toFixed(2) + ' ' + esc(p.parsed.currency || 'USD') + ' · ' : ''}suggested on ${esc(p.line.accountId)} — ${p.line.state === 'accepted' ? 'accepted ✓' : p.line.state === 'dismissed' ? 'dismissed' : 'waiting for Mario\'s ✓'}${(p.kind === 'photo') ? ` · <a href="#" onclick="flip('${esc(p.id)}');return false;">not a receipt</a>` : ''}</div>`;
}
function draw() {
  if (!posts.length) { el('feed').innerHTML = '<div class="empty">Nothing here yet. Write what happened, send a photo, or record.</div>'; return; }
  let lastDay = '';
  el('feed').innerHTML = posts.map(p => {
    const dayHdr = p.date !== lastDay ? `<div class="day">${esc(dayLabel(p.date))}</div>` : ''; lastDay = p.date;
    const mine = p.by === me.email;
    if (p.deleted) return `${dayHdr}<div class="post ${mine ? 'me' : ''} gone" data-id="${esc(p.id)}">🚫 This message was deleted<div class="meta"><span>${esc(mine ? 'you' : p.by.split('@')[0])}</span><span>${hhmm(p.at)}</span></div></div>`;
    if (p.kind === 'start' || p.kind === 'finish') return `${dayHdr}<div class="post tap" data-id="${esc(p.id)}">${p.kind === 'start' ? '▶' : '■'} <b>${p.kind === 'start' ? 'Started' : 'Finished'} ${hhmm(p.at)}</b>${p.siteName ? ' · 📍 ' + esc(p.siteName) : p.loc ? ' · outside every site' : ' · no location'}${p.distanceM != null ? ` <span title="from the site’s centre">(${p.distanceM} m)</span>` : ''}${p.manual ? ` · entered by hand at ${hhmm(p.enteredAt)}` : ''}${p.noStart ? ' · ⚠ no Start before it' : ''}</div>`;
    const body = p.kind === 'photo' ? `<img src="/api/site/${cur}/posts/${p.id}/file" loading="lazy">`
      : p.kind === 'video' ? `<video src="/api/site/${cur}/posts/${p.id}/file" controls preload="metadata"></video>`
      : p.kind === 'voice' ? `<audio src="/api/site/${cur}/posts/${p.id}/file" controls></audio>${p.parsed && p.parsed.transcript ? `<div style="margin-top:6px;font-style:italic">${esc(p.parsed.transcript)}</div>` : ''}`
      : esc(p.text);
    const canDel = mine || me.admin;
    return `${dayHdr}<div class="post ${mine ? 'me' : ''}" data-id="${esc(p.id)}" ${canDel ? `oncontextmenu="event.preventDefault();askDelete('${esc(p.id)}')" ontouchstart="pressStart(event,'${esc(p.id)}')" ontouchend="pressEnd()" ontouchmove="pressEnd()"` : ''}>${body}${lineTag(p)}<div class="meta"><span>${esc(mine ? 'you' : p.by.split('@')[0])}</span><span>${hhmm(p.at)}</span></div></div>`;
  }).join('');
  const pane = el('chatpane'); pane.scrollTop = pane.scrollHeight; window.scrollTo(0, document.body.scrollHeight);
}
// long-press a message (or right-click on the laptop) → Delete, the WhatsApp way
let pressT = null;
function pressStart(e, id) { pressEnd(); pressT = setTimeout(() => { pressT = null; if (navigator.vibrate) navigator.vibrate(15); askDelete(id); }, 550); }
function pressEnd() { if (pressT) clearTimeout(pressT); pressT = null; }
function askDelete(id) {
  const p = posts.find(x => x.id === id); if (!p || p.deleted) return;
  closeSheet();
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet';
  sh.innerHTML = `<div class="card"><div class="t">${esc(p.kind === 'text' ? (p.text || '').slice(0, 80) : p.kind)}</div>
    <button class="del" onclick="doDelete('${esc(id)}')">🗑 Delete message</button><button onclick="closeSheet()">Cancel</button></div>`;
  sh.onclick = e => { if (e.target === sh) closeSheet(); };
  document.body.appendChild(sh);
}
function closeSheet() { const s = document.getElementById('sheet'); if (s) s.remove(); }
async function doDelete(id) {
  closeSheet();
  try { const gone = await Admin.api('DELETE', `/api/site/${cur}/posts/${id}`); replacePost(gone); draw(); }
  catch (e) { alert(e.message); }
}
async function sendText() {
  const t = el('text').value.trim(); if (!t || !cur) return;
  el('text').value = '';
  try {
    const p = await Admin.api('POST', `/api/site/${cur}/posts`, { kind: 'text', text: t });
    posts.push(p); draw();
    await digestOne(cur, p.id);
  } catch (e) { alert('Could not send: ' + e.message); el('text').value = t; }
}
function pick(accept, kind) { const f = el('file'); f.accept = accept; f.capture = kind === 'photo' ? 'environment' : ''; f.onchange = () => sendFile(f.files[0], kind); f.click(); }
// photos shrink to 1600 px on the phone; a video over 60 s is refused (the spec's phone-side limits)
async function sendFile(file, kind) {
  if (!file || !cur) return;
  let blob = file, mime = file.type, name = file.name;
  if (kind === 'photo') { blob = await shrink(file, 1600); mime = 'image/jpeg'; name = (name || 'photo').replace(/\.\w+$/, '') + '.jpg'; }
  if (kind === 'video') { const secs = await duration(file); if (secs > 60) return alert('Keep a video under 60 seconds.'); }
  if (blob.size > 4e6) return alert('The hub cannot take files over 4 MB yet — a photo is fine, keep videos for later.');
  const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  try {
    const p = await Admin.api('POST', `/api/site/${cur}/posts`, { kind, dataBase64: b64, mime, name });
    posts.push(p); draw();
    await digestOne(cur, p.id);
  } catch (e) { alert('Could not send: ' + e.message); }
}
function shrink(file, max) {
  return new Promise(res => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(b || file), 'image/jpeg', 0.85); };
    img.onerror = () => res(file); img.src = URL.createObjectURL(file); });
}
function duration(file) { return new Promise(res => { const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = () => res(v.duration || 0); v.onerror = () => res(0); v.src = URL.createObjectURL(file); }); }
let rec = null, chunks = [];
async function toggleRec() {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // mp4/AAC first: it plays everywhere (an iPhone stalls on webm); webm only where mp4 recording is missing (older Chrome)
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
    rec = new MediaRecorder(stream, { mimeType: mime }); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); el('recbtn').classList.remove('rec'); const b = new Blob(chunks, { type: mime }); rec = null; sendFile(new File([b], 'voice.' + (mime === 'audio/webm' ? 'webm' : 'm4a'), { type: mime }), 'voice'); };
    rec.start(); el('recbtn').classList.add('rec');
  } catch (e) { alert('Microphone not available: ' + e.message); }
}
// /flip re-reads the picture the other way (progress ↔ receipt); a 409 means the previous
// digest is still running — its `error` explains that, so surface it instead of retrying blind
async function flip(id) {
  try { const d = await Admin.api('POST', `/api/site/${cur}/posts/${id}/flip`, {}); replacePost(d); draw(); }
  catch (e) { alert(e.data && e.data.error ? e.data.error : e.message); }
}
const setHdr = () => document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
addEventListener('resize', setHdr); setHdr();
Admin.require('site', async m => {
  me = m;
  el('who').innerHTML = el('whofoot').innerHTML = `${esc(me.email)} <a href="#" onclick="Admin.signOut();return false;">Sign out</a>`;
  document.body.classList.add('has-composer');
  await loadThreads();
  const h = location.hash.slice(1);

  else if (innerWidth > 800 && threads[0]) open_(threads[0].id);
});
